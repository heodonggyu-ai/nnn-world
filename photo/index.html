<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF0F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="구도카메라">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="app.css">
<title>구도 카메라</title>
</head>
<body>
<script src="kit.js"></script>
<script src="styles.js"></script>
<script src="styles2.js"></script>
<script src="core.js"></script>
<script>
const BASIC_IDS=['thirds','golden','spiral','center','diagonal','horizonLow','horizonHigh','leading','triangle','frame','negative'];
const PORT_IDS=['close','portrait','off','profile','half','full','travel','selfie','two','group','action'];
window.APP_CONFIG={
  id:'photo',name:'구도 카메라',filePrefix:'gudo',
  theme:{bg:'#EEF0F3',card:'#FFFFFF',ink:'#15171C',sub:'#6B7180',line:'#DDE1E7',accent:'#FFC83D',accentInk:'#1A1400'},
  logo:'<svg viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="9" fill="#15171C"/><path d="M8 12.5V8h4.5M17.5 8H22v4.5M22 17.5V22h-4.5M12.5 22H8v-4.5" stroke="#FFC83D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18.6" cy="11.4" r="2" fill="#FFC83D"/></svg>',
  heroTitle:'카메라를 대면\n구도가 보여요',
  heroSub:'장면을 읽고 어울리는 구도를 골라, 어디로 움직이면 되는지 알려줘요.',
  heroIds:['st_back_walk','st_lake_mirror','st_blossom_tunnel','st_kubrick_1pt','st_sea_of_clouds','st_golden_backlight','st_colorful_stairs'],
  cats:['basic','portrait','people','couple','travel','land','street','film','master','food'],
  galleryTitle:'구도 갤러리',
  defaultPool:[...BASIC_IDS,...PORT_IDS],
  startPool:()=>({ids:[...BASIC_IDS,...PORT_IDS],auto:true}),
  helpTitle:'구도 카메라 사용법',
  help:'<b>1. 카메라 켜기</b> — 장면을 비추면 어울리는 구도를 자동으로 골라 화면에 깔아줘요. 위쪽 안내대로 폰을 움직이다 선이 초록색이 되면 찍으세요.<br><br><b>2. 구도 갤러리</b> — 사진가·영화감독·인플루언서 기법을 그림으로 보고, ‘이 구도로 촬영’을 누르면 그 가이드가 깔린 채로 카메라가 열려요.<br><br><b>3. 촬영 도구</b> — 연사(1·3·6장), 타이머(3·10초), 좌우 뒤집기, 찍어둔 사진 분석, 수평계, 줌.<br><br><b>4. 저장</b> — 아이폰은 저장 → ‘이미지 저장’, 안드로이드는 바로 갤러리에 저장돼요.<br><br>홈 화면에 추가하면 앱처럼 쓸 수 있어요: 사파리 → 공유 → 홈 화면에 추가.',
};
</script>
<script src="app.js"></script>
</body>
</html>
