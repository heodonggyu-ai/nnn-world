<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="구도카메라">
<title>구도 카메라</title>
<style>
:root{--acc:#ffd84d;--ok:#4dff9a;--bg:#0d0d0f;--panel:#17171b;--line:#2a2a31;--txt:#f2f2f2;--sub:#9a9aa3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.3px}
header h1 span{color:var(--acc)}
.hbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px}
#view{position:relative;background:#000;border-radius:14px;overflow:hidden;touch-action:manipulation}
#view video,#view #still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#view video.mirror{transform:scaleX(-1)}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.62);backdrop-filter:blur(6px);padding:7px 13px;border-radius:18px;font-size:14px;font-weight:700;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;transition:background .2s}
#hint.ok{background:rgba(20,140,70,.85)}
#hint:empty{display:none}
#stip{position:absolute;right:10px;top:52px;background:rgba(0,0,0,.55);padding:4px 9px;border-radius:10px;font-size:12px;color:var(--acc);font-weight:800;display:none}
.sech{grid-column:1/-1;margin:14px 0 0;font-size:16px}.snote{grid-column:1/-1;margin:0;color:var(--sub);font-size:13px;line-height:1.5}
.card .who{color:#ffb86b;font-size:11px;font-weight:800;margin-bottom:3px}.card ol{margin:0 0 8px;padding-left:17px;font-size:12px;line-height:1.5;color:var(--txt)}
#gname{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);padding:4px 9px;border-radius:10px;font-size:12px;color:var(--acc);font-weight:700}
#level{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);padding:4px 9px;border-radius:10px;font-size:12px;font-weight:700;display:none}
#level.ok{color:var(--ok)}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,#23232b,#0d0d0f)}
#start .big{font-size:22px;font-weight:800;line-height:1.35}
#start p{color:var(--sub);font-size:14px;line-height:1.5;margin:0 0 6px}
.pbtn{background:var(--acc);color:#111;border:0;border-radius:14px;padding:13px 20px;font-size:16px;font-weight:800;width:240px}
.sbtn{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:12px 20px;font-size:15px;font-weight:700;width:240px}
#err{color:#ff9b8a;font-size:13px;line-height:1.5}
#bottom{padding:6px 0 8px}
#recs{display:flex;gap:6px;padding:0 10px 6px;overflow-x:auto;scrollbar-width:none;min-height:40px;align-items:center}
#recs::-webkit-scrollbar,#chips::-webkit-scrollbar{display:none}
.rec{flex:none;background:rgba(255,216,77,.12);border:1px solid rgba(255,216,77,.45);color:var(--txt);border-radius:12px;padding:5px 10px;font-size:12px;text-align:left;line-height:1.25}
.rec b{color:var(--acc);font-size:13px}
.rec small{color:var(--sub);display:block}
.rec.on{background:var(--acc);color:#111}.rec.on b,.rec.on small{color:#111}
.reclbl{flex:none;font-size:11px;color:var(--sub);font-weight:700}
#chips{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:18px;padding:7px 12px;font-size:13px;font-weight:600}
.chip.tab{background:#22222a;color:var(--sub)}.chip.tab.t-on{background:#3a3220;color:var(--acc);border-color:var(--acc)}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.chip.on{background:var(--txt);color:#111;border-color:var(--txt)}
#controls{display:flex;align-items:center;justify-content:space-around;padding:2px 16px}
.cbtn{width:54px;height:54px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--txt);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1}
.cbtn .i{font-size:19px}
.cbtn.on{border-color:var(--acc);color:var(--acc)}
#shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:transparent;padding:4px}
#shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .1s}
#shutter:active i{transform:scale(.88)}
#shutter.ok{border-color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;z-index:10;flex-direction:column}
.modal.show{display:flex}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font-size:17px}
.mbody{flex:1;overflow-y:auto;padding:12px;background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card canvas{display:block;width:100%;aspect-ratio:3/4}
.card .ct{padding:9px 10px 11px}
.card h3{margin:0 0 4px;font-size:15px}
.card p{margin:0 0 6px;font-size:12px;color:var(--sub);line-height:1.45}
.card .tip{color:var(--acc);font-size:12px;line-height:1.4;margin-bottom:8px}
.card button{width:100%;background:var(--acc);border:0;border-radius:9px;padding:8px;font-weight:800;font-size:13px;color:#111}
.toggle{font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center}
#pv .mbody{display:flex;flex-direction:column;align-items:center;gap:12px}
#pv img{max-width:100%;max-height:65vh;border-radius:12px}
#pv .row{display:flex;gap:10px}
#pv .row a,#pv .row button{background:var(--acc);color:#111;border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:15px;text-decoration:none}
#pv .row .s2{background:var(--panel);color:var(--txt);border:1px solid var(--line)}
#pv .note{color:var(--sub);font-size:12px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header>
    <div style="display:flex;align-items:center;gap:8px"><button class="hbtn" id="btnHome" style="display:none">← 처음</button><h1>구도 <span>카메라</span></h1></div>
    <div style="display:flex;gap:6px">
      <button class="hbtn" id="btnAspect">3:4</button>
      <button class="hbtn" id="btnSamples">📚 샘플</button>
    </div>
  </header>
  <div id="stage">
    <div id="view">
      <video id="vid" playsinline muted autoplay></video>
      <img id="still" alt="">
      <canvas id="ov"></canvas>
      <div id="hint"></div>
      <div id="gname"></div>
      <div id="stip"></div>
      <div id="level"></div>
      <div id="start">
        <div class="big">좋은 구도를<br>화면에 깔고 찍어요</div>
        <p>카메라를 대면 장면을 분석해서<br>어울리는 구도를 추천하고 맞추는 방법을 알려줘요.</p>
        <button class="pbtn" id="btnCam">📷 카메라 켜기</button>
        <button class="sbtn" id="btnPhoto">🖼 사진으로 분석하기</button>
        <button class="sbtn" id="btnSamples2">🎨 작품·인플루언서 스타일</button>
        <div id="err"></div>
      </div>
    </div>
  </div>
  <div id="bottom">
    <div id="recs"><span class="reclbl">카메라를 대면 추천 구도가 여기에 떠요</span></div>
    <div id="chips"></div>
    <div id="controls">
      <button class="cbtn on" id="btnAuto"><span class="i">✨</span>자동</button>
      <button class="cbtn" id="btnGallery"><span class="i">🖼</span>사진</button>
      <button id="shutter"><i></i></button>
      <button class="cbtn" id="btnFlip"><span class="i">🔄</span>전환</button>
      <button class="cbtn" id="btnMirror"><span class="i">⇋</span>뒤집기</button>
    </div>
  </div>
</div>

<div class="modal" id="samples">
  <div class="mhead"><h2>📚 기본 구도 샘플</h2><button class="hbtn" data-close>닫기</button></div>
  <div class="mbody"><div id="stabs" style="display:flex;gap:6px;margin-bottom:12px"></div><div class="grid" id="grid"></div></div>
</div>

<div class="modal" id="pv">
  <div class="mhead"><h2>찍은 사진</h2><button class="hbtn" data-close>닫기</button></div>
  <div class="mbody">
    <img id="pvimg" alt="찍은 사진">
    <div class="row"><button id="pvsave">📥 사진첩에 저장</button></div>
    <div class="note">아이폰: 저장 누르고 → 아래 메뉴에서 <b>‘이미지 저장’</b><br>안드로이드: 저장 누르면 갤러리(다운로드)에 저장돼요<br>또는 사진을 길게 눌러 ‘사진에 저장’</div>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>

<script src="styles.js"></script>
<script>
(()=>{
const PHI=(1+Math.sqrt(5))/2;
const $=id=>document.getElementById(id);
const vid=$('vid'),still=$('still'),ov=$('ov'),view=$('view'),stage=$('stage'),hintEl=$('hint');

const GUIDES=[
 {id:'thirds',name:'삼분할',desc:'화면을 가로·세로 3등분해 선이나 교차점에 주인공을 둡니다.',when:'거의 모든 사진의 기본 — 풍경·인물·사물',tip:'주인공(눈, 나무, 사람)을 네 교차점 중 하나에.'},
 {id:'golden',name:'황금분할',desc:'1 : 1.618 비율 선. 삼분할보다 중심 쪽으로 살짝 모여 더 자연스럽습니다.',when:'건물·등대·인물 전신',tip:'주인공을 안쪽 교차점에, 수평선은 0.618 선에.'},
 {id:'spiral',name:'황금나선',desc:'나선이 감겨 들어가는 끝점에 주인공을 두면 시선이 자연스럽게 흘러갑니다.',when:'꽃·동물·인물 클로즈업, 곡선 있는 장면',tip:'나선 끝 = 주인공. 나선 방향은 자동으로 맞춰져요.'},
 {id:'center',name:'중앙·대칭',desc:'주인공을 정중앙에, 좌우를 거울처럼 맞춥니다.',when:'건물 정면, 반영(물에 비친 모습), 길 끝, 정면 인물',tip:'중앙선을 정확히 맞추고 수평을 꼭 지키세요.'},
 {id:'diagonal',name:'대각선',desc:'선이나 피사체를 대각선 방향으로 배치해 역동성을 줍니다.',when:'계단·강·다리·운동 장면(복싱 펀치!)',tip:'모서리에서 모서리로 이어지게 배치.'},
 {id:'horizonLow',name:'수평선 아래',desc:'수평선을 아래 1/3에 — 하늘이 2/3를 차지합니다.',when:'노을·구름이 멋진 하늘',tip:'하늘이 주인공일 때. 수평선은 꼭 수평으로.'},
 {id:'horizonHigh',name:'수평선 위',desc:'수평선을 위 1/3에 — 땅·바다가 2/3를 차지합니다.',when:'꽃밭·해변·들판, 밋밋한 하늘',tip:'하늘이 심심하면 땅을 많이 담으세요.'},
 {id:'leading',name:'소실점·리딩라인',desc:'길·선로·복도처럼 한 점으로 모이는 선이 시선을 끌고 갑니다.',when:'도로·복도·철길·다리',tip:'선이 모이는 점을 중앙이나 1/3 지점에.'},
 {id:'triangle',name:'삼각 구도',desc:'아래가 넓고 위가 뾰족한 삼각형으로 안정감을 줍니다.',when:'산·단체사진·앉은 인물',tip:'꼭짓점을 위쪽 중앙에, 밑변을 넓게.'},
 {id:'frame',name:'프레임 속 프레임',desc:'창문·문·나뭇가지로 테두리를 만들어 주인공을 가둡니다.',when:'창가·터널·아치·문틀',tip:'앞쪽 테두리는 어둡게, 안쪽 주인공은 밝게.'},
 {id:'negative',name:'여백(미니멀)',desc:'작은 주인공 + 넓은 빈 공간으로 감성을 줍니다.',when:'하늘의 새, 바다의 배, 단색 벽 앞 사람',tip:'주인공은 작게, 바라보는 방향에 여백을.'},
];
GUIDES.forEach(g=>g.cat='g');
const PGUIDES=[
 {id:'close',name:'얼굴 클로즈업',desc:'얼굴로 화면을 채웁니다. 눈은 위 1/3 선에, 이마·정수리는 잘려도 괜찮아요.',when:'표정·감정을 담을 때, 프로필 사진',tip:'정수리는 과감히 잘라도 OK, 턱은 자르지 마세요.'},
 {id:'portrait',name:'상반신 정면',desc:'가슴 위까지 담고 눈높이를 위 1/3 선에 맞춥니다.',when:'증명·프로필·인터뷰 사진',tip:'머리 위 여백은 조금만, 어깨 수평 맞추기.'},
 {id:'off',name:'오프센터 상반신',desc:'얼굴을 왼쪽·오른쪽 1/3 선에 두고 바라보는 쪽에 여백을 둡니다.',when:'카페·창가·자연스러운 일상',tip:'시선이 향하는 쪽을 넓게 비워두세요.'},
 {id:'profile',name:'옆모습',desc:'옆을 보는 얼굴을 1/3 선에, 코가 향하는 쪽에 넓은 공간을 둡니다.',when:'노을·창가 실루엣, 생각하는 장면',tip:'코 앞 공간을 뒤통수 뒤 공간보다 넓게.'},
 {id:'half',name:'허벅지샷',desc:'머리부터 허벅지 중간까지 담고, 관절(허리·무릎)에서는 자르지 않습니다.',when:'옷 코디·데일리룩·운동복',tip:'허벅지 중간에서 자르면 다리가 길어 보여요.'},
 {id:'full',name:'전신',desc:'머리 위는 조금, 발끝까지 전부 담습니다. 폰을 허리 아래로 낮추면 다리가 길어 보여요.',when:'OOTD·여행 기념·체형 사진',tip:'발끝을 화면 맨 아래 가까이, 폰은 낮게.'},
 {id:'travel',name:'여행 인물+배경',desc:'사람은 작게 1/3 선에 두고 배경이 화면 대부분을 차지하게. 수평선은 1/3 선에.',when:'여행지·명소·풍경 앞 기념사진',tip:'사람을 가운데 말고 옆으로 — 배경을 살리세요.'},
 {id:'selfie',name:'셀카',desc:'얼굴을 살짝 위에 두고 폰을 눈보다 조금 높게 듭니다.',when:'전면 카메라 셀카',tip:'폰은 눈보다 살짝 위, 턱은 살짝 당기기.'},
 {id:'two',name:'2인 (커플·친구)',desc:'두 얼굴을 왼쪽·오른쪽 1/3 근처에 두고 눈높이를 살짝 다르게.',when:'커플·친구·관장님과 회원 기념샷',tip:'얼굴 높이가 엇갈리면 더 자연스러워요.'},
 {id:'group',name:'단체 삼각 배치',desc:'얼굴들이 삼각형을 이루게 — 가운데를 높게, 양 끝을 낮게.',when:'단체·대회 기념·가족사진',tip:'앞줄은 앉거나 무릎 꿇고, 뒷줄은 서서.'},
 {id:'action',name:'액션 (복싱·운동)',desc:'몸을 1/3 선에 두고 펀치·움직이는 방향에 공간을 둡니다.',when:'미트·스파링·운동 장면',tip:'주먹이 뻗는 쪽을 비우면 속도감이 살아요.'},
];
PGUIDES.forEach(g=>g.cat='p');GUIDES.push(...PGUIDES);
const SG=(window.PHOTO_STYLES?PHOTO_STYLES.list:[]).map(st=>({id:'st_'+st.id,cat:'s',name:st.name,desc:st.desc,when:st.who,tip:st.steps[0],style:st}));
GUIDES.push(...SG);
const G=Object.fromEntries(GUIDES.map(g=>[g.id,g]));

// ---------- state ----------
let mode='idle'; // idle | live | still
let active='thirds', auto=true, facing='environment', mirror=false;
let spiralManual=false, chipCat='g', pSide='L', pSideManual=false;
let stream=null, feat=null, ema={}, cand=null, candN=0, spiralFlip={x:false,y:false};
const ASPECTS=[[3,4],[9,16],[1,1]]; let ai=0, stillAR=null;
let level=null, aligned=false;

// ---------- spiral geometry (landscape golden rect, normalized) ----------
const SP=(()=>{
  let x=0,y=0,w=PHI,h=1; const pts=[],sq=[];
  for(let k=0;k<12;k++){
    const d=k%4; let s,cx,cy;
    if(d===0){s=h;cx=x+s;cy=y+s;sq.push([x,y,s]);x+=s;w-=s}
    else if(d===1){s=w;cx=x;cy=y+s;sq.push([x,y,s]);y+=s;h-=s}
    else if(d===2){s=h;cx=x+w-s;cy=y;sq.push([x+w-s,y,s]);w-=s}
    else {s=w;cx=x+s;cy=y+h-s;sq.push([x,y+h-s,s]);h-=s}
    const a0=(180+90*d)*Math.PI/180;
    for(let i=0;i<=16;i++){const a=a0+i/16*Math.PI/2;pts.push([(cx+Math.cos(a)*s)/PHI,cy+Math.sin(a)*s])}
  }
  const e=pts[pts.length-1];
  return {pts,sq:sq.map(([a,b,s])=>[a/PHI,b,s/PHI,s]),end:e};
})();
function spMap(u,v,portrait,fx,fy){let nx=portrait?v:u,ny=portrait?u:v;if(fx)nx=1-nx;if(fy)ny=1-ny;return[nx,ny]}
function spiralEnd(portrait,fx,fy){return spMap(SP.end[0],SP.end[1],portrait,fx,fy)}

// target point for a guide (normalized) given subject
function targetFor(id,f,W,H){
  const sx=f?f.cx:.5, sy=f?f.cy:.5;
  if(id==='thirds'||id==='negative'){return [sx<.5?1/3:2/3, sy<.5?1/3:2/3]}
  if(id==='golden'){const a=1-1/PHI,b=1/PHI;return [sx<.5?a:b, sy<.5?a:b]}
  if(id==='spiral'){return spiralEnd(H>W,spiralFlip.x,spiralFlip.y)}
  if(id==='center'){return [.5,.5]}
  if(id==='portrait'){return [.5,.3]}
  return null;
}

function pLayout(id,side){
  const sx=side==='R'?2/3:1/3,dir=side==='R'?-1:1;
  const P=(x,eye,u,ext,ex={})=>Object.assign({x,top:eye-.45*u,u,ext,dir},ex);
  let figs,ex={};
  switch(id){
    case 'close':figs=[P(.5,1/3,.55,'bust')];ex.eye=1/3;break;
    case 'portrait':figs=[P(.5,1/3,.27,'bust')];ex.eye=1/3;break;
    case 'off':figs=[P(sx,1/3,.25,'bust')];ex.eye=1/3;ex.look=1;break;
    case 'profile':figs=[P(sx,.36,.28,'bust',{prof:1})];ex.eye=.36;ex.look=1;break;
    case 'half':figs=[{x:.5,top:.06,u:.196,ext:'half',dir}];ex.cut='half';break;
    case 'full':figs=[{x:.5,top:.05,u:.118,ext:'full',dir}];ex.cut='full';break;
    case 'travel':figs=[{x:sx,top:.52,u:.05,ext:'full',dir}];ex.hz=1/3;ex.look=1;break;
    case 'selfie':figs=[P(.5,.4,.36,'bust')];ex.eye=.4;ex.selfie=1;break;
    case 'two':figs=[P(.36,1/3,.2,'bust',{dir:1}),P(.64,1/3+.045,.2,'bust',{dir:-1})];break;
    case 'group':figs=[[.5,.27],[.3,.37],[.7,.37],[.13,.47],[.87,.47]].map(([x,e])=>P(x,e,.1,'bust'));ex.tri=1;break;
    case 'action':figs=[{x:sx,top:.1,u:.17,ext:'half',dir,act:1}];ex.look=1;break;
  }
  const fc=figs.map(g=>[g.x,g.top+.55*g.u]);
  const faceT=[fc.reduce((a,b)=>a+b[0],0)/fc.length,fc.reduce((a,b)=>a+b[1],0)/fc.length];
  return Object.assign({figs,faceT,fhT:figs[0].u*.8,side,dir},ex);
}
function drawFigure(c,fg,W,H,fill,col){
  const px=fg.x*W,U=fg.u*H,T=fg.top*H,d=fg.dir||1;
  const side=sg=>{const P=[[px+sg*.17*U,T+.95*U],[px+sg*.17*U,T+1.2*U],[px+sg*1.0*U,T+1.6*U]];
    if(fg.ext==='bust')P.push([px+sg*1.12*U,T+3.8*U]);else P.push([px+sg*.8*U,T+3.0*U],[px+sg*.88*U,T+3.9*U],[px+sg*.72*U,T+5.6*U],[px+sg*.55*U,T+7.45*U]);return P};
  const path=(pts,close)=>{c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));if(close)c.closePath()};
  const gx=px+d*1.95*U,gy=T+1.75*U;
  if(fill){
    c.fillStyle=col.shirt;path([...side(-1),...side(1).reverse()],1);c.fill();
    if(fg.ext!=='bust'){c.fillStyle=col.pants;path([[px-.88*U,T+3.9*U],[px+.88*U,T+3.9*U],[px+.55*U,T+7.45*U],[px+.14*U,T+7.45*U],[px,T+4.3*U],[px-.14*U,T+7.45*U],[px-.55*U,T+7.45*U]],1);c.fill();
      c.fillStyle='#222';[-1,1].forEach(sg=>{c.beginPath();c.ellipse(px+sg*.36*U,T+7.5*U,.26*U,.1*U,0,0,7);c.fill()})}
    if(fg.act){c.strokeStyle=col.shirt;c.lineWidth=.38*U;c.lineCap='round';c.beginPath();c.moveTo(px+d*.8*U,T+1.75*U);c.lineTo(gx,gy);c.stroke();circ(c,gx,gy,.38*U,'#d8262e');
      circ(c,px-d*.35*U,T+1.15*U,.36*U,'#d8262e')}
    c.fillStyle=col.skin;c.fillRect(px-.17*U,T+.8*U,.34*U,.45*U);c.beginPath();c.ellipse(px,T+.5*U,.38*U,.5*U,0,0,7);c.fill();
    if(fg.prof){c.beginPath();c.moveTo(px+d*.34*U,T+.42*U);c.lineTo(px+d*.5*U,T+.6*U);c.lineTo(px+d*.32*U,T+.66*U);c.fill()}
    c.fillStyle=col.hair;c.beginPath();c.ellipse(px-(fg.prof?d*.08*U:0),T+.3*U,.42*U,.34*U,0,Math.PI,0);c.fill();
    if(col.long){c.fillRect(px-.44*U,T+.3*U,.16*U,.9*U);c.fillRect(px+.28*U,T+.3*U,.16*U,.9*U)}
    if(!fg.prof){circ(c,px-.14*U,T+.47*U,Math.max(1,.04*U),'#2b1d17');circ(c,px+.14*U,T+.47*U,Math.max(1,.04*U),'#2b1d17')}
    else circ(c,px+d*.2*U,T+.46*U,Math.max(1,.04*U),'#2b1d17');
    return;
  }
  c.beginPath();c.ellipse(px,T+.5*U,.38*U,.5*U,0,0,7);c.stroke();
  path(side(-1));c.stroke();path(side(1));c.stroke();
  if(fg.ext==='full'||fg.ext==='half'){[-1,1].forEach(sg=>{path([[px,T+4.3*U],[px+sg*.14*U,T+7.45*U]]);c.stroke()})}
  if(fg.prof){path([[px+d*.34*U,T+.42*U],[px+d*.5*U,T+.6*U],[px+d*.32*U,T+.66*U]]);c.stroke()}
  if(fg.act){path([[px+d*.9*U,T+1.7*U],[gx-d*.38*U,gy]]);c.stroke();c.beginPath();c.arc(gx,gy,.38*U,0,7);c.stroke()}
}
function arrow(c,x1,y1,x2,y2,lw){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();const a=Math.atan2(y2-y1,x2-x1),h=lw*5;
  c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-h*Math.cos(a-.5),y2-h*Math.sin(a-.5));c.moveTo(x2,y2);c.lineTo(x2-h*Math.cos(a+.5),y2-h*Math.sin(a+.5));c.stroke()}
function drawPGuide(c,id,W,H,opt){

  c.save();c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=opt.noShadow?0:3;
  c.font=`700 ${fs}px sans-serif`;
  const L=(x1,y1,x2,y2)=>{c.beginPath();c.moveTo(x1*W,y1*H);c.lineTo(x2*W,y2*H);c.stroke()};
  const txt=(t,x,y,cl)=>{c.save();c.fillStyle=cl||col;c.fillText(t,x,y);c.restore()};
  if(sp.look||id==='two'){c.globalAlpha=.3;[1/3,2/3].forEach(t=>L(t,0,t,1));c.globalAlpha=1}
  if(sp.eye!=null){c.setLineDash([4*lw,4*lw]);c.globalAlpha=.75;L(0,sp.eye,1,sp.eye);c.globalAlpha=1;c.setLineDash([]);txt('눈높이',8,sp.eye*H-7)}
  if(sp.hz){c.lineWidth=lw*1.8;L(0,sp.hz,1,sp.hz);c.lineWidth=lw;txt('수평선',8,sp.hz*H-7)}

  if(sp.tri){const f=sp.figs,p=i=>[f[i].x,f[i].top+.5*f[i].u];c.setLineDash([5*lw,4*lw]);c.beginPath();[0,3,4].forEach((i,k)=>{const q=p(i);k?c.lineTo(q[0]*W,q[1]*H):c.moveTo(q[0]*W,q[1]*H)});c.closePath();c.stroke();c.setLineDash([])}
  if(sp.look){const fg=sp.figs[0],d=sp.dir,y=(fg.top+.45*fg.u)*H+(id==='travel'?0:0),x0=(fg.x+d*.1)*W,x1=(fg.x+d*.42)*W;

  if(sp.cut==='half'){const fg=sp.figs[0],wy=fg.top+3.0*fg.u;c.strokeStyle=red;c.setLineDash([4*lw,3*lw]);L(.12,wy,.88,wy);c.setLineDash([]);txt('✕ 허리에서 자르지 않기',W*.04,wy*H-6,red);txt('✓ 허벅지 중간에서 자르기',W*.04,botY,grn)}
  if(sp.cut==='full'){txt('✓ 발끝까지 다 담기',W*.04,botY,grn);txt('📱 폰은 허리보다 낮게',W*.04,topY,grn)}
  if(id==='close')txt('이마는 잘려도 OK · 턱은 ✕',W*.04,topY);
  if(sp.selfie)txt('📱 폰을 눈보다 살짝 위로',W*.04,topY,grn);
  c.restore();
}

function drawGuide(c,id,W,H,opt={}){
  if(G[id]&&G[id].style){PHOTO_STYLES.drawGuide(G[id].style.id,c,W,H,{color:opt.color,lw:opt.lw,sample:opt.sample});return}
  if(G[id]&&G[id].cat==='p'){drawPGuide(c,id,W,H,opt);return}
  const col=opt.color||'rgba(255,216,77,.9)', lw=opt.lw||Math.max(1.5,W/260);
  c.save();c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';
  c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=opt.noShadow?0:3;
  const L=(x1,y1,x2,y2)=>{c.beginPath();c.moveTo(x1*W,y1*H);c.lineTo(x2*W,y2*H);c.stroke()};
  const dot=(x,y,r)=>{c.beginPath();c.arc(x*W,y*H,r||lw*3,0,7);c.fill()};
  const dash=a=>c.setLineDash(a?a.map(v=>v*lw):[]);
  switch(id){
    case 'thirds':
      [1/3,2/3].forEach(t=>{L(t,0,t,1);L(0,t,1,t)});[1/3,2/3].forEach(x=>[1/3,2/3].forEach(y=>dot(x,y)));break;
    case 'golden':{const a=1-1/PHI,b=1/PHI;[a,b].forEach(t=>{L(t,0,t,1);L(0,t,1,t)});[a,b].forEach(x=>[a,b].forEach(y=>dot(x,y)));break}
    case 'spiral':{
      const p=H>W,fx=opt.fx??spiralFlip.x,fy=opt.fy??spiralFlip.y;
      c.globalAlpha=.4;SP.sq.slice(0,7).forEach(([u,v,su,sv])=>{
        const a=spMap(u,v,p,fx,fy),b=spMap(u+su,v+sv,p,fx,fy);
        c.strokeRect(Math.min(a[0],b[0])*W,Math.min(a[1],b[1])*H,Math.abs(b[0]-a[0])*W,Math.abs(b[1]-a[1])*H)});
      c.globalAlpha=1;c.lineWidth=lw*1.4;c.beginPath();
      SP.pts.forEach(([u,v],i)=>{const q=spMap(u,v,p,fx,fy);i?c.lineTo(q[0]*W,q[1]*H):c.moveTo(q[0]*W,q[1]*H)});c.stroke();
      const e=spiralEnd(p,fx,fy);dot(e[0],e[1],lw*3.5);break}
    case 'center':
      dash([4,4]);L(.5,0,.5,1);L(0,.5,1,.5);dash();c.beginPath();c.arc(W/2,H/2,Math.min(W,H)*.12,0,7);c.stroke();dot(.5,.5);break;
    case 'diagonal':{
      L(0,1,1,0);dash([4,4]);L(0,0,1,1);

      const k=(W*W)/(W*W+H*H);L(0,0,k,1-k);L(1,1,1-k,k);dash();break}
    case 'horizonLow':case 'horizonHigh':{
      const y=id==='horizonLow'?2/3:1/3;c.globalAlpha=.45;L(0,1/3,1,1/3);L(0,2/3,1,2/3);c.globalAlpha=1;
      c.lineWidth=lw*2.2;L(0,y,1,y);c.font=`700 ${Math.max(11,W/26)}px sans-serif`;c.fillText('수평선',8,y*H-8);
      c.globalAlpha=.8;c.fillText(id==='horizonLow'?'하늘 2/3':'하늘 1/3',8,(id==='horizonLow'?1/3:1/6)*H);c.fillText(id==='horizonLow'?'땅 1/3':'땅 2/3',8,(id==='horizonLow'?5/6:2/3+1/6)*H);break}
    case 'leading':{
      const vx=.5,vy=.42;[[0,1],[1,1],[0,.68],[1,.68],[.27,1],[.73,1],[0,.12],[1,.12]].forEach(([x,y],i)=>{c.globalAlpha=i<6?1:.45;L(x,y,vx,vy)});

      c.font=`700 ${Math.max(11,W/26)}px sans-serif`;c.fillText('테두리(창·문·나무)',m*W,m*H-6);dot(.5,.5);break}
    case 'portrait':{
      const r=Math.min(W,H);dash([4,4]);L(0,1/3,1,1/3);dash();

    case 'negative':{
      c.globalAlpha=.3;[1/3,2/3].forEach(t=>{L(t,0,t,1);L(0,t,1,t)});c.globalAlpha=1;

      c.font=`700 ${Math.max(12,W/20)}px sans-serif`;c.globalAlpha=.75;c.fillText('여  백',(t[0]<.5?.6:.15)*W,(t[1]<.5?.75:.3)*H);break}
  }
  c.restore();
}

const AW=72,acv=document.createElement('canvas'),actx=acv.getContext('2d',{willReadFrequently:true});
function getCrop(sw,sh,ar){if(sw/sh>ar){const cw=sh*ar;return{x:(sw-cw)/2,y:0,w:cw,h:sh}}const ch=sw/ar;return{x:0,y:(sh-ch)/2,w:sw,h:ch}}
function analyze(src,sw,sh,mir){
  const ar=curAR(),AH=Math.max(24,Math.round(AW/ar));acv.width=AW;acv.height=AH;
  const cr=getCrop(sw,sh,ar);actx.save();if(mir){actx.translate(AW,0);actx.scale(-1,1)}
  actx.drawImage(src,cr.x,cr.y,cr.w,cr.h,0,0,AW,AH);actx.restore();
  const d=actx.getImageData(0,0,AW,AH).data,N=AW*AH;
  const lum=new Float32Array(N);let mR=0,mG=0,mB=0,mL=0;
  let skinN=0;const mask=new Uint8Array(N);
  for(let i=0;i<N;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2];const l=.299*r+.587*g+.114*b;lum[i]=l;mR+=r;mG+=g;mB+=b;mL+=l;
    const cb=128-.168736*r-.331264*g+.5*b,cr2=128+.5*r-.418688*g-.081312*b;
    if(cb>=77&&cb<=127&&cr2>=137&&cr2<=173&&l>45&&r>g&&r>b){skinN++;mask[i]=1}}
  mR/=N;mG/=N;mB/=N;mL/=N;
  let lv=0;for(let i=0;i<N;i++)lv+=(lum[i]-mL)**2;const std=Math.sqrt(lv/N);
  // sobel
  const mag=new Float32Array(N),gxA=new Float32Array(N),gyA=new Float32Array(N);let mm=0;
  for(let y=1;y<AH-1;y++)for(let x=1;x<AW-1;x++){const i=y*AW+x,
    a=lum[i-AW-1],b=lum[i-AW],c=lum[i-AW+1],e=lum[i-1],f=lum[i+1],g=lum[i+AW-1],h=lum[i+AW],k=lum[i+AW+1];
    const gx=(c+2*f+k)-(a+2*e+g),gy=(g+2*h+k)-(a+2*b+c);gxA[i]=gx;gyA[i]=gy;const m=Math.hypot(gx,gy);mag[i]=m;mm+=m}
  mm/=N;const thr=Math.max(70,mm*1.8);
  let strong=0,diagN=0,slL=0,slLn=0,bsR=0,bsRn=0,tslL=0,tbsR=0,tLn=0,tRn=0,topD=0,botD=0,bord=0,bordN=0,cen=0,cenN=0;
  const rowH=new Float32Array(AH),rowCov=new Float32Array(AH);
  const mb=Math.round(AW*.15),mbY=Math.round(AH*.15);
  for(let y=1;y<AH-1;y++)for(let x=1;x<AW-1;x++){const i=y*AW+x,m=mag[i];
    const isB=x<mb||x>=AW-mb||y<mbY||y>=AH-mbY;if(isB){bordN++;if(m>thr)bord++}else{cenN++;if(m>thr)cen++}
    if(y<AH/2)topD+=m;else botD+=m;
    if(m<=thr)continue;strong++;
    const gx=gxA[i],gy=gyA[i],ax=Math.abs(gx),ay=Math.abs(gy);
    if(ay>2.2*ax){rowH[y]+=m;rowCov[y]++}
    const ang=Math.atan2(ay,ax)*180/Math.PI; // 0: vertical line, 90: horizontal line
    const isDiag=ang>22&&ang<68; if(isDiag)diagN++;

  profile:(c,w,h)=>grad(c,w,h,['#4b3a78','#e47a6c','#ffcf8a']),

function scenePortrait(c,w,h,id){PBG[id](c,w,h);const sp=pLayout(id,'L');
  const order=sp.figs.map((f,i)=>[f,i]).sort((a,b)=>a[0].top-b[0].top);
  order.forEach(([f,i])=>drawFigure(c,f,w,h,true,PCOL[(i+(id==='portrait'||id==='close'||id==='selfie'||id==='off'||id==='profile'||id==='full'||id==='half'?1:0))%PCOL.length]))}
let sampleCat='s',showGuide=true;

  $('stabs').innerHTML=`<button class="chip tab${sampleCat==='p'?' t-on':''}" data-scat="p">👤 인물 구도 ${PGUIDES.length}</button><button class="chip tab${sampleCat==='g'?' t-on':''}" data-scat="g">🏞 일반 ${GUIDES.filter(g=>g.cat==='g').length}</button>`;
  $('stabs').innerHTML=`<button class="chip tab${sampleCat==='s'?' t-on':''}" data-scat="s">🎨 작품·인플루언서 ${SG.length}</button>`+$('stabs').innerHTML;

    document.querySelectorAll('canvas[data-s]').forEach(cv=>{const c=cv.getContext('2d'),id=G[cv.dataset.s].style.id;PHOTO_STYLES.drawScene(id,c,300,400);if(showGuide)PHOTO_STYLES.drawGuide(id,c,300,400,{lw:2,sample:1})});
    return}
  const list=GUIDES.filter(g=>g.cat===sampleCat);
  $('grid').innerHTML=list.map(g=>`<div class="card"><canvas data-s="${g.id}" width="300" height="400"></canvas><div class="ct"><h3>${g.name}</h3><p>${g.desc}</p><p>📍 ${g.when}</p><div class="tip">💡 ${g.tip}</div><button data-use="${g.id}">이 구도로 찍기</button></div></div>`).join('');

buildSamples();
$('grid').onclick=e=>{const cv=e.target.closest('canvas[data-s]');if(cv&&G[cv.dataset.s].style){const c=cv.getContext('2d'),id=G[cv.dataset.s].style.id;cv.dataset.off=cv.dataset.off?'':'1';c.clearRect(0,0,300,400);PHOTO_STYLES.drawScene(id,c,300,400);if(!cv.dataset.off)PHOTO_STYLES.drawGuide(id,c,300,400,{lw:2,sample:1});return}

$('btnSamples').onclick=$('btnSamples2').onclick=()=>openModal('samples');

// ---------- 뒤로가기 / 홈 (폰 뒤로가기 버튼·밀어서 뒤로 지원) ----------
function openModal(id){$(id).classList.add('show');if(!(history.state&&history.state.m))history.pushState(Object.assign({},history.state,{m:1}),'')}
function closeModals(){document.querySelectorAll('.modal.show').forEach(m=>m.classList.remove('show'))}
function closeModalsSilently(){closeModals();if(history.state&&history.state.m)history.replaceState(Object.assign({},history.state,{m:0}),'')}
function pushCam(){if(!(history.state&&history.state.cam))history.pushState({cam:1},'')}
addEventListener('popstate',e=>{const st=e.state||{};if(!st.m)closeModals();if(!st.cam&&inCam())goHome(true)});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{if(history.state&&history.state.m)history.back();else b.closest('.modal').classList.remove('show')});

function inCam(){return mode!=='idle'}
function goHome(fromPop){
  if(!fromPop&&history.state&&history.state.cam){history.back();return}
  closeModals();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  mode='idle';feat=null;lastRanked=null;stillAR=null;vid.style.display='none';still.style.display='none';$('start').style.display='flex';
  hintEl.textContent='';$('btnHome').style.display='none';$('recs').innerHTML='<span class="reclbl">카메라를 대면 추천 구도가 여기에 떠요</span>';fit();renderChips()}
$('btnHome').onclick=()=>goHome();
setInterval(()=>{$('btnHome').style.display=mode!=='idle'?'':'none'},300);


fit();renderChips();
})();
