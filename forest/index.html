<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2E5A3F">
<link rel="icon" href="../shared/img/samsaek.png">
<link rel="apple-touch-icon" href="../shared/img/samsaek.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>밍뉴의숲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-bleed storybook world canvas; sticker-style chips on top, a round tool dock at the bottom, bottom sheets for books and bags. Single committed look (a picture-book forest), so one palette for both host themes. */
:root{
  --leaf:#3E8E5E; --leaf-deep:#1F4D36; --paper:#F4FBF2; --paper-2:#E2F0DE; --ink:#24363B;
  --berry:#E2557A; --berry-deep:#B93A5E; --acorn:#B97A30; --sun:#FFC94A; --mute:#5F776D; --line:rgba(36,54,59,.16);
  --f-display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#2E5A3F;color:var(--ink);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.chip{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:0 12px 0 8px;box-shadow:0 3px 0 rgba(36,54,59,.3);font-family:var(--f-display);font-size:16px;line-height:1;height:36px;box-sizing:border-box;white-space:nowrap}
.brand{background:var(--leaf);color:#fff;padding:0 14px;font-size:19px;letter-spacing:.02em}
.spacer{flex:1}
.chip canvas{width:22px;height:22px}
.crc{width:16px;height:16px;border-radius:50%;background:#FFD23F;border:2px solid #B8860B;display:inline-block;box-sizing:border-box}
.sunmoon{width:16px;height:16px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);box-sizing:border-box}
.sunmoon.night{background:#F6F1C9;box-shadow:inset -5px -2px 0 #9FA6D6}
.sunmoon.evening{background:#FF9A5A}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:4px;z-index:5;background:var(--paper);border:2px solid var(--ink);border-radius:22px;padding:5px;box-shadow:0 4px 0 rgba(36,54,59,.3)}
.dock button{width:52px;height:54px;border-radius:16px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-display);font-size:13px;position:relative;cursor:pointer}
.dock button:active{background:var(--paper-2)}
.dock svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:5px;right:12px;width:11px;height:11px;border-radius:50%;background:var(--berry);border:2px solid var(--paper)}
#act{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 88px);z-index:6;min-width:96px;height:56px;padding:0 20px;border-radius:999px;border:2.5px solid var(--ink);background:var(--berry);color:#fff;font-family:var(--f-display);font-size:19px;box-shadow:0 4px 0 var(--berry-deep);cursor:pointer;animation:bump .3s ease-out}
#act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--berry-deep)}
@keyframes bump{from{transform:scale(.7)}to{transform:scale(1)}}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{background:var(--ink);color:#fff;font-family:var(--f-display);font-size:16px;padding:9px 16px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:opacity .4s,transform .4s;max-width:100%;text-align:center;animation:drop .3s ease-out}
.toast b{color:var(--sun);font-weight:400}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes drop{from{transform:translateY(-10px);opacity:0}}
.wrap{position:fixed;inset:0;z-index:20;background:rgba(18,34,26,.38);display:flex;justify-content:center}
.wrap.sheetw{align-items:flex-end}
.wrap.modalw{align-items:center;z-index:25;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:560px;max-height:84%;background:var(--paper);border:2.5px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .25s ease-out;box-sizing:border-box}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet header{display:flex;align-items:center;padding:16px 16px 6px;gap:8px}
.sheet h2,.modal h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.sheet h2{font-size:25px;flex:1}
.xbtn{border:2px solid var(--ink);background:#fff;border-radius:999px;height:36px;padding:0 14px;font-family:var(--f-display);font-size:15px;cursor:pointer}
.sbody{overflow:auto;padding:4px 16px 22px;-webkit-overflow-scrolling:touch}
.modal{width:100%;max-width:390px;max-height:90%;overflow:auto;background:var(--paper);border:2.5px solid var(--ink);border-radius:26px;padding:18px 16px 16px;box-shadow:0 6px 0 rgba(36,54,59,.35);animation:pop .22s ease-out;box-sizing:border-box}
@keyframes pop{from{transform:scale(.88);opacity:.3}}
.modal h3{font-size:24px}
.sub{color:var(--mute);font-size:14px;margin:2px 0 0}
.lead{font-size:16px;line-height:1.6;margin:8px 0}
.mhead{display:flex;gap:12px;align-items:center}
.mhead > div{min-width:0}
.por-lg{width:128px;height:104px;background:var(--paper-2);border-radius:20px;flex:none}
.say{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin:12px 0 10px;font-size:16px;line-height:1.5;min-height:24px;position:relative}
.hearts{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.hearts svg{width:22px;height:20px}
.hearts.sm svg{width:15px;height:14px}
.hearts path{fill:#fff;stroke:var(--ink);stroke-width:1.8}
.hearts .on path{fill:var(--berry)}
.label{font-family:var(--f-display);font-size:15px;color:var(--mute);margin:12px 0 6px;letter-spacing:.03em}
.snacks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.snack{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;font-size:13px}
.snack canvas{width:30px;height:30px}
.snack b{font-family:var(--f-display);font-weight:400;font-size:14px;color:var(--acorn)}
.snack.empty{opacity:.45}
.snack.meh::after{content:'별로';position:absolute;top:3px;left:5px;font-size:10px;color:var(--mute)}
.snack.fav{border-color:var(--berry);background:#FFF0F4}
.snack.fav::after{content:'최애';position:absolute;top:3px;left:5px;font-size:10px;color:var(--berry);font-family:var(--f-display)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row > *{flex:1 1 0;min-width:0}
.btn{height:48px;border-radius:16px;border:2.5px solid var(--ink);background:var(--berry);color:#fff;font-family:var(--f-display);font-size:17px;box-shadow:0 3px 0 var(--berry-deep);cursor:pointer;padding:0 12px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--berry-deep)}
.btn.leafb{background:var(--leaf);box-shadow:0 3px 0 var(--leaf-deep)}
.btn.soft{background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(36,54,59,.3)}
.btn.sm{height:36px;font-size:15px;border-radius:12px;border-width:2px}
.btn:disabled{opacity:.45;cursor:default}
.timing{margin-top:10px}
.bar{position:relative;height:30px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:#FFC2D2}
.mark{position:absolute;top:2px;bottom:2px;width:8px;margin-left:-4px;border-radius:4px;background:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 6px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
.card canvas{width:100%;max-width:96px;aspect-ratio:96/78;height:auto}
.card .nm{font-family:var(--f-display);font-size:15px;line-height:1.2}
.card .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--paper-2);color:var(--mute)}
.card .tag.f{background:var(--berry);color:#fff}
.stars{position:absolute;top:6px;right:8px;font-size:11px;color:var(--acorn);letter-spacing:-1px}
.prog{height:12px;background:#fff;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--leaf)}
.progtxt{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:15px;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 10px;cursor:pointer}
.li canvas{width:72px;height:58px;flex:none}
.li .grow{flex:1;min-width:0}
.li .nm{font-family:var(--f-display);font-size:17px}
.li .meta{font-size:13px;color:var(--mute)}
.task{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center}
.task .grow{flex:1;min-width:0}
.task .nm{font-family:var(--f-display);font-size:17px}
.task .prog{height:10px;margin-top:6px}
.task .rw{font-size:13px;color:var(--acorn);margin-top:4px;display:flex;align-items:center;gap:4px}
.task .rw canvas{width:16px;height:16px}
.task.done{opacity:.55}
.news{background:var(--paper-2);border-radius:18px;padding:12px 14px;margin-top:14px;font-size:15px;line-height:1.6}
.news h4{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0 0 4px}
.tabs{display:flex;gap:6px;margin:4px 0 12px}
.tabs button{flex:1;height:38px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-family:var(--f-display);font-size:15px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.price{display:flex;align-items:center;gap:3px;font-family:var(--f-display);color:var(--acorn);font-size:15px}
.price canvas{width:16px;height:16px}
.likes{font-size:11px;color:var(--mute);line-height:1.3;min-height:28px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:15px;margin-top:12px}
.dl dt{font-family:var(--f-display);color:var(--mute)}
.dl dd{margin:0}
.fact{background:#FFF7DA;border-radius:16px;padding:12px;margin-top:12px;line-height:1.6;font-size:15px}
.empty-st{text-align:center;padding:24px 12px;color:var(--mute);line-height:1.6}
input.name{width:100%;box-sizing:border-box;height:48px;border:2.5px solid var(--ink);border-radius:14px;padding:0 14px;font-family:var(--f-display);font-size:20px;background:#fff;user-select:text;-webkit-user-select:text}
.fishcv{width:100%;height:auto;aspect-ratio:320/170;border-radius:18px;border:2px solid var(--ink);display:block;margin-top:10px;background:#7CC6E0}
.big{font-family:var(--f-display);font-size:30px;text-align:center;margin:6px 0;text-wrap:balance}
.center{text-align:center}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.intro-cv{width:100%;height:auto;aspect-ratio:320/130;display:block;background:var(--paper-2);border-radius:20px}
.stamps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.stamp span{width:46px;height:46px;border-radius:50%;border:2.5px dashed rgba(36,54,59,.3);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);color:#fff;font-size:14px;box-sizing:border-box}
.stamp.on span{background:var(--berry);border:2.5px solid var(--ink);transform:rotate(-12deg)}
.stamp b{font-family:var(--f-display);font-weight:400;font-size:12px;line-height:1.2}
.stamp small{font-size:10px;color:var(--mute)}
.meta b{color:var(--berry-deep);font-weight:400;font-family:var(--f-display)}
.brand{cursor:pointer}
.exitb{cursor:pointer;color:var(--ink);padding:0 11px 0 9px}
@media (max-width:440px){.exitb span{display:none}.exitb{padding:0 8px!important}}
@media (max-width:440px){.top{gap:5px}.top .chip{padding:0 9px 0 6px;font-size:14px;gap:4px;height:34px}.brand{font-size:16px!important;padding:0 10px!important}}
#runHud{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 56px);z-index:8;background:#FFD23F;border:2.5px solid var(--ink);border-radius:999px;padding:8px 18px;font-family:var(--f-display);font-size:18px;box-shadow:0 3px 0 rgba(36,54,59,.3);white-space:nowrap;font-variant-numeric:tabular-nums}
.news h4:not(:first-child){margin-top:10px}
.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.charc{background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
.charc.on{border-color:var(--berry);background:#FFF0F4}
.charc img,.charc canvas{width:100%;max-width:96px;aspect-ratio:5/4;height:auto;object-fit:contain}
.charc b{font-family:var(--f-display);font-weight:400;font-size:16px}
.charc small{font-size:11px;color:var(--mute);line-height:1.3}
.fcode{font-family:var(--f-display);font-size:44px;letter-spacing:.18em;text-align:center;background:#FFF7D1;border:2.5px dashed var(--ink);border-radius:18px;padding:10px 0;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.flist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.fli{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 10px}
.fli img{width:52px;height:44px;object-fit:contain}
.fli b{font-family:var(--f-display);font-weight:400;font-size:17px}
.fli small{color:var(--mute);margin-left:auto}
#emoBtn{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 88px);z-index:6;width:58px;height:58px;border-radius:50%;border:2.5px solid var(--ink);background:var(--sun);font-family:var(--f-display);font-size:16px;box-shadow:0 4px 0 rgba(36,54,59,.3);cursor:pointer}
#emoBar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 154px);z-index:7;display:flex;flex-wrap:wrap;gap:6px;max-width:360px}
#emoBar button{height:42px;padding:0 14px;border-radius:999px;border:2.5px solid var(--ink);background:#fff;font-family:var(--f-display);font-size:16px;cursor:pointer;box-shadow:0 3px 0 rgba(36,54,59,.25)}
#emoBar button.hrt{color:var(--berry);font-size:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="cv" aria-label="밍뉴의숲 게임 화면"></canvas>

<div class="top">
  <button class="chip brand" id="brandBtn" aria-label="캐릭터 바꾸기">밍뉴의숲</button>
  <div class="chip" title="도토리"><canvas data-item="acorn" width="44" height="44"></canvas><span id="acorns">0</span></div>
  <div class="chip" id="crChip" hidden title="크레딧 (NNN 월드 상점에서 써요)"><i class="crc"></i><span id="credits">0</span></div>
  <div class="spacer"></div>
  <div class="chip" id="clock"><span class="sunmoon" id="sunmoon"></span><span id="clockText"></span></div>
  <button class="chip exitb" id="exitBtn" aria-label="나가기" title="NNN 월드로 나가기"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>나가기</span></button>
</div>

<div id="toasts"></div>
<div id="runHud" hidden></div>
<button id="act" hidden></button>

<nav class="dock" aria-label="도구">
  <button id="bBag"><svg viewBox="0 0 24 24"><path d="M5 9h14l-1.2 11H6.2z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg>가방</button>
  <button id="bDex"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 3.5v17M11.5 9h5M11.5 13h4"/></svg>도감</button>
  <button id="bPets"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="15.5" rx="4.2" ry="3.6"/><circle cx="6.3" cy="10.5" r="1.9"/><circle cx="17.7" cy="10.5" r="1.9"/><circle cx="9.6" cy="6.4" r="1.9"/><circle cx="14.4" cy="6.4" r="1.9"/></svg>마당</button>
  <button id="bTown"><svg viewBox="0 0 24 24"><path d="M3.5 6.5l5.5-2.5 6 2.5 5.5-2.5v13.5l-5.5 2.5-6-2.5-5.5 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>동네</button>
  <button id="bFriends"><svg viewBox="0 0 24 24"><circle cx="8.5" cy="8.5" r="3.2"/><circle cx="16" cy="9.5" r="2.6"/><path d="M3 19c.6-3.4 2.8-5.2 5.5-5.2s4.9 1.8 5.5 5.2M14.2 14.3c.6-.3 1.2-.4 1.8-.4 2.3 0 4 1.5 4.5 4.6"/></svg>친구<span class="badge" id="friendBadge" hidden></span></button>
  <button id="bTasks"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 10l2 2 4.5-4.5M8 16h8"/></svg>할 일<span class="badge" id="taskBadge" hidden></span></button>
</nav>

<div class="wrap sheetw" id="sheetW" hidden><div class="sheet" role="dialog" aria-modal="true"><header><h2 id="sheetT"></h2><button class="xbtn" id="sheetX">닫기</button></header><div class="sbody" id="sheetB"></div></div></div>
<div class="wrap modalw" id="modalW" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../shared/avatar.js?v=6"></script>
<script src="../shared/world.js?v=5"></script>
<div id="emoBar" hidden></div>
<button id="emoBtn" hidden aria-label="인사하기">인사</button>
<script>
'use strict';
const $=s=>document.querySelector(s);
const T=48, MW=64, MH=48;
const cv=$('#cv'), ctx=cv.getContext('2d');
let DPR=1, VW=0, VH=0, Z=1;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function h2(x,y,n=0){const s=Math.sin(x*127.1+y*311.7+n*74.7)*43758.5453;return s-Math.floor(s)}
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- static world: ground & tile objects ---------- */
function pick2(a,x,y){return a[Math.floor(h2(x,y,11)*a.length)]}
function pgColor(x,y){for(const z of PGZONES)if(x>=z.x0&&x<=z.x1&&y>=z.y0&&y<=z.y1)return z.c;return '#F2B880'}
function drawGround(c,tx,ty){
  const t=baseOf(tx,ty),x=tx*T,y=ty*T;
  const COL={[YD]:PAL.yard,[PA]:PAL.path,[SA]:PAL.sand,[WA]:PAL.water,[FA]:PAL.soil,[RD]:'#787E84',[SW]:'#DCD6CA',[PZ]:'#ECE0C6',[FD]:'#DCBC8C',[PK]:'#8E949A'};
  c.fillStyle=t===PG?pgColor(tx,ty):(COL[t]||PAL.grass);c.fillRect(x,y,T,T);
  if(t===WA){c.fillStyle=PAL.water2;[[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy])=>{if(tileAt(tx+dx,ty+dy)!==WA){if(dy)c.fillRect(x,dy<0?y:y+T-6,T,6);else c.fillRect(dx<0?x:x+T-6,y,6,T)}});
    if(h2(tx,ty)<0.3){c.fillStyle='rgba(255,255,255,.35)';c.fillRect(x+12+h2(tx,ty,1)*16,y+20,10,2.5)}return}
  if(t===RD){
    if(CW.has(tx)&&ty>=23&&ty<=24){c.fillStyle='#F4F4F0';for(let i=0;i<4;i++)c.fillRect(x+4,y+3+i*12,T-8,6)}
    else if(CW.has(ty)&&tx>=40&&tx<=41){}
    if(ty===23&&!CW.has(tx)&&(tx<40||tx>41)){c.fillStyle='#F2C94C';c.fillRect(x,y+T-3,T,2);c.fillRect(x,y+T+1,T,2)}
    if((tx===40)&&ty<22){c.fillStyle='#F2C94C';c.fillRect(x+T-3,y,2,T);c.fillRect(x+T+1,y,2,T)}
    return}
  if(t===SW){c.strokeStyle='#C8C0B0';c.lineWidth=1.5;c.beginPath();c.moveTo(x,y+T/2);c.lineTo(x+T,y+T/2);c.moveTo(x+(ty%2?T/2:0),y);c.lineTo(x+(ty%2?T/2:0),y+T/2);c.moveTo(x+(ty%2?0:T/2),y+T/2);c.lineTo(x+(ty%2?0:T/2),y+T);c.stroke();return}
  if(t===PZ){c.save();c.beginPath();c.rect(x,y,T,T);c.clip();c.strokeStyle='#D6C49E';c.lineWidth=3;for(let r=1;r<=3;r++){c.beginPath();c.arc(PLAZA.x*T,PLAZA.y*T,r*T*1.05,0,7);c.stroke()}c.restore();return}
  if(t===PG){c.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<4;i++){c.beginPath();c.arc(x+h2(tx,ty,i)*T,y+h2(tx,ty,i+4)*T,2,0,7);c.fill()}return}
  if(t===PK){c.fillStyle='#F4F4F0';c.fillRect(x,y,2,T);return}
  if(t===FD){c.fillStyle='rgba(150,110,60,.25)';for(let i=0;i<3;i++)c.fillRect(x+h2(tx,ty,i)*44,y+h2(tx,ty,i+9)*44,3,2);return}
  if(t===SA){c.fillStyle='rgba(200,170,110,.35)';for(let i=0;i<4;i++)c.fillRect(x+h2(tx,ty,i)*44,y+h2(tx,ty,i+9)*44,2,2);return}
  if(t===FA){c.fillStyle='#87593A';for(let i=0;i<3;i++)c.fillRect(x+4,y+8+i*14,T-8,5);return}
  if(t===YD){if((tx+ty)%2===0){c.fillStyle='rgba(255,255,255,.08)';c.fillRect(x,y,T,T)}}
  c.strokeStyle=PAL.blade;c.lineWidth=2;c.lineCap='round';
  for(let i=0;i<3;i++){const bx=x+6+h2(tx,ty,i)*(T-12),by=y+10+h2(tx,ty,i+3)*(T-14);c.beginPath();c.moveTo(bx-3,by);c.lineTo(bx-1,by-5);c.moveTo(bx+1,by);c.lineTo(bx+3,by-6);c.stroke()}
  if(SEASON==='spring'&&h2(tx,ty,7)<0.12){c.fillStyle='#fff';c.beginPath();c.arc(x+h2(tx,ty,8)*40+4,y+h2(tx,ty,9)*40+4,2.5,0,7);c.fill()}
  if(SEASON==='autumn'&&h2(tx,ty,7)<0.15){c.fillStyle=pick2(['#E8983C','#D9643A'],tx,ty);c.beginPath();c.ellipse(x+h2(tx,ty,8)*40+4,y+h2(tx,ty,9)*40+4,3.5,2,h2(tx,ty,2)*3,0,7);c.fill()}

function drawObj(c,tx,ty){

    c.beginPath();c.ellipse(x+18,y+19,6,3,-0.3,0,7);c.fillStyle='rgba(255,255,255,.35)';c.fill();
  } else if(t===BU){

  } else if(t===FL){
    const cols=['#F7A8C0','#FFFFFF','#FFC94A','#B9A4F2'];

  } else if(t===SF){
    line(c,[cx,y+T-4,cx,y+12],3,'#4E9442');ell(c,cx-7,y+T-16,6,3,'#5DB565',true,-0.5);
    for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ell(c,cx+Math.cos(a)*9,y+12+Math.sin(a)*9,4.5,2.6,'#FFC94A',false,a)}
    ell(c,cx,y+12,6.5,6.5,'#7A5236');
  } else if(t===FE){
    const h=tileAt(tx-1,ty)===FE||tileAt(tx+1,ty)===FE,v=tileAt(tx,ty-1)===FE||tileAt(tx,ty+1)===FE;
    c.fillStyle='#E9C98F';c.strokeStyle=OUT;c.lineWidth=2;

const CH=8, chunks=new Map();let frameNo=0;
function getChunk(cx,cy,k){
  const key=cx+','+cy;const e=chunks.get(key);if(e&&e.k===k){e.used=frameNo;return e.c}
  const px=CH*T,cn=document.createElement('canvas');cn.width=Math.ceil(px*k);cn.height=Math.ceil(px*k);
  const g=cn.getContext('2d');g.setTransform(k,0,0,k,-cx*px*k,-cy*px*k);
  const x0=cx*CH,y0=cy*CH,night=phase()==='night';
  for(let y=y0;y<y0+CH;y++)for(let x=x0;x<x0+CH;x++)drawGround(g,x,y);
  SPR.forEach(s=>{if(s.k==='track'&&s.x<=x0+CH&&s.x+s.w>=x0&&s.y<=y0+CH&&s.y+s.h>=y0)drawSprite(g,s,night)});
  for(let y=y0-1;y<=y0+CH+1;y++)for(let x=x0-1;x<=x0+CH;x++)drawObj(g,x,y);
  SPR.forEach(s=>{if(s.k!=='track'&&s.x-1<=x0+CH&&s.x+s.w+1>=x0&&s.y-2<=y0+CH&&s.y+s.h+1>=y0)drawSprite(g,s,night)});
  chunks.set(key,{c:cn,k,used:frameNo});
  if(chunks.size>30){let old=null;for(const[kk,v]of chunks)if(!old||v.used<old[1].used)old=[kk,v];chunks.delete(old[0])}
  return cn;
}

/* ---------- spawning ---------- */
function spotFree(x,y){return !wild.some(w=>Math.abs(w.tx-x)+Math.abs(w.ty-y)<3)}
function spawnWild(spId,at,reveal){
  let sp;
  if(spId)sp=SPEC[spId];
  else{const cands=SPECIES.filter(s=>eligible(s)&&!wild.some(w=>w.sp===s.id));if(!cands.length)return;
    const wts=cands.map(s=>({1:10,2:5,3:1.6}[s.r])*(dex(s.id).friend?1:2.6)*(RAINING&&s.hab==='water'?3:1));let sum=wts.reduce((a,b)=>a+b,0),r=Math.random()*sum;sp=cands[cands.length-1];for(let i=0;i<cands.length;i++){r-=wts[i];if(r<=0){sp=cands[i];break}}}
  let spot=at;
  if(!spot){const list=SPOTS[sp.hab].filter(([x,y])=>Math.hypot((x+.5)*T-P.x,(y+.5)*T-P.y)>T*6&&spotFree(x,y));if(!list.length)return;spot=pick(list)}
  const w={sp:sp.id,tx:spot[0],ty:spot[1],hx:(spot[0]+.5)*T,hy:(spot[1]+.7)*T,x:(spot[0]+.5)*T,y:(spot[1]+.7)*T,revealed:false,life:240,t:Math.random()*10,face:Math.random()<.5?1:-1,pop:0,mt:rnd(1,3),tgt:null,engaged:false};

  const tx0=Math.floor(px/T),ty0=Math.floor(py/T),rr=Math.ceil(rad/T);
  for(let y=ty0-rr;y<=ty0+rr;y++)for(let x=tx0-rr;x<=tx0+rr;x++){
    const t=tileAt(x,y),i=y*MW+x,r=RES.get(i),cx=(x+.5)*T,cy=(y+.5)*T;

}

  for(let k=0;k<4000&&PUMPKINS.length<10;k++){const p=cand[Math.floor(R()*cand.length)];if(PUMPKINS.every(q=>Math.abs(q[0]-p[0])+Math.abs(q[1]-p[1])>=9))PUMPKINS.push(p)}}

function ghostPos(far){for(let i=0;i<40;i++){const c=GH_CAND[Math.floor(Math.random()*GH_CAND.length)];const x=(c[0]+.5)*T,y=(c[1]+.7)*T;if(!far||Math.hypot(x-P.x,y-P.y)>T*8)return{x,y}}const c=GH_CAND[0];return{x:(c[0]+.5)*T,y:(c[1]+.7)*T}}
function newGhost(far){const p=ghostPos(far);return{x:p.x,y:p.y,tx:p.x,ty:p.y,t:Math.random()*9,hat:pick(['','','bow','witch','pumpkin']),cd:0,poof:0,boo:rnd(3,8),face:1}}

}
function drawGhost(c,g,night){
  const bob=Math.sin(now*2.4+g.t)*5,a=g.poof>0?g.poof/0.9:1;
  c.save();c.globalAlpha=a*(night?0.95:0.85);c.translate(g.x,g.y);
  c.beginPath();c.ellipse(0,0,13*a,4,0,0,7);c.fillStyle='rgba(30,45,30,.15)';c.fill();
  c.translate(0,-12+bob);c.scale(g.face*(g.poof>0?1+(1-a)*.6:1),g.poof>0?1+(1-a)*.6:1);
  c.beginPath();c.moveTo(-16,0);c.lineTo(-16,-22);c.bezierCurveTo(-16,-44,16,-44,16,-22);c.lineTo(16,0);
  const w=Math.sin(now*6+g.t)*2;for(let i=0;i<4;i++){c.quadraticCurveTo(16-(i+.5)*8,5+(i%2?w:-w),16-(i+1)*8,0)}c.closePath();
  c.fillStyle='#FFFFFF';c.fill();c.lineWidth=2.2;c.strokeStyle=BK;c.stroke();
  ell(c,-21,-14,5,3,'#fff',true,0.5);ell(c,21,-14,5,3,'#fff',true,-0.5);
  c.fillStyle=BK;c.beginPath();c.ellipse(-6,-24,2.8,3.8,0,0,7);c.ellipse(6,-24,2.8,3.8,0,0,7);c.fill();
  c.beginPath();c.ellipse(0,-16,3,3.8,0,0,7);c.fill();
  c.fillStyle='rgba(255,120,140,.45)';c.beginPath();c.ellipse(-11,-18,3,1.8,0,0,7);c.ellipse(11,-18,3,1.8,0,0,7);c.fill();
  if(g.hat==='bow'){tri(c,[0,-40],[-8,-45],[-8,-35],'#FF7FA8');tri(c,[0,-40],[8,-45],[8,-35],'#FF7FA8');ell(c,0,-40,2.6,2.6,'#E2557A')}
  if(g.hat==='witch'){tri(c,[-8,-38],[4,-60],[8,-38],'#6E4AA8');ell(c,0,-38,13,3.5,'#5B3A8C')}
  if(g.hat==='pumpkin'){ell(c,-9,-30,4,4,'#FF9D3F');rr(c,-10,-36,2,3,1,'#5D8A3A')}
  c.restore();
}
function updateGhosts(dt){
  if(!HALLOWEEN)return;const want=phase()==='day'?6:10;
  while(GHOSTS.length<want)GHOSTS.push(newGhost(true));if(GHOSTS.length>want)GHOSTS.length=want;
  GHOSTS.forEach((g,i)=>{g.t+=dt;g.cd=Math.max(0,g.cd-dt);
    if(g.poof>0){g.poof-=dt;if(g.poof<=0){GHOSTS[i]=newGhost(true)}return}
    const dx=g.tx-g.x,dy=g.ty-g.y,m=Math.hypot(dx,dy);
    if(m<4){const p=ghostPos(false);if(Math.hypot(p.x-g.x,p.y-g.y)<T*7){g.tx=p.x;g.ty=p.y}}
    else{const sp=Math.min(m,T*0.7*dt);g.x+=dx/m*sp;g.y+=dy/m*sp;if(Math.abs(dx)>1)g.face=dx>0?1:-1}
    const d=Math.hypot(g.x-P.x,g.y-P.y);if(d<T*6){g.boo-=dt;if(g.boo<=0){g.boo=rnd(5,10);floater(g.x,g.y-T*1.6,pick(['부우~','사탕 줄까?','트릭 오어 트릿!']),'#fff')}}
  });
}

function petTick(dt){
  if(!curPet)return;const cn=$('#pcv');if(!cn)return;const p=curPet.p;
  curPet.jump=Math.max(0,curPet.jump-dt);const g=cn.getContext('2d');g.clearRect(0,0,cn.width,cn.height);
  const j=curPet.jump>0?Math.abs(Math.sin(curPet.jump*10))*14:0;
  drawCritter(g,p.sp,cn.width*(SPEC[p.sp].kind==='lizard'?0.58:0.5),cn.height*0.88-j,2.6*STAGE_SC[stageOf(p.love)]/1.06,now,1,{seed:p.uid,sleep:isSleeping(p)&&curPet.jump<=0})
}
function isSleeping(p){return phase()==='night'&&SPEC[p.sp].time!=='night'&&!(p.awake>0)}

function openFishing(){
  const Fs={ph:'wait',w:rnd(1.5,4.2),bite:0,t:0};
  openModal(`<h3>곡교천에서 낚시</h3><p class="sub">찌가 쏙 들어가면 재빨리 눌러요</p><canvas id="fcv" class="fishcv" width="640" height="340"></canvas><p class="say" id="say">찌를 던졌어요. 조용히 기다려요…</p><div class="row"><button class="btn" id="hook">낚아채기!</button></div><div class="row"><button class="btn soft" id="stop">그만할래요</button></div>`,
  (dt)=>{
    Fs.t+=dt;const cn=$('#fcv');if(!cn)return;const g=cn.getContext('2d'),W=cn.width,H=cn.height;
    if(Fs.ph==='wait'){Fs.w-=dt;if(Fs.w<=0){Fs.ph='bite';Fs.bite=1.15;sfx.splash()}}
    else if(Fs.ph==='bite'){Fs.bite-=dt;if(Fs.bite<=0){Fs.ph='wait';Fs.w=rnd(1.5,3.5);$('#say').textContent='앗, 도망갔어요! 다시 기다려 봐요.'}}
    g.fillStyle='#7CC6E0';g.fillRect(0,0,W,H);
    for(let i=0;i<6;i++){g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=4;const yy=40+i*55,xx=((Fs.t*30+i*90)%(W+120))-60;g.beginPath();g.moveTo(xx,yy);g.quadraticCurveTo(xx+20,yy-8,xx+40,yy);g.stroke()}
    g.fillStyle='rgba(60,110,140,.25)';const fx=W/2+Math.sin(Fs.t*1.3)*120,fy=H*0.62;g.beginPath();g.ellipse(fx,fy,34,12,0,0,7);g.fill();
    const bx=W/2,by=H*0.45+(Fs.ph==='bite'?16+Math.sin(Fs.t*40)*4:Math.sin(Fs.t*2)*4);
    if(Fs.ph==='bite'){g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=4;for(let r=0;r<3;r++){g.beginPath();g.ellipse(bx,H*0.47,30+r*22+((Fs.t*80)%22),10+r*7,0,0,7);g.stroke()}}
    g.strokeStyle='#24363B';g.lineWidth=2;g.beginPath();g.moveTo(bx,by-24);g.lineTo(bx+140,-10);g.stroke();
    g.save();g.translate(bx,by);g.scale(2,2);ell(g,0,0,8,8,'#fff');g.beginPath();g.ellipse(0,0,8,8,0,Math.PI,0);g.fillStyle='#E2557A';g.fill();g.lineWidth=2;g.strokeStyle=OUT;g.stroke();line(g,[0,-8,0,-13],2,OUT);g.restore();
    if(Fs.ph==='bite'){g.fillStyle='#FFE38A';g.strokeStyle=OUT;g.lineWidth=4;g.font='64px Jua, sans-serif';g.textAlign='center';g.strokeText('!',bx+70,by-30);g.fillText('!',bx+70,by-30)}
  });
  $('#hook').onclick=()=>{
    if(Fs.ph==='bite'){
      const r=Math.random();let m;
      if(r<0.88){addSnack('fish',1);ev('fish');m='물고기를 낚았어요!';sfx.find()}
      else{const n=rint(10,20);addAcorns(n);m=`물에 빠진 도토리 주머니! 도토리 ${n}개`}
      Fs.ph='wait';Fs.w=rnd(1.8,4.2);$('#say').textContent=m+' 한 번 더 해 볼까요?';
    }else{Fs.w=rnd(1.5,3.5);sfx.miss();$('#say').textContent='아직이에요! 찌가 쏙 들어가면 눌러요.'}
  };
  $('#stop').onclick=closeModal;
}

function emoBubble(c,x,y,k){

function keeperTag(c,name,x,y){

  c.fillStyle='#E2557A';c.beginPath();c.roundRect(x-w/2,y-2,w,19,9);c.fill();c.lineWidth=1.5;c.strokeStyle=OUT;c.stroke();

}

function handleTap(sx,sy){
  const w=toWorld(sx,sy);tapFx={x:w.x,y:w.y,t:0};

}

/* ---------- movement ---------- */
function hit(x,y){const r=T*0.26;for(const[px,py]of[[x-r,y-r*.6],[x+r,y-r*.6],[x-r,y],[x+r,y]]){if(solidAt(Math.floor(px/T),Math.floor(py/T)))return true}return false}
function tryMove(dx,dy){const nx=P.x+dx;if(!hit(nx,P.y))P.x=nx;const ny=P.y+dy;if(!hit(P.x,ny))P.y=ny}

/* ---------- update ---------- */
let lastPhase=phase(), dayTm=0;
function update(dt){
  now+=dt;P.joy=Math.max(0,P.joy-dt);
  if(RUN){RUN.t-=dt;RUN.stars.forEach((s,i)=>{if(Math.hypot(s.x-P.x,s.y-P.y)<T*.8){RUN.score++;sfx.coin();for(let k=0;k<8;k++)parts.push({wx:s.x,wy:s.y-T*.4,vx:rnd(-60,60),vy:rnd(-90,-30),c:'#FFE38A',life:.7,t:0,star:1});RUN.stars[i]=fieldSpot()}});
    $('#runHud').textContent=`남은 시간 ${Math.ceil(Math.max(0,RUN.t))}초 · 별 ${RUN.score}개`;if(RUN.t<=0)endRun()}
  if(phase()==='night'&&!uiOpen()){shootTm-=dt;if(shootTm<=0&&!shoot){shoot={x:VW*rnd(.55,1.05),y:VH*rnd(.05,.3),vx:-rnd(200,280),vy:rnd(90,150),t:0,caught:false};shootTm=rnd(20,45)}}
  updateGhosts(dt);updateNPCs(dt);netTick(dt);
  if(shoot){shoot.t+=dt;shoot.x+=shoot.vx*dt;shoot.y+=shoot.vy*dt;if(shoot.t>(shoot.caught?0.6:2.4))shoot=null}
  if(!uiOpen()){
    let vx=0,vy=0;
    if(keys.has('arrowleft')||keys.has('a'))vx-=1;if(keys.has('arrowright')||keys.has('d'))vx+=1;if(keys.has('arrowup')||keys.has('w'))vy-=1;if(keys.has('arrowdown')||keys.has('s'))vy+=1;
    if(ptr&&ptr.drag){const dx=ptr.x-ptr.sx,dy=ptr.y-ptr.sy,m=Math.hypot(dx,dy);if(m>8){const s=Math.min(1,m/50);vx=dx/m*s;vy=dy/m*s}}
    if(vx||vy){P.target=null;P.pending=null;const m=Math.hypot(vx,vy);if(m>1){vx/=m;vy/=m}}
    else if(P.target){const dx=P.target.x-P.x,dy=P.target.y-P.y,m=Math.hypot(dx,dy);if(m<5)P.target=null;else{vx=dx/m;vy=dy/m}}
    if(vx||vy){const sp=3.8*T*dt,ox=P.x,oy=P.y;tryMove(vx*sp,vy*sp);P.moving=true;if(Math.abs(vx)>0.15)P.face=vx>0?1:-1;P.fx=vx;P.fy=vy;
      if(P.target){if(Math.hypot(P.x-ox,P.y-oy)<sp*0.25){P.stuck+=dt;if(P.stuck>0.25){P.target=null;P.stuck=0}}else P.stuck=0}}
    else P.moving=false;
    if(P.pending){const it=P.pending;const d=Math.hypot(it.x-P.x,it.y-(P.y-T*.3));if(d<=T*1.45){P.target=null;P.pending=null;P.moving=false;it.act()}else if(!P.target)P.pending=null}
  } else P.moving=false;

  const ph=phase();if(ph!==lastPhase){lastPhase=ph;chunks.clear();wild=wild.filter(w=>w.engaged||(w.revealed&&eligible(SPEC[w.sp])));}
  dayTm+=dt;if(dayTm>30){dayTm=0;newDayCheck(false)}

  spawnTm-=dt;if(spawnTm<=0){spawnTm=rnd(4,8);if(wild.length<8)spawnWild()}
  for(const w of wild){
    w.t+=dt;w.pop=Math.max(0,w.pop-dt);if(!w.engaged)w.life-=dt;
    const d=Math.hypot(w.x-P.x,w.y-P.y);
    if(!w.revealed&&d<T*2.6)revealWild(w);
    if(w.revealed&&!w.engaged){
      w.mt-=dt;if(w.mt<=0){w.mt=rnd(2,4);w.tgt={x:w.hx+rnd(-.7,.7)*T,y:w.hy+rnd(-.5,.5)*T}}
      if(w.tgt){const dx=w.tgt.x-w.x,dy=w.tgt.y-w.y,m=Math.hypot(dx,dy);if(m>2){const s=Math.min(m,T*0.8*dt);const nx=w.x+dx/m*s,ny=w.y+dy/m*s;if(!solidAt(Math.floor(nx/T),Math.floor((ny-4)/T))){w.x=nx;w.y=ny}else w.tgt=null;if(Math.abs(dx)>1)w.face=dx>0?1:-1}else w.tgt=null}
      if(d<T*2.5&&!w.tgt)w.face=P.x>w.x?1:-1;
    }
  }
  wild=wild.filter(w=>w.engaged||w.life>0||(w.revealed&&Math.hypot(w.x-P.x,w.y-P.y)<T*5));
  // 3단지 cats
  for(const c of CATS){c.t+=dt;c.jump=Math.max(0,c.jump-dt);const d=Math.hypot(c.x-P.x,c.y-P.y);
    if(!c.revealed&&d<T*2.2){c.revealed=true;sfx.meow();floater(c.x,c.y-T*1.1,'냐옹!','#FFE38A');const st=S.cats[c.id];if(!st.met){st.met=true;touch();toast(st.name?`<b>${st.name}</b>${jong(st.name)?'을':'를'} 찾았어요!`:'처음 보는 고양이를 찾았어요!')}}
    if(!c.revealed&&d<T*7){c.meow-=dt;if(c.meow<=0){c.meow=rnd(4,8);floater(c.x+rnd(-10,10),c.y-T*.8,'냥','#fff')}}
    if(c.revealed&&d<T*3)c.face=P.x>c.x?1:-1;}
  for(const p of S.pets){
    p.t=(p.t||Math.random()*9)+dt;p.awake=Math.max(0,(p.awake||0)-dt);p.jump=Math.max(0,(p.jump||0)-dt);
    if(p.emote){p.emote.t-=dt;if(p.emote.t<=0)p.emote=null}
    const sl=isSleeping(p);
    if(!sl){p.mt=(p.mt??rnd(1,3))-dt;
      if(p.mt<=0){p.mt=rnd(2.5,6);const likes=S.placed.filter(dd=>SPEC[p.sp].decor.includes(dd.type)&&inYard(dd.x,dd.y));
        if(likes.length&&Math.random()<0.45){const dd=pick(likes);p.tgt={x:(dd.x+.5)*T+rnd(-.7,.7)*T,y:(dd.y+1)*T+rnd(0,.4)*T}}else{p.tgt=yardSpot()}
        if(Math.random()<0.25)p.emote={k:pick(['note','heart','spark']),t:1.8}}
      if(p.tgt){const dx=p.tgt.x-p.x,dy=p.tgt.y-p.y,m=Math.hypot(dx,dy);if(m>2){const s=Math.min(m,T*1.1*dt);p.x+=dx/m*s;p.y+=dy/m*s;if(Math.abs(dx)>1)p.face=dx>0?1:-1;p.walking=true}else{p.tgt=null;p.walking=false}}
      p.x=clamp(p.x,48.5*T,59.5*T);p.y=clamp(p.y,36.7*T,43.7*T);
      if(Math.floor(now)%10===0&&Math.floor(now-dt)%10!==0){if(S.placed.some(dd=>SPEC[p.sp].decor.includes(dd.type)&&Math.hypot((dd.x+.5)*T-p.x,(dd.y+.8)*T-p.y)<T*2)){p.happy=Math.min(100,p.happy+1);if(Math.random()<.3)p.emote={k:'spark',t:1.6}}}
    }else{p.walking=false;p.tgt=null}
  }
  for(const r of RES.values()){if(r.n<r.max){r.tm+=dt;if(r.tm>=r.every){r.tm=0;r.n++}}}
  floats.forEach(f=>f.t+=dt);floats=floats.filter(f=>f.t<1.4);
  parts.forEach(p=>{p.t+=dt;p.wx+=p.vx*dt;p.wy+=p.vy*dt;p.vy+=160*dt});parts=parts.filter(p=>p.t<p.life);
  conf.forEach(c=>{c.x+=c.vx*dt;c.y+=c.vy*dt;c.r+=c.vr*dt;c.life-=dt});conf=conf.filter(c=>c.life>0&&c.y<VH+20);
  if(tapFx){tapFx.t+=dt;if(tapFx.t>0.5)tapFx=null}
  fade=Math.max(0,fade-dt);
  const cand=uiOpen()?null:gather(P.x,P.y-T*.3,T*1.35)[0]||null;
  const b=$('#act');
  if(cand){if(b.hidden||b.textContent!==cand.label){b.textContent=cand.label;b.hidden=false}actItem=cand}else{if(!b.hidden)b.hidden=true;actItem=null}
  saveTm+=dt;if(saveTm>4){saveTm=0;if(dirty)save()}
}

  });

  if(act==='exercise')bob=Math.abs(Math.sin(t*5))*9;if(act==='dance'){rot=Math.sin(t*5)*0.14;bob=Math.abs(Math.sin(t*5))*4}

  if(sp==='dog'){c.save();c.translate(-11,-15);c.rotate(-0.6+Math.sin(t*14)*0.35);ell(c,0,-5,3.2,7,F1);c.restore()}

  ell(c,-5,-4+(nap?0:st*1.5),4.6,3.6,F1);ell(c,5,-4-(nap?0:st*1.5),4.6,3.6,F1);
  rr(c,-11,-25,22,20,8,d.shirt);

    if(sp==='dog'){c.fillStyle='#fff';c.fillRect(-10,-17,20,3)}
    if(sp==='hippo'){c.fillStyle='rgba(255,255,255,.7)';[[-5,-19],[4,-13],[-3,-10]].forEach(([a,b])=>{c.beginPath();c.arc(a,b,1.6,0,7);c.fill()})}}

  if(act==='exercise'){const u=Math.sin(t*5)>0;aL=u?-12:0;aR=u?-12:0}else if(act==='dance'){aL=Math.sin(t*5)*-6-4;aR=Math.sin(t*5+3)*-6-4}else if(o.wave>0)aR=-12+Math.sin(t*16)*3;
  else{aL=st;aR=-st}
  if(act==='sweep'){c.save();c.translate(13,-14);c.rotate(0.35+Math.sin(t*5)*0.3);c.fillStyle='#A0743F';c.fillRect(-1.2,-4,2.4,20);c.beginPath();c.moveTo(-5,16);c.lineTo(5,16);c.lineTo(3,10);c.lineTo(-3,10);c.closePath();shape(c,'#E8C46A',true,1.6);c.restore()}
  ell(c,-12,-17+aL,3.6,5.4,d.shirt);ell(c,12,-17+aR,3.6,5.4,d.shirt);
  ell(c,-12,-12+aL,2.8,2.6,F1);ell(c,12,-12+aR,2.8,2.6,F1);
  if(HALLOWEEN&&!o.por&&!act){ell(c,-14,-8,5,4.5,'#F28A2E');if(!SIL){c.fillStyle='#5A2A10';c.fillRect(-16,-9,4,1.4)}}
  const hy=-40;
  if(sp==='bear'){ell(c,-10,hy-11,5.5,5.5,F1);ell(c,10,hy-11,5.5,5.5,F1);if(!SIL){ell(c,-10,hy-11,2.8,2.8,F2,false);ell(c,10,hy-11,2.8,2.8,F2,false)}}
  if(sp==='hippo'){ell(c,-10,hy-11,3.6,3.2,F1);ell(c,10,hy-11,3.6,3.2,F1)}
  if(sp==='bunny'){const w=Math.sin(t*3)*0.08;ell(c,-6,hy-21,4.6,11,F1,true,-0.18+w);ell(c,6,hy-21,4.6,11,F1,true,0.18-w);if(!SIL){ell(c,-6,hy-20,2.2,7,'#FFB6C6',false,-0.18+w);ell(c,6,hy-20,2.2,7,'#FFB6C6',false,0.18-w)}}
  if(sp==='squirrel'){tri(c,[-13,hy-6],[-11,hy-20],[-4,hy-11],F1);tri(c,[4,hy-11],[11,hy-20],[13,hy-6],F1);if(!SIL){c.fillStyle=F2;c.beginPath();c.arc(-11,hy-20,2,0,7);c.arc(11,hy-20,2,0,7);c.fill()}}
  if(sp==='frog'){ell(c,-7,hy-11,6.5,6.5,F1);ell(c,7,hy-11,6.5,6.5,F1)}
  ell(c,0,hy,sp==='hippo'?17:16,14,F1);
  if(!SIL){c.fillStyle='rgba(255,255,255,.22)';c.beginPath();c.ellipse(-5,hy-8,7,3,-0.3,0,7);c.fill()}
  if(SIL){c.restore();return}
  const blink=nap||((t+n.d.id.length)%3.6)<0.13;
  const EY=sp==='frog'?[[-7,hy-11],[7,hy-11]]:[[-6,hy-2],[6,hy-2]];
  EY.forEach(([ex,ey],i)=>{
    if(sp==='frog'&&!blink){ell(c,ex,ey,4,4,'#fff',false)}
    if(blink){c.beginPath();c.arc(ex,ey-0.5,2.6,0.2,Math.PI-0.2);c.lineWidth=1.8;c.strokeStyle=BK;c.stroke();return}
    if(d.type==='lazy'){c.fillStyle=BK;c.beginPath();c.ellipse(ex,ey+0.6,2.3,2,0,0,7);c.fill();c.strokeStyle=BK;c.lineWidth=1.6;c.beginPath();c.moveTo(ex-3.5,ey-1);c.lineTo(ex+3.5,ey-1);c.stroke();return}
    const r=d.type==='peppy'?3.2:2.5;c.fillStyle=BK;c.beginPath();c.ellipse(ex,ey,r*0.85,r,0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(ex+0.9,ey-1.2,r*0.36,0,7);c.fill();
    if(d.type==='peppy'){c.beginPath();c.arc(ex-1,ey+1.2,0.7,0,7);c.fill()}
    if(d.type==='cranky'){c.strokeStyle=BK;c.lineWidth=2;c.beginPath();const s=i?-1:1;c.moveTo(ex-4*s,ey-5.5);c.lineTo(ex+2.5*s,ey-3.6);c.stroke()}
    if(d.type==='jock'){c.strokeStyle=BK;c.lineWidth=1.8;c.beginPath();c.moveTo(ex-3,ey-5);c.lineTo(ex+3,ey-6);c.stroke()}
  });
  if(sp==='bear'){ell(c,0,hy+5,7,5,F2,false);ell(c,0,hy+3,2.6,1.9,'#3B2C2A',false);c.beginPath();c.moveTo(0,hy+5);c.lineTo(0,hy+7);c.lineWidth=1.3;c.strokeStyle=OUT;c.stroke()}
  if(sp==='hippo'){ell(c,0,hy+6,11,7,F2);c.fillStyle='#7C5E8F';c.beginPath();c.ellipse(-3.5,hy+3.5,1.3,1.8,0,0,7);c.ellipse(3.5,hy+3.5,1.3,1.8,0,0,7);c.fill()}
  if(sp==='dog'){ell(c,0,hy+5,6.5,4.6,F2,false);ell(c,0,hy+2.6,2.8,2,BK,false);mouth(c,0,hy+6)}
  if(sp==='bunny'){tri(c,[-1.8,hy+2],[1.8,hy+2],[0,hy+4],'#F28AA0',false);mouth(c,0,hy+5)}
  if(sp==='squirrel'){ell(c,0,hy+5,5.5,4,F2,false);ell(c,0,hy+3,2,1.5,'#3B2C2A',false);mouth(c,0,hy+6)}
  if(sp==='frog'){c.beginPath();c.moveTo(-8,hy+3);c.quadraticCurveTo(0,hy+9,8,hy+3);c.lineWidth=1.6;c.strokeStyle=OUT;c.stroke()}
  blush(c,-10,hy+4);blush(c,10,hy+4);
  if(sp==='dog'){ell(c,-14,hy-1,4.6,8.5,'#C9A06A',true,0.35);ell(c,14,hy-1,4.6,8.5,'#C9A06A',true,-0.35);c.beginPath();c.roundRect(-15,hy-10,30,4,2);c.fillStyle='#E2504A';c.fill()}
  if(sp==='hippo'){for(let i=0;i<5;i++){const a=i*Math.PI*2/5;ell(c,10+Math.cos(a)*3,hy-12+Math.sin(a)*3,2.3,2.3,'#FFE38A',false)}ell(c,10,hy-12,1.8,1.8,'#E2557A',false)}
  if(sp==='bunny'){tri(c,[-6,hy-12],[-12,hy-16],[-12,hy-8],'#FF7FA8');tri(c,[-6,hy-12],[0,hy-16],[0,hy-8],'#FF7FA8');ell(c,-6,hy-12,2,2,'#E2557A')}
  if(sp==='squirrel'){c.save();c.translate(9,hy-11);c.rotate(0.5);ell(c,0,0,4,2,'#6FBF5A');c.restore()}
  if(sp==='bear'){c.beginPath();c.ellipse(0,hy-12,10,4.5,0,Math.PI,0);c.closePath();shape(c,'#4F8A5B');ell(c,0,hy-17,2.8,2.8,'#FFE38A')}
  c.restore();
}
function paintNpcCanvas(cn){const n=NPCS.find(q=>q.d.id===cn.dataset.npc);if(!n)return;const g=cn.getContext('2d'),w=cn.width,h=cn.height;g.clearRect(0,0,w,h);g.save();g.translate(w/2,h*0.95);const z=h/76;g.scale(z,z);drawVillager(g,n,0,0,now,1,{por:true});g.restore()}
function drawHideTuft(c,n){const s=now*12+n.t,wob=Math.sin(s)*2.4*(Math.sin(now*1.7+n.t)>0.2?1:0.2);
  tri(c,[n.x-11+wob,n.y],[n.x-6,n.y-17],[n.x-1+wob,n.y],'#5FA34C');tri(c,[n.x-2+wob,n.y],[n.x+3,n.y-21],[n.x+8+wob,n.y],PAL.grass2);tri(c,[n.x+5+wob,n.y],[n.x+10,n.y-14],[n.x+13+wob,n.y],'#5FA34C')}
function openNeighborsNews(){
  S.v5=true;touch();
  openModal(`<p class="sub center">새 소식</p><div class="big">동네에 이웃 6명이 이사 왔어요!</div>
   <div class="list" style="margin-top:10px">${NPCS.map(n=>`<div class="li" style="cursor:default"><canvas data-npc="${n.d.id}" width="144" height="116" style="width:72px;height:58px;flex:none"></canvas><div class="grow"><div class="nm">${n.d.name} <small style="color:var(--mute)">${n.d.tl}</small></div><div class="meta">${n.d.intro}</div></div></div>`).join('')}</div>
   <div class="news" style="margin-top:10px"><h4>이웃이랑 친해지는 법</h4>매일 말을 걸고, 좋아하는 간식을 선물하고, 부탁을 들어주면 하트가 올라요. 하트가 차면 이웃이 말버릇을 정해 달라고 하고, 제일 친해지면 사진을 줘요. 깡총이는 숨바꼭질, 번개는 달리기 시합을 하자고 해요!</div>
   <div class="row"><button class="btn" id="ok">만나러 가자!</button></div>`);$('#ok').onclick=closeModal}

/* ---------- 나가기 ---------- */
$('#exitBtn').onclick=()=>{if(RUN||HIDE||RACE){if(!confirm('하던 놀이가 끝나요. 나갈까요?'))return}
  openModal(`<h3>밍뉴의숲에서 나갈까요?</h3><p class="sub">지금까지 한 건 다 저장돼요. 다음에 오면 이어서 놀 수 있어요.</p><div class="row"><button class="btn soft" id="exN">더 놀래</button><button class="btn" id="exY">나가기</button></div>`);
  $('#exN').onclick=closeModal;$('#exY').onclick=async()=>{$('#exY').disabled=true;try{save()}catch(e){}
    try{leaveRoom(true)}catch(e){}
    if(SESS){try{flushCredits()}catch(e){}try{await Promise.race([World.saveGame('forest',JSON.stringify(S)),new Promise(r=>setTimeout(r,2500))])}catch(e){}}
    location.href=SESS?'../':'../'}};
/* ---------- NNN 월드 아바타와 크레딧 ---------- */
function avPack(){const a=myAv();return{b:a.base,f:a.fur||'cream',p:a.pat||'none',e:a.eye||'black'}}
let wearT=null;
function syncWear(){if(!SESS||!AVATAR)return;clearTimeout(wearT);wearT=setTimeout(()=>{const acc={};Object.entries(S.wear||{}).forEach(([k,v])=>{if(v)acc[k]=v});
  World.saveAvatar(Object.assign({},AVATAR,{acc})).catch(()=>{})},800)}
let PEND=0;try{PEND=+(localStorage.getItem('nnnw_pend:'+(SESS&&SESS.key))||0)}catch(e){}
function showCredits(){const e=$('#credits');if(e)e.textContent=(CREDITS+PEND).toLocaleString('ko-KR')}
function flushCredits(){if(!SESS||PEND<=0)return;const n=PEND;World.addCredits(n).then(c=>{PEND-=n;if(c!=null)CREDITS=c;try{localStorage.setItem('nnnw_pend:'+SESS.key,PEND)}catch(e){}showCredits()}).catch(()=>{})}
function earn(n,why){if(!SESS)return;PEND+=n;try{localStorage.setItem('nnnw_pend:'+SESS.key,PEND)}catch(e){}showCredits();
  floater(P.x,P.y-T*1.9,'+'+n+' 크레딧','#FFD23F');if(n>=3)toast(`크레딧 <b>+${n}</b> · ${why}`);flushCredits()}
function openWardrobe(){
  const slots={head:'머리',eyes:'얼굴',neck:'목',back:'등',costume:'분장'};
  const own=Object.keys(Avatar.ACCS).filter(k=>OWNED['acc:'+k]);
  openModal(`<h3>내 캐릭터와 옷장</h3><p class="sub">가진 꾸미기를 눌러 입고 벗어요. 새 옷과 캐릭터는 NNN 월드 상점에서 크레딧으로 사요.</p>
   <div style="display:flex;align-items:center;gap:12px;margin:10px 0"><canvas data-hero="me" width="200" height="160" style="width:120px;height:96px;background:#EAF6FB;border-radius:16px"></canvas><div><b style="font-family:var(--f-display);font-size:20px">${esc(SESS.nick)}</b><div class="sub">크레딧 ${(CREDITS+PEND).toLocaleString('ko-KR')}개</div></div></div>
   <div class="label">옷장</div>${own.length?`<div class="snacks">${own.map(k=>{const sl=Avatar.ACCS[k][1],on=S.wear[sl]===k;return `<button class="snack${on?' fav':''}" data-wear="${k}"><canvas data-acc="${k}" width="120" height="96" style="width:48px;height:38px"></canvas><span>${Avatar.ACCS[k][0]}</span><b>${on?'입는 중':slots[sl]}</b></button>`}).join('')}</div>`:'<p class="sub">아직 꾸미기가 없어요. 상점에서 첫 꾸미기를 골라 봐요!</p>'}
   <div class="row"><button class="btn soft" id="chX">닫기</button><a class="btn" href="../" style="text-decoration:none">상점 가기</a></div>`,
   ()=>{document.querySelectorAll('#modal canvas[data-hero]').forEach(cn=>heroPortrait(cn.getContext('2d'),'me',cn.width,cn.height,now))});
  document.querySelectorAll('#modal canvas[data-acc]').forEach(cn=>{const g=cn.getContext('2d');g.clearRect(0,0,cn.width,cn.height);Avatar.accIcon(g,cn.dataset.acc,cn.width,cn.height)});
  $('#chX').onclick=closeModal;
  $('#modal').onclick=e=>{const w=e.target.closest('[data-wear]');if(!w)return;const k=w.dataset.wear,sl=Avatar.ACCS[k][1];S.wear[sl]=S.wear[sl]===k?null:k;touch();sfx.pop();syncWear();sendState&&NET.code&&sendState(true);openWardrobe()};
}
if(SESS&&window.Avatar){
  $('#crChip').hidden=false;
  if(SESS.av){AVATAR=JSON.parse(JSON.stringify(SESS.av));S.wear=Object.assign({},AVATAR.acc||{})}
  showCredits();
  World.getMe().then(p=>{if(!p)return;AVATAR=p.av;OWNED=p.owned||{};CREDITS=p.credits||0;
    /* 숲에서 도토리로 샀던 꾸미기는 내 것으로 옮겨 줘요 */
    const add={};(S.accOwn||[]).forEach(k=>{if(Avatar.ACCS[k]&&!OWNED['acc:'+k])add['acc:'+k]=true});
    if(Object.keys(add).length){Object.assign(OWNED,add);Object.keys(add).forEach(id=>World.buy(id,0).catch(()=>{}))}
    S.wear=Object.assign({},AVATAR.acc||{});touch();showCredits();flushCredits();
    if(NET.code)sendState(true)}).catch(()=>{});
  let played=0;setInterval(()=>{if(document.hidden||uiOpen())return;if(P.moving)played+=1;else played+=0.25;if(played>=180){played=0;earn(1,'3분 놀았어요')}},1000);
  setInterval(flushCredits,20000);
}
requestAnimationFrame(loop);
