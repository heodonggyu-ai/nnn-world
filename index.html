<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NNN 월드</title>
<meta name="theme-color" content="#BFE6F5">
<link rel="icon" href="shared/img/samsaek.png">
<link rel="apple-touch-icon" href="shared/img/samsaek.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one column of sticker-style cards on a sky playground; game cards stack on phones, two across on wide screens */
:root{
  --sky:#BFE6F5; --sky-2:#A5D8EE; --paper:#FFFDF7; --ink:#24363B; --mute:#5F776D; --line:rgba(36,54,59,.16);
  --berry:#E2557A; --berry-deep:#B93A5E; --leaf:#3E8E5E; --leaf-deep:#1F4D36; --sun:#FFD23F;
  --f-display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 12% 8%,#fff 0 38px,transparent 39px),radial-gradient(circle at 20% 9%,#fff 0 28px,transparent 29px),radial-gradient(circle at 86% 15%,#fff 0 30px,transparent 31px),radial-gradient(circle at 93% 15%,#fff 0 22px,transparent 23px);
  background-repeat:no-repeat;padding-bottom:max(28px,env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{font-family:var(--f-display);font-size:34px;line-height:1;letter-spacing:.01em;color:var(--ink);display:flex;align-items:baseline;gap:6px}
.logo b{font-weight:400;background:var(--sun);border:2.5px solid var(--ink);border-radius:12px;padding:2px 10px 0;box-shadow:0 3px 0 rgba(36,54,59,.3);transform:rotate(-3deg);display:inline-block}
.spacer{flex:1}
.card{background:var(--paper);border:2.5px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 rgba(36,54,59,.28);padding:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:24px}
.sub{color:var(--mute);font-size:14px;line-height:1.5;margin:4px 0 0}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button{flex:1;height:44px;border-radius:14px;border:2.5px solid var(--ink);background:#fff;font-family:var(--f-display);font-size:17px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
label{display:block;font-family:var(--f-display);font-size:15px;color:var(--mute);margin:12px 0 6px}
input{width:100%;height:52px;border:2.5px solid var(--ink);border-radius:14px;padding:0 14px;font-family:var(--f-display);font-size:22px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.pin{letter-spacing:.5em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:52px;padding:0 18px;border-radius:16px;border:2.5px solid var(--ink);background:var(--berry);color:#fff;font-family:var(--f-display);font-size:19px;box-shadow:0 4px 0 var(--berry-deep);cursor:pointer;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--berry-deep)}
.btn.leaf{background:var(--leaf);box-shadow:0 4px 0 var(--leaf-deep)}
.btn.soft{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(36,54,59,.3)}
.btn.sm{height:38px;font-size:15px;border-radius:12px;padding:0 12px;border-width:2px}
.btn:disabled{opacity:.5}
.full{width:100%;margin-top:16px}
.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chars button{background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-family:var(--f-display);font-size:15px;color:var(--ink)}
.chars button.on{border-color:var(--berry);background:#FFF0F4}
.chars img{width:100%;max-width:110px;aspect-ratio:6/5;object-fit:contain}
#msg2:empty{display:none}
.msg{min-height:22px;margin-top:10px;color:var(--berry-deep);font-family:var(--f-display);font-size:16px}
.note{margin-top:14px;font-size:13px;color:var(--mute);line-height:1.5}
.hello{display:flex;align-items:center;gap:14px}
.hello img{width:96px;height:80px;object-fit:contain;background:#EAF6FB;border-radius:18px;border:2px solid var(--line);flex:none}
.hello .grow{flex:1;min-width:0}
.hello h2{font-size:26px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.join{display:flex;gap:8px;margin-top:10px}
.join input{flex:1;min-width:0;letter-spacing:.2em;text-align:center}
.join .btn{flex:none}
.sec{font-family:var(--f-display);font-size:22px;margin:26px 4px 12px;display:flex;align-items:center;gap:8px}
.sec span{font-size:14px;color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -4px 12px;padding:2px 4px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:38px;padding:0 13px;border-radius:999px;border:2.5px solid var(--ink);background:#fff;font-family:var(--f-display);font-size:15px;color:var(--ink);cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--ink);color:#fff}
/* 게임이 많아져서 작은 타일로: 폰 2칸, 넓은 화면 3~4칸. 타일 전체를 누르면 바로 시작 */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.game{position:relative;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 4px 0 rgba(36,54,59,.28);display:flex;flex-direction:column;text-decoration:none;color:var(--ink);transition:transform .08s,box-shadow .08s}
.game:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(36,54,59,.28)}
.game.feat{grid-column:1/-1;flex-direction:row}
.game.feat .cover{width:46%;flex:none;aspect-ratio:auto;border-bottom:0;border-right:2.5px solid var(--ink)}
.game.feat .body p{-webkit-line-clamp:3}
.cover{aspect-ratio:4/3;position:relative;overflow:hidden;border-bottom:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
.newb{position:absolute;top:7px;right:7px;background:#E2557A;color:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 7px;font-family:var(--f-display);font-size:11.5px}
.play{align-self:flex-start;margin-top:2px;background:var(--berry);color:#fff;border-radius:999px;padding:3px 11px 2px;font-family:var(--f-display);font-size:14px}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .art{font-family:var(--f-display);color:#fff;font-size:26px;text-align:center;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.25);padding:0 16px}
.cover .badge{position:absolute;top:7px;left:7px;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:1px 8px;font-family:var(--f-display);font-size:11.5px;color:var(--ink)}
.game .body{padding:9px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.game h3{font-size:17px;line-height:1.2}
.game p{margin:0;font-size:12.5px;line-height:1.4;color:var(--mute);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.game p.gnote{flex:none;font-size:12px;color:var(--leaf-deep);background:#F1FAF3;border-radius:10px;padding:6px 8px;-webkit-line-clamp:3}
.tags{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.tags i{font-style:normal;font-size:11px;background:#EAF6FB;border-radius:999px;padding:2px 7px;color:var(--ink);white-space:nowrap}
@media (min-width:640px){.game h3{font-size:19px}.game p{font-size:13.5px}}
.combo{background:repeating-linear-gradient(-45deg,#E2504A 0 22px,#D2433E 22px 44px)}
.crash{background:repeating-linear-gradient(90deg,#4F7FC1 0 26px,#456FAD 26px 52px)}
.bomb{background:radial-gradient(circle at 50% 50%,#FF9A52 0 30%,#FF7A2F 31% 60%,#E8453C 61%)}
.dice{background:radial-gradient(circle at 50% 40%,#3A8C62,#276848)}
.bori{background:repeating-linear-gradient(135deg,#F2D27A 0 18px,#E9C25C 18px 36px)}
.cover.bori .art{color:#24363B;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.soon{filter:saturate(.75)}
footer{margin-top:28px;font-size:13px;color:var(--mute);text-align:center;line-height:1.6}
.hi{margin:2px 4px 0}.hi h2{font-size:28px;overflow-wrap:anywhere}
.me{display:flex;align-items:center;gap:14px}
.me canvas{width:120px;height:110px;background:#EAF6FB;border-radius:20px;border:2px solid var(--line);flex:none}
.me .grow{flex:1;min-width:0}.me h2{font-size:26px;overflow-wrap:anywhere}
.coin{display:inline-flex;align-items:center;gap:6px;background:#FFF4C4;border:2px solid var(--ink);border-radius:999px;padding:3px 12px 2px;font-family:var(--f-display);font-size:18px;margin-top:6px}
.coin i{width:18px;height:18px;border-radius:50%;background:var(--sun);border:2px solid #B8860B;display:inline-block}
.shop .stabs{display:flex;gap:6px;overflow-x:auto;margin:12px -4px 12px;padding:0 4px 4px;scrollbar-width:none}
.shop .stabs button{flex:none;height:40px;padding:0 14px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-family:var(--f-display);font-size:16px;color:var(--ink);cursor:pointer}
.shop .stabs button.on{background:var(--ink);color:#fff}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.item{position:relative;background:#fff;border:2.5px solid var(--line);border-radius:16px;padding:4px 4px 8px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-family:var(--f-display);font-size:14px;color:var(--ink);gap:2px}
.item canvas{width:84px;height:70px}
.item.on{border-color:var(--berry);background:#FFF0F4}
.item.wear::after{content:'입는 중';position:absolute;top:4px;left:4px;font-size:11px;background:var(--leaf);color:#fff;border-radius:999px;padding:2px 7px}
.item .pr{font-size:13px;color:var(--mute)}.item .pr.own{color:var(--leaf)}.item .pr.lock{color:var(--berry-deep)}
.item.dim{opacity:.45}
.buybar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.buybar .what{flex:1;min-width:140px;font-family:var(--f-display);font-size:17px}
.earn{margin-top:14px;background:#F1FAF3;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.7;color:var(--leaf-deep)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px);background:var(--ink);color:#fff;font-family:var(--f-display);padding:10px 16px;border-radius:14px;z-index:9;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">NNN <b>월드</b></div><div class="spacer"></div><button class="btn soft sm" id="logout" hidden>나가기</button></header>

  <section id="auth" class="card" hidden>
    <h2>NNN 월드에 어서 와요!</h2>
    <p class="sub">별명과 비밀번호 숫자 4개만 있으면 돼요. 한 번 만들면 모든 게임에서 같은 친구로 놀아요.</p>
    <div class="tabs" role="tablist"><button class="on" data-mode="new" id="tNew">처음 왔어요</button><button data-mode="old" id="tOld">이미 있어요</button></div>
    <form id="form" autocomplete="off">
      <label for="nick">별명 (2~8글자)</label>
      <input id="nick" maxlength="8" placeholder="예: 밍뉴" autocapitalize="off">
      <label for="pin">비밀번호 (숫자 4개)</label>
      <input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••">
      <p class="sub" id="charBox" style="margin-top:12px">처음 오면 나만의 냥이 캐릭터를 하나 받아요. 게임에서 모은 크레딧으로 상점에서 꾸밀 수 있어요.</p>
      <button class="btn full" id="go" type="submit">시작하기</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
    <p class="note">비밀번호는 다른 기기에서 내 별명으로 들어올 때 필요해요. 친구에게도 알려 주지 마세요. 진짜 이름이나 학교, 전화번호는 별명에 쓰지 않아요.</p>
  </section>

  <section id="home" hidden>
    <div class="hi"><p class="sub">반가워요</p><h2 id="hiName">친구</h2></div>
    <div class="msg" id="msg2" role="status"></div>
    <div class="sec">게임 고르기 <span id="gameCount"></span></div>
    <div class="chips" id="chips"></div>
    <div class="games" id="games"></div>
    <footer>NNN 월드 · 아빠가 만든 게임들이 모이는 곳<br>게임은 계속 늘어나요</footer>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="shared/avatar.js?v=7"></script>
<script src="shared/world.js?v=7"></script>
<script>
const $=s=>document.querySelector(s);
const GAMES=[
  {id:'forest',grp:'online',name:'밍뉴의숲',desc:'한들물빛도시에 숨은 동물 친구들을 찾아 데려와 키워요. 탕정역부터 한들물빛도시, 설화·연화, 세교까지 실제 지도처럼 넓은 동네를 돌고, 학교와 집, 엔엔엔복싱에도 들어가요.',href:'forest/',img:'shared/img/forest-cover.jpg',tags:['친구와 같이','동물 키우기','학교 탐험','엄마 미션','핼러윈 이벤트'],note:'캐릭터 꾸미기 상점과 친구 초대코드는 밍뉴의숲 안에 있어요. 위쪽 노란 동전을 누르면 상점, 아래 <b>친구</b> 버튼을 누르면 초대코드!'},
  {id:'combo',grp:'action',name:'NNN 콤보 러시',desc:'코치 콜에 맞춰 콤보를 치고 체육관 랭킹에 도전해요.',href:'https://nnn-combo.netlify.app',img:'shared/img/combo-cover.jpg',art:'NNN<br>콤보 러시',cls:'combo',tags:['복싱','랭킹']},
  {id:'crash',grp:'action',name:'꽝! 크래시 드라이브',desc:'자동차를 쾅쾅 부딪치고 미션을 깨서 별을 모아요. 큰 충돌은 슬로모션!',href:'crash/',img:'shared/img/crash-cover.jpg',art:'꽝!<br>크래시 드라이브',cls:'crash',tags:['자동차','3D','미션']},
  {id:'bomb',grp:'party',name:'폭탄 돌리기',desc:'폰 하나를 옆사람에게 넘기며 해요. 폭탄을 받으면 암산 문제를 맞히고 빨리 넘기기! 터질 때 들고 있으면 탈락.',href:'bomb/',img:'shared/img/bomb-cover.jpg',art:'💣<br>폭탄 돌리기',cls:'bomb',tags:['여럿이 한 폰','암산','파티']},
  {id:'dice',grp:'party',name:'욕심 주사위',desc:'한 번 더 굴릴까, 멈출까? 숫자가 쌓이지만 1이 나오면 꽝! 폰을 돌려가며 하고, 혼자면 관장봇이랑 대결해요.',href:'dice/',img:'shared/img/dice-cover.jpg',art:'🎲<br>욕심 주사위',cls:'dice',tags:['주사위','눈치싸움','혼자도 OK']},
  {id:'bori',grp:'party',name:'보리보리쌀',desc:'폰이 술래 손! 쌀그릇에 손가락을 올리고 "쌀!"에만 쏙 빼요. 가짜 말에 속지 마세요.',href:'bori/',img:'shared/img/bori-cover.jpg',art:'🌾<br>보리보리쌀',cls:'bori',tags:['반응속도','여럿이 한 폰','전래놀이']},
  {id:'fps',isNew:1,grp:'action online',name:'NNN 아레나',desc:'한들물빛공원에서 붙는 팀 대결 FPS! 돌격소총·샷건·저격총에 권총·복싱 글러브·수류탄까지. 슬라이딩으로 피하고 5라운드 먼저 이기면 우승.',href:'fps/',img:'shared/img/fps-cover.jpg',tags:['FPS','1대1·2대2','3D']},
  {id:'kart',isNew:1,grp:'action',name:'NNN 드리프트 카트',desc:'한들물빛도시 동네 도로 3바퀴 스피드전! 드리프트로 게이지를 채워 부스터를 모으고, 순간부스터로 역전해요.',href:'kart/',img:'shared/img/kart-cover.jpg',tags:['레이싱','드리프트','3D']},
  {id:'quiz',isNew:1,grp:'party study',name:'NNN 퀴즈왕',desc:'상식·넌센스·과자 초성·속담·나라와 수도! 혼자 도전하거나, TV에 띄우고 팀끼리 대결해요.',href:'quiz/',img:'shared/img/quiz-cover.jpg',tags:['퀴즈','넌센스','다 같이']},
  {id:'english',isNew:1,grp:'study',name:'NNN 잉글리시',desc:'10단원 영어 여행! 단어·표현·문법을 레슨으로 익히고, 듣고 따라 말하며 공부해요.',href:'english/',img:'shared/img/english-cover.jpg',tags:['영어','듣기·말하기','매일 학습']},
  {id:'beat',isNew:1,grp:'action',name:'NNN 샌드백 비트',desc:'노래에 맞춰 샌드백의 얼굴·바디·훅 포인트를 쳐요! 원투·연타·더킹·피버까지, 5곡 × 3단계 리듬게임.',href:'beat/',img:'shared/img/beat-cover.jpg',tags:['리듬게임','샌드백','S랭크 도전']},
  {id:'ppopgi',isNew:1,grp:'party',name:'NNN 문방구 뽑기',desc:'학교 앞 문방구 그 뽑기! 종이 뽑기판을 뜯어 1등 RC카를 노리고, 캡슐을 돌려 복싱 피규어 20종을 모아요.',href:'ppopgi/',img:'shared/img/ppopgi-cover.jpg',tags:['뽑기','캡슐','도감 모으기']},
  {id:'omok',isNew:1,grp:'board',name:'NNN 오목',desc:'다섯 개를 먼저 잇는 사람이 승리! 컴퓨터 3단계 또는 폰 하나로 둘이서. 쌍삼 금지 규칙도 켤 수 있어요.',href:'omok/',img:'shared/img/omok-cover.jpg',tags:['오목','컴퓨터 대결','둘이서']},
  {id:'baduk',isNew:1,grp:'board',name:'NNN 바둑',desc:'9·13·19줄 바둑판. 따내기·패·계가까지 진짜 규칙 그대로! 컴퓨터와 두거나 둘이서 둬요.',href:'baduk/',img:'shared/img/baduk-cover.jpg',tags:['바둑','9줄 입문','자동 계가']},
  {id:'janggi',isNew:1,grp:'board',name:'NNN 장기',desc:'차·포·마·상·궁성 대각선까지 정식 규칙! 장군·외통 알림, 상차림 4가지, 한글/한자 말.',href:'janggi/',img:'shared/img/janggi-cover.jpg',tags:['장기','컴퓨터 대결','둘이서']},
  {id:'alkkagi',isNew:1,grp:'board party',name:'NNN 알까기',desc:'알을 뒤로 당겼다 튕겨서 상대 알을 판 밖으로! 바둑알·장기알 알까기와 30단계 도전 모드.',href:'alkkagi/',img:'shared/img/alkkagi-cover.jpg',tags:['알까기','일타이피','도전 30단계']},
  {id:'charades',isNew:1,grp:'party',name:'몸으로 말해요',desc:'말은 금지! 폰에 뜬 제시어를 몸짓으로만 설명하고 우리 팀이 맞혀요. 스포츠·동물·속담·직업·음식·생활 동작·복싱·사물 주제를 골라요.',href:'charades/',img:'shared/img/charades-cover.jpg',art:'🙆<br>몸으로 말해요',tags:['여럿이 한 폰','팀 대결','몸짓']},
];
let mode='new',ME=null,AV=null,TRY=null,TAB='base',SEL=null;
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function setMode(m){mode=m;$('#tNew').classList.toggle('on',m==='new');$('#tOld').classList.toggle('on',m==='old');$('#charBox').hidden=m!=='new';$('#go').textContent=m==='new'?'시작하기':'들어가기';$('#msg').textContent=''}
$('#tNew').onclick=()=>setMode('new');$('#tOld').onclick=()=>setMode('old');
$('#form').onsubmit=async e=>{e.preventDefault();const nick=$('#nick').value.trim(),pin=$('#pin').value.trim();$('#go').disabled=true;$('#msg').textContent='잠깐만요…';
  try{const s=mode==='new'?await World.signup(nick,pin):await World.login(nick,pin);$('#msg').textContent='';showHome(s);toast(mode==='new'?`${s.nick}, NNN 월드에 온 걸 환영해요!`:`${s.nick}, 다시 왔구나!`)}
  catch(err){$('#msg').textContent=(err&&err.msg)||'잠시 후 다시 해 주세요.'}
  finally{$('#go').disabled=false}};
const GRPS=[['all','전체'],['action','🏎️ 3D·액션'],['party','🎉 여럿이 한 폰'],['study','📚 공부·퀴즈'],['board','♟️ 보드게임'],['online','👥 친구랑 온라인']];
let GRP=(()=>{try{return localStorage.getItem('nnnw_grp')||'all'}catch(e){return 'all'}})();
function renderGames(){
  $('#gameCount').textContent=`${GAMES.filter(g=>!g.soon).length}개`;
  $('#chips').innerHTML=GRPS.map(([k,n])=>`<button data-g="${k}" class="${k===GRP?'on':''}">${n}</button>`).join('');
  const list=GAMES.filter(g=>GRP==='all'||(g.grp||'').split(' ').includes(GRP));
  $('#games').innerHTML=list.map(g=>{const feat=g.id==='forest'&&GRP==='all';const tag=g.soon?'div':'a';
    return `<${tag} class="game${g.soon?' soon':''}${feat?' feat':''}"${g.soon?'':` href="${g.href}"`}>
    <div class="cover ${g.cls||''}">${g.img?`<img src="${g.img}" alt="${g.name} 게임 화면" loading="lazy">`:`<div class="art">${g.art}</div>`}${g.soon?'<span class="badge">곧 들어와요</span>':g.id==='forest'?'<span class="badge">친구와 같이</span>':''}${g.isNew?'<span class="newb">NEW</span>':''}</div>
    <div class="body"><h3>${g.name}</h3><p>${g.desc}</p>${feat&&g.note?`<p class="gnote">${g.note}</p>`:''}<div class="tags">${g.tags.slice(0,2).map(t=>`<i>${t}</i>`).join('')}</div>${g.soon?'':'<span class="play">▶ 플레이</span>'}</div></${tag}>`}).join('');
}
document.addEventListener('click',e=>{const b=e.target.closest('#chips [data-g]');if(!b)return;GRP=b.dataset.g;try{localStorage.setItem('nnnw_grp',GRP)}catch(_){}renderGames()});
const IS_ADMIN=()=>{const s=World.session();return s&&s.key===World.ADMIN_KEY};
const clone=o=>JSON.parse(JSON.stringify(o||{}));
function fixAv(av){av=Object.assign({base:'cat',fur:'cream',pat:'none',eye:'black',acc:{}},clone(av));av.acc=av.acc||{};if(IS_ADMIN())av.base='mingnyu';else if(av.base==='mingnyu')av.base='cat';return av}
function showHome(s){
  $('#auth').hidden=true;$('#home').hidden=false;$('#logout').hidden=false;
  $('#hiName').textContent=s.key===World.ADMIN_KEY?s.nick+' (밍뉴의숲 숲지기)':s.nick;
  renderGames();
  World.getMe().catch(()=>{$('#msg2').textContent='인터넷 연결이 약해요. 혼자 놀기는 그대로 돼요.'});
}
function showAuth(){$('#home').hidden=true;$('#auth').hidden=false;$('#logout').hidden=true;setMode('new')}
$('#logout').onclick=()=>{World.logout();showAuth();toast('나갔어요. 다음에 또 와요!')};
const qs=new URLSearchParams(location.search);if(/^[0-9]{6}$/.test(qs.get('code')||'')&&World.session())location.replace('forest/?room='+qs.get('code'));
const s=World.session();if(s)showHome(s);else showAuth();
</script>
</body>
