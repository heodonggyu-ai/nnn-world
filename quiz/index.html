<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NNN 퀴즈왕</title>
<meta name="theme-color" content="#FFF4D6">
<link rel="icon" href="../shared/img/samsaek.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 한 손 세로 화면: 위=진행·점수, 가운데=큰 문제 카드, 아래=엄지로 누르는 보기 4개. 진행자 모드는 TV처럼 크게 */
:root{
  --paper:#FFF4D6; --card:#FFFDF7; --ink:#24363B; --mute:#6E7563; --line:rgba(36,54,59,.16);
  --red:#E8453C; --blue:#2E6FD8; --green:#2E9A5A; --yellow:#FFD23F; --purple:#8E5BD8; --pink:#FF7AA8; --orange:#FF8A2F;
  --f-display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  background-image:radial-gradient(rgba(36,54,59,.07) 1.5px,transparent 1.6px);background-size:18px 18px}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top .grow{flex:1;min-width:0}
.icon{width:44px;height:44px;border-radius:14px;border:2.5px solid var(--ink);background:#fff;font-size:18px;display:grid;place-items:center;flex:0 0 auto;text-decoration:none;color:var(--ink)}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 rgba(36,54,59,.25);padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:2.5px solid var(--ink);border-radius:18px;background:var(--orange);color:#fff;font-family:var(--f-display);font-size:21px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.soft{background:#fff;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:12px}

/* 홈 */
.hero{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.hero .crown{font-size:58px;line-height:1;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
.hero h1{font-size:40px;line-height:1}
.hero p{margin:4px 0 0;color:var(--mute);font-size:14px;line-height:1.45}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:4px;margin-bottom:12px}
.modes button{border:0;border-radius:11px;background:transparent;padding:10px 4px;font-family:var(--f-display);font-size:17px}
.modes button.on{background:var(--ink);color:#fff}
.modes button small{display:block;font-family:var(--f-body);font-size:11.5px;opacity:.75}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{position:relative;text-align:left;border:2.5px solid var(--ink);border-radius:20px;padding:14px 12px 12px;background:var(--c);color:#fff;box-shadow:0 5px 0 var(--ink);min-height:118px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cat:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.cat .em{font-size:34px;line-height:1}
.cat b{font-family:var(--f-display);font-weight:400;font-size:21px;margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.cat small{font-size:12.5px;opacity:.95;line-height:1.35}
.cat .best{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.9);color:var(--ink);font-family:var(--f-display);font-size:12px;border-radius:999px;padding:2px 8px}
.cat.wide{grid-column:1/-1;min-height:84px;flex-direction:row;align-items:center;gap:12px}
.cat.wide b{margin:0}
.teams{display:flex;gap:6px;align-items:center;margin-top:10px;font-family:var(--f-display);font-size:16px}
.teams button{width:44px;height:40px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-family:var(--f-display);font-size:18px}
.teams button.on{background:var(--ink);color:#fff}

/* 문제 화면 */
.hud{display:flex;align-items:center;gap:8px}
.prog{flex:1;height:14px;border-radius:7px;background:#fff;border:2.5px solid var(--ink);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.pts{font-family:var(--f-display);font-size:20px;min-width:66px;text-align:right}
.combo{font-family:var(--f-display);font-size:14px;color:var(--orange);min-height:18px;text-align:right}
.qcard{margin-top:12px;position:relative;text-align:center;padding:20px 16px 18px}
.qtag{display:inline-block;font-family:var(--f-display);font-size:14px;color:#fff;background:var(--c,var(--ink));border-radius:999px;padding:3px 12px 2px;margin-bottom:10px}
.qtext{font-family:var(--f-display);font-size:clamp(24px,6.6vw,32px);line-height:1.3;word-break:keep-all}
.chosung{font-family:var(--f-display);font-size:clamp(56px,18vw,86px);letter-spacing:.08em;line-height:1.1;color:var(--ink);margin:6px 0}
.hints{display:flex;flex-direction:column;gap:6px;margin-top:8px;min-height:20px}
.hint{font-size:16px;background:#FFF1C9;border-radius:12px;padding:7px 10px;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.hint b{font-family:var(--f-display);font-weight:400}
.hint.lock{background:#F1EEE6;color:var(--mute)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.timer{height:8px;border-radius:4px;background:#EDE6D3;overflow:hidden;margin-top:14px}
.timer i{display:block;height:100%;width:100%;background:var(--orange);transform-origin:left}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ans button{min-height:clamp(64px,10vh,84px);border:2.5px solid var(--ink);border-radius:18px;background:#fff;font-family:var(--f-display);font-size:clamp(17px,4.8vw,22px);line-height:1.2;padding:8px;box-shadow:0 5px 0 var(--ink);word-break:keep-all;transition:transform .06s,box-shadow .06s}
.ans button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.ans button.ok{background:var(--green);color:#fff}
.ans button.no{background:var(--red);color:#fff}
.ans button.dim{opacity:.45}
.ans.lock button{pointer-events:none}
.fb{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-family:var(--f-display);font-size:22px;color:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:4px 16px 2px;white-space:nowrap;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.fb.ok{background:var(--green)}.fb.no{background:var(--red)}
.note{margin-top:10px;font-size:15px;color:var(--mute);min-height:22px;text-align:center}
.note b{color:var(--ink);font-family:var(--f-display);font-weight:400}

/* 진행자 모드 */
.host .qtext{font-size:clamp(28px,5.4vw,52px)}
.host .chosung{font-size:clamp(70px,14vw,140px)}
.host .ans button{font-size:clamp(20px,3.4vw,32px)}
.score{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.score button{flex:1;min-width:110px;border:2.5px solid var(--ink);border-radius:16px;background:var(--c);color:#fff;font-family:var(--f-display);font-size:18px;padding:8px 6px;box-shadow:0 4px 0 var(--ink)}
.score button b{display:block;font-weight:400;font-size:30px;line-height:1}
.score button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hostbar{display:flex;gap:8px;margin-top:12px}
.hostbar .btn{min-height:52px;font-size:19px}

/* 결과 */
.res{text-align:center}
.res .big{font-size:64px;line-height:1}
.res h2{font-size:34px;margin:6px 0 2px}
.res .sum{color:var(--mute);margin:0 0 12px}
.stars{font-size:34px;letter-spacing:4px}
.review{text-align:left;display:grid;gap:6px;margin:12px 0;max-height:34vh;overflow:auto}
.review div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.4}
.review div b{font-family:var(--f-display);font-weight:400;color:var(--green)}
.review div.x{border-color:#F3B2AD}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<section id="home" class="wrap">
  <div class="top"><a class="icon" id="back" href="../" aria-label="NNN 월드로">←</a><div class="grow"></div><button class="icon snd" aria-label="소리 켜고 끄기">🔊</button></div>
  <div class="hero"><div class="crown">👑</div><div><h1>NNN 퀴즈왕</h1><p>상식부터 넌센스, 과자 초성까지!<br>빨리 맞힐수록 점수가 커요.</p></div></div>
  <div class="modes" id="modes"><button data-m="solo">🙋 혼자 도전<small>10문제 · 타이머 · 콤보</small></button><button data-m="host">📺 다 같이<small>진행자가 TV·폰에 띄우고 팀 대결</small></button></div>
  <div class="cats" id="cats"></div>
  <div class="card" id="teamBox" hidden style="margin-top:12px"><b style="font-family:var(--f-display);font-weight:400">몇 팀이 할까요?</b><div class="teams" id="teams"><button data-t="2">2</button><button data-t="3">3</button><button data-t="4">4</button><span style="font-size:13px;color:var(--mute);font-family:var(--f-body)">· 정답을 외친 팀 버튼을 눌러 점수를 줘요</span></div></div>
</section>

<section id="play" class="wrap" hidden>
  <div class="top"><button class="icon" id="quit" aria-label="그만하기">✕</button><div class="grow hud"><div class="prog"><i id="progBar"></i></div></div><div><div class="pts" id="pts">0</div><div class="combo" id="combo"></div></div><button class="icon snd" aria-label="소리 켜고 끄기">🔊</button></div>
  <div class="card qcard" id="qcard">
    <span class="qtag" id="qtag">상식</span>
    <div id="qbody"></div>
    <div class="timer" id="timerBox"><i id="timer"></i></div>
  </div>
  <div class="ans" id="ans"></div>
  <div class="note" id="note"></div>
  <div class="hostbar" id="hostbar" hidden><button class="btn soft" id="reveal">정답 보기</button><button class="btn" id="next">다음 문제 →</button></div>
  <div class="score" id="score" hidden></div>
</section>

<section id="result" class="wrap" hidden>
  <div class="card res" style="margin-top:auto;margin-bottom:auto">
    <div class="big" id="resEmoji">🏆</div><h2 id="resTitle">퀴즈왕!</h2><div class="stars" id="resStars"></div><p class="sum" id="resSum"></p>
    <div class="review" id="review"></div>
    <div class="stack"><button class="btn" id="again">한 번 더</button><button class="btn soft" id="goHome">다른 퀴즈 고르기</button></div>
  </div>
</section>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem('nnnquiz.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('nnnquiz.'+k,JSON.stringify(v))}catch(e){}}};
if(window.top!==window)$('back').hidden=true;

/* 문제 하나로 바꾸기 */
function makeQ(cat){
  if(cat==='gen'||cat==='non'||cat==='prov'){const src=cat==='gen'?GEN:cat==='non'?NON:PROV;const r=src[Math.floor(Math.random()*src.length)];
    return{cat,text:r[0],answer:r[1],choices:shuffle(r.slice(1,5)),note:r[5]||'',key:cat+r[0]}}
  if(cat==='cap'){const r=CAP[Math.floor(Math.random()*CAP.length)];return{cat,text:`${r[0]}의 수도는?`,answer:r[1],choices:shuffle(r.slice(1,5)),key:cat+r[0]}}
  if(cat==='snack'){const r=SNACK[Math.floor(Math.random()*SNACK.length)],ch=chosung(r[0]);
    // 헷갈리게: 첫 초성이 같은 과자를 먼저 오답으로
    const others=shuffle(SNACK.filter(x=>x[0]!==r[0])).sort((a,b)=>(chosung(b[0])[0]===ch[0])-(chosung(a[0])[0]===ch[0]));
    return{cat,chosung:ch,answer:r[0],choices:shuffle([r[0],...others.slice(0,3).map(x=>x[0])]),hints:[r[1],r[2]],key:cat+r[0]}}
}
function buildSet(cat,n){const out=[],seen=new Set();let guard=0;
  while(out.length<n&&guard++<500){const c=cat==='mix'?['gen','non','snack','prov','cap'][Math.floor(Math.random()*5)]:cat;const q=makeQ(c);if(seen.has(q.key))continue;seen.add(q.key);out.push(q)}
  return out}

/* ================= 소리 ================= */
let SOUND=store.get('sound',true),AC=null;
function audio(){if(!SOUND)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function tone(f,d,type='triangle',v=.15,w=0){const a=audio();if(!a)return;const t=a.currentTime+w,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
const sfx={ok:()=>{tone(784,.1);tone(1175,.16,'triangle',.15,.08)},no:()=>{tone(220,.25,'sawtooth',.1);tone(160,.3,'sawtooth',.08,.1)},tick:()=>tone(1000,.03,'square',.05),hint:()=>tone(660,.1,'sine',.12),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.16,i*.11)),team:()=>{tone(880,.08);tone(1320,.12,'triangle',.15,.07)}};
function paintSnd(){document.querySelectorAll('.snd').forEach(b=>b.textContent=SOUND?'🔊':'🔇')}
document.querySelectorAll('.snd').forEach(b=>b.onclick=()=>{SOUND=!SOUND;store.set('sound',SOUND);paintSnd();audio()});paintSnd();

/* ================= 홈 ================= */
let MODE=store.get('mode','solo'),TEAMS=store.get('teams',2);
const TEAMC=['#2E6FD8','#E8453C','#2E9A5A','#FF8A2F'],TEAMN=['파랑 팀','빨강 팀','초록 팀','주황 팀'];
function renderHome(){
  $('modes').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===MODE));$('teamBox').hidden=MODE!=='host';
  $('teams').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.t===TEAMS));
  const best=store.get('best',{});
  $('cats').innerHTML=CATS.map(c=>`<button class="cat${c.wide?' wide':''}" style="--c:${c.c}" data-c="${c.id}"><span class="em">${c.em}</span><span><b>${c.name}</b><br><small>${c.sub}</small></span>${best[c.id]&&MODE==='solo'?`<span class="best">최고 ${best[c.id]}</span>`:''}</button>`).join('')}
$('modes').onclick=e=>{const b=e.target.closest('button');if(!b)return;MODE=b.dataset.m;store.set('mode',MODE);renderHome()};
$('teams').onclick=e=>{const b=e.target.closest('button');if(!b)return;TEAMS=+b.dataset.t;store.set('teams',TEAMS);renderHome()};
$('cats').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;audio();start(b.dataset.c)};
function show(id){['home','play','result'].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}

/* ================= 게임 ================= */
const N=10;
const S={cat:'gen',qs:[],i:0,score:0,combo:0,best:0,right:0,log:[],t0:0,limit:15,raf:0,lock:false,hintAt:[],team:[]};
function start(cat){S.cat=cat;S.qs=buildSet(cat,MODE==='host'?20:N);S.i=0;S.score=0;S.combo=0;S.best=0;S.right=0;S.log=[];S.team=Array(TEAMS).fill(0);
  $('play').classList.toggle('host',MODE==='host');$('hostbar').hidden=MODE!=='host';$('score').hidden=MODE!=='host';$('pts').parentElement.hidden=MODE==='host';
  show('play');renderTeams();ask()}
const catOf=id=>CATS.find(c=>c.id===id);
function ask(){
  const q=S.qs[S.i];S.lock=false;S.hints=0;cancelAnimationFrame(S.raf);
  const c=catOf(q.cat);$('qcard').style.setProperty('--c',c.c);$('qtag').textContent=`${c.em} ${c.name} · ${S.i+1}/${S.qs.length}`;
  $('progBar').style.width=(S.i/S.qs.length*100)+'%';
  if(q.cat==='snack'){$('qbody').innerHTML=`<div class="qtext" style="font-size:18px;color:var(--mute)">이 과자 이름은?</div><div class="chosung">${q.chosung}</div><div class="hints" id="hints"><div class="hint lock">💡 힌트 1 · 잠시 뒤 공개</div><div class="hint lock">💡 힌트 2 · 잠시 뒤 공개</div></div>`}
  else $('qbody').innerHTML=`<div class="qtext">${esc(q.text)}</div>`;
  $('ans').className='ans';$('ans').innerHTML=q.choices.map(t=>`<button data-v="${esc(t)}">${esc(t)}</button>`).join('');
  $('note').innerHTML=MODE==='host'?'정답을 외친 팀 버튼을 눌러 점수를 주세요':'';$('qcard').querySelector('.fb')?.remove();
  S.limit=MODE==='host'?(q.cat==='snack'?24:20):(q.cat==='snack'?20:15);S.t0=performance.now();S.lastTick=0;
  $('timerBox').hidden=false;tick()}
function tick(){const q=S.qs[S.i];const el=(performance.now()-S.t0)/1000,left=Math.max(0,1-el/S.limit);$('timer').style.transform=`scaleX(${left})`;$('timer').style.background=left<.3?'var(--red)':'var(--orange)';
  if(q.cat==='snack'){const want=el>S.limit*.6?2:el>S.limit*.3?1:0;while(S.hints<want){const h=$('hints').children[S.hints];h.classList.remove('lock');h.innerHTML=S.hints===0?`💡 <b>${q.hints[0]}</b>`:`💡 ${esc(q.hints[1])}`;S.hints++;sfx.hint()}}
  const sec=Math.ceil(S.limit-el);if(sec<=3&&sec>0&&sec!==S.lastTick){S.lastTick=sec;sfx.tick()}
  if(S.lock)return;if(el>=S.limit){if(MODE==='host'){reveal();return}answer(null);return}S.raf=requestAnimationFrame(tick)}
$('ans').onclick=e=>{const b=e.target.closest('button');if(!b||S.lock)return;if(MODE==='host'){reveal();return}answer(b.dataset.v,b)};
function answer(v,btn){const q=S.qs[S.i];S.lock=true;cancelAnimationFrame(S.raf);$('ans').classList.add('lock');
  const el=(performance.now()-S.t0)/1000,ok=v===q.answer;
  [...$('ans').children].forEach(b=>{if(b.dataset.v===q.answer)b.classList.add('ok');else if(b===btn)b.classList.add('no');else b.classList.add('dim')});
  let gain=0;
  if(ok){S.combo++;S.best=Math.max(S.best,S.combo);S.right++;const speed=Math.max(0,1-el/S.limit);gain=Math.round(100+speed*100+(q.cat==='snack'?(2-S.hints)*50:0));gain=Math.round(gain*(1+Math.min(4,S.combo-1)*.25));S.score+=gain;sfx.ok()}
  else{S.combo=0;sfx.no()}
  const fb=document.createElement('div');fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?(S.combo>=3?`🔥 ${S.combo}연속! +${gain}`:`정답! +${gain}`):(v==null?'시간 끝!':'땡!');$('qcard').appendChild(fb);
  $('pts').textContent=S.score;$('combo').textContent=S.combo>=2?`🔥 ${S.combo} 콤보`:'';
  $('note').innerHTML=(ok?'':`정답: <b>${esc(q.answer)}</b>`)+(q.note?` <span>· ${esc(q.note)}</span>`:'');
  S.log.push({q,ok,v});
  setTimeout(next,ok?1100:1900)}
function next(){S.i++;if(S.i>=S.qs.length)finish();else ask()}
/* 진행자 모드 */
function reveal(){const q=S.qs[S.i];if(S.lock)return;S.lock=true;cancelAnimationFrame(S.raf);$('ans').classList.add('lock');
  [...$('ans').children].forEach(b=>b.classList.add(b.dataset.v===q.answer?'ok':'dim'));
  if(q.cat==='snack'){const h=$('hints');[...h.children].forEach((d,i)=>{d.classList.remove('lock');d.innerHTML=i===0?`💡 <b>${q.hints[0]}</b>`:`💡 ${esc(q.hints[1])}`})}
  $('note').innerHTML=`정답: <b>${esc(q.answer)}</b>`+(q.note?` · ${esc(q.note)}`:'');sfx.ok()}
$('reveal').onclick=reveal;
$('next').onclick=()=>{if(!S.lock)reveal();next()};
function renderTeams(){$('score').innerHTML=S.team.map((v,i)=>`<button style="--c:${TEAMC[i]}" data-t="${i}">${TEAMN[i]}<b>${v}</b></button>`).join('')}
$('score').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;S.team[+b.dataset.t]++;sfx.team();renderTeams();if(!S.lock)reveal()};
$('quit').onclick=()=>{cancelAnimationFrame(S.raf);if(MODE==='host'&&S.i>0){finish();return}show('home');renderHome()};
function finish(){cancelAnimationFrame(S.raf);
  if(MODE==='host'){const max=Math.max(...S.team),win=S.team.map((v,i)=>v===max?TEAMN[i]:null).filter(Boolean);
    $('resEmoji').textContent='🏆';$('resTitle').textContent=max===0?'다음엔 꼭!':win.length>1?'무승부!':`${win[0]} 우승!`;$('resStars').textContent='';
    $('resSum').textContent=S.team.map((v,i)=>`${TEAMN[i]} ${v}점`).join(' · ');$('review').innerHTML='';show('result');if(max>0){sfx.win();confetti()}return}
  const best=store.get('best',{}),prev=best[S.cat]||0;if(S.score>prev){best[S.cat]=S.score;store.set('best',best)}
  const st=S.right>=9?3:S.right>=6?2:S.right>=3?1:0;
  $('resEmoji').textContent=st===3?'👑':st===2?'🎉':st===1?'🙂':'💪';$('resTitle').textContent=st===3?'퀴즈왕 등극!':st===2?'잘했어요!':st===1?'좋아요, 한 번 더!':'다시 도전!';
  $('resStars').textContent='★'.repeat(st)+'☆'.repeat(3-st);
  $('resSum').textContent=`${S.right}/${N} 정답 · ${S.score}점 · 최대 ${S.best}콤보`+(S.score>prev?' · 🆕 최고 기록!':'');
  $('review').innerHTML=S.log.map(({q,ok,v})=>`<div class="${ok?'':'x'}">${ok?'⭕':'❌'} ${q.cat==='snack'?`과자 초성 <b style="color:var(--ink)">${q.chosung}</b>`:esc(q.text)} → <b>${esc(q.answer)}</b>${!ok&&v?` <span style="color:var(--mute)">(내 답: ${esc(v)})</span>`:''}</div>`).join('');
  show('result');if(st>=2){sfx.win();confetti()}}
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#E8453C','#FFD23F','#2E9A5A','#2E6FD8','#FF7AA8'];
  for(let i=0;i<60;i++){const d=document.createElement('i');d.style.left=Math.random()*100+'%';d.style.background=cols[i%5];d.style.animationDuration=(1.8+Math.random()*1.8)+'s';d.style.animationDelay=Math.random()*.6+'s';c.appendChild(d)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}
$('again').onclick=()=>start(S.cat);
$('goHome').onclick=()=>{show('home');renderHome()};
renderHome();
</script>
</body>
</html>
