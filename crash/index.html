<!doctype html><html><head><meta charset=utf8><link rel="icon" href="../shared/img/samsaek.png"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>꽝! 크래시 드라이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@600;800&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
/* Layout: full-bleed 3D scene; HUD pinned to corners; driving pads in thumb reach; menus are cards over the live scene. One committed arcade look. */
:root{
  --ink:#121417;
  --glass:rgba(18,20,23,.74);
  --card:rgba(20,22,26,.94);
  --line:rgba(255,255,255,.14);
  --fg:#f4f2ec;
  --muted:#b3b8bf;
  --hazard:#ffcc1f;
  --hot:#ff4b3e;
  --ok:#3fd17f;
  --f-display:"Black Han Sans","Gothic A1",system-ui,sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--f-body)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}

.hud{position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:8px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.panel{background:var(--glass);border-radius:10px;padding:8px 10px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.stat{display:flex;flex-direction:column;gap:4px;min-width:104px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:#2c3036;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .2s,background .2s}
.spd{font-family:var(--f-mono);font-size:21px;line-height:1;font-variant-numeric:tabular-nums}
.spd small{font-size:11px;color:var(--muted);margin-left:3px}
.mid{justify-self:center;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0;max-width:100%}
.mid .mname{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .prog{font-family:var(--f-display);font-size:22px;line-height:1.05;color:var(--hazard);white-space:nowrap}
.mid .timer{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.mid .timer.low{color:var(--hot)}
.btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:150px;pointer-events:auto}
.hb{font-size:13px;font-weight:800;background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}

.ctl{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.grp{display:flex;gap:12px;pointer-events:auto}
.pad{width:76px;height:76px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:var(--glass);
  font-family:var(--f-display);font-size:26px;touch-action:none;cursor:pointer;display:grid;place-items:center}
.pad.gas{width:92px;height:92px;background:rgba(63,209,127,.3);border-color:var(--ok);font-size:22px}
.pad.back{background:rgba(255,75,62,.25);border-color:var(--hot);font-size:17px}
.pad.on{transform:scale(.93);filter:brightness(1.5)}

.pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(40px,12vw,92px);
  color:var(--hazard);-webkit-text-stroke:3px var(--ink);paint-order:stroke;pointer-events:none;opacity:0;white-space:nowrap}
.pop.show{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}15%{transform:translate(-50%,-50%) scale(1.15) rotate(-4deg)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1) rotate(-4deg)}}
.toast{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--hot);color:#fff;font-weight:800;border-radius:999px;padding:8px 16px;font-size:14px;pointer-events:none;white-space:nowrap}
.toast.good{background:var(--ok);color:#0b2716}

.screen{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,12,15,.5);overflow:auto;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
.card{width:100%;max-width:520px;background:var(--card);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.tape{height:10px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 12px,#111 12px 24px)}
h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(32px,9vw,44px);line-height:1;text-wrap:balance}
h1 span{color:var(--hazard)}
h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.sect{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.chip{font-weight:800;font-size:15px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.cars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:420px){.cars{grid-template-columns:repeat(2,1fr)}}
.car{font-weight:800;font-size:14px;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.car small{font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:600}
.car[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.car[aria-pressed="true"] small{color:#555}
.missions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.missions{grid-template-columns:1fr}}
.mcard{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.mcard:hover{border-color:var(--hazard)}
.mcard b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.1}
.mcard span{font-size:13px;color:var(--muted);line-height:1.4}
.mcard .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--fg)}
.stars{color:var(--hazard);letter-spacing:2px;font-size:15px;white-space:nowrap}
.stars i{color:#4a4f57;font-style:normal}
.mcard.free{border-style:dashed}
.go{font-family:var(--f-display);font-size:24px;color:#111;background:var(--hazard);border:0;border-radius:12px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 #a37f00}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #a37f00}
.go:disabled{opacity:.5}
.alt{font-weight:800;font-size:14px;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.field{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:800;color:var(--fg);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.err{color:var(--hot);font-size:13px;min-height:1.2em;margin:0}
.big{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--hazard);font-variant-numeric:tabular-nums}
.bigstars{font-size:40px;letter-spacing:6px;color:var(--hazard);line-height:1}
.bigstars i{color:#3d424a;font-style:normal}
.lines{display:flex;flex-direction:column;gap:4px;font-size:14px}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.board{display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow:auto}
.brow{display:grid;grid-template-columns:34px 1fr auto auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;font-size:14px}
.brow:nth-child(odd){background:rgba(255,255,255,.04)}
.brow.me{background:rgba(255,204,31,.16)}
.brow .rk{font-family:var(--f-display);font-size:18px;text-align:center}
.brow .nm{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .nm small{color:var(--muted);font-weight:600;margin-left:4px}
.brow .sc{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.src{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs .chip{flex:none;font-size:13px;padding:7px 12px}
@media (prefers-reduced-motion:reduce){.pop.show{animation:none;opacity:1}.bar i{transition:none}}
</style>

<canvas id="c" aria-label="3D 충돌 게임 화면"></canvas>

<div class="hud" id="hud">
  <div class="panel stat">
    <span class="lbl">차 상태</span>
    <div class="bar"><i id="hp"></i></div>
    <div class="spd" id="spd">0<small>km/h</small></div>
  </div>
  <div class="panel mid" id="mid">
    <span class="mname" id="mName">자유 주행</span>
    <span class="prog" id="mProg">0점</span>
    <span class="timer" id="mTimer" hidden>0:00</span>
  </div>
  <div class="btns">
    <button class="hb" id="bCam">카메라</button>
    <button class="hb" id="bSound">소리 켬</button>
    <button class="hb" id="bRetry">다시</button>
    <button class="hb" id="bMenu">메뉴</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="pop" id="pop"></div>

<div class="ctl" id="ctl">
  <div class="grp">
    <button class="pad" data-k="left" aria-label="왼쪽">◀</button>
    <button class="pad" data-k="right" aria-label="오른쪽">▶</button>
  </div>
  <div class="grp">
    <button class="pad back" data-k="back">후진</button>
    <button class="pad gas" data-k="gas">가속</button>
  </div>
</div>

<!-- who are you -->
<div class="screen" id="sWho">
  <div class="card">
    <div class="tape" aria-hidden="true"></div>
    <h1>꽝! <span>크래시</span> 드라이브</h1>
    <p>미션을 깨고 별을 모아요. 내 아이디를 고르거나 새로 만드세요.</p>
    <div class="sect">내 아이디</div>
    <div class="row" id="whoList"></div>
    <div class="row">
      <input class="field" id="newName" maxlength="10" placeholder="새 아이디 (예: 번개민준)" autocomplete="off">
      <button class="go" id="bMake" style="font-size:18px;padding:10px 14px">만들기</button>
    </div>
    <p class="err" id="whoErr"></p>
  </div>
</div>

<!-- mission select -->
<div class="screen" id="sMenu" hidden>
  <div class="card">
    <div class="row between">
      <h2 id="hello">안녕!</h2>
      <button class="alt" id="bWho">아이디 바꾸기</button>
    </div>
    <div class="row between"><span class="sect">모은 별</span><span class="stars" id="totStars"></span></div>
    <div class="sect">차 고르기</div>
    <div class="cars" id="carList"></div>
    <div class="sect">미션</div>
    <div class="missions" id="mList"></div>
    <div class="row between">
      <button class="alt" id="bRank">🏆 랭킹 보기</button>
      <label class="row" style="gap:6px;font-weight:800;font-size:13px"><input type="checkbox" id="optSlow" checked style="width:18px;height:18px;accent-color:var(--hazard)">큰 충돌 슬로모션</label>
    </div>
  </div>
</div>

<!-- result -->
<div class="screen" id="sResult" hidden>
  <div class="card">
    <div class="tape" aria-hidden="true"></div>
    <h2 id="rTitle">미션 성공!</h2>
    <div class="row between" style="align-items:flex-end">
      <div class="big" id="rScore">0</div>
      <div class="bigstars" id="rStars"></div>
    </div>
    <div class="lines" id="rLines"></div>
    <p class="src" id="rSaved"></p>
    <div class="sect" id="rBoardTitle">이 미션 랭킹</div>
    <div class="board" id="rBoard"></div>
    <div class="row">
      <button class="go" id="bAgain">다시 하기</button>
      <button class="alt" id="bNext">다음 미션</button>
      <button class="alt" id="bList">미션 목록</button>
    </div>
  </div>
</div>

<!-- ranking -->
<div class="screen" id="sRank" hidden>
  <div class="card">
    <div class="row between"><h2>🏆 랭킹</h2><button class="alt" id="bRankClose">닫기</button></div>
    <div class="tabs" id="rankTabs"></div>
    <div class="board" id="rankBoard"></div>
    <p class="src" id="rankSrc"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
if(!window.THREE){document.querySelector('#sWho p').textContent='3D 엔진을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';return;}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));

// ================= renderer / scene =================
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const SKY=0xa9cfe9;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,80,220);
const camera=new THREE.PerspectiveCamera(60,1,.1,450);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?74:58;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xffffff,0x5a6470,.78));
const sun=new THREE.DirectionalLight(0xfff4e0,.85);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-38,right:38,top:38,bottom:-38,near:1,far:160});sun.shadow.bias=-.0006;
scene.add(sun,sun.target);

// ================= textures =================
function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
function speckle(g,w,h,n,a){for(let i=0;i<n;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*a})`;g.fillRect(Math.random()*w,Math.random()*h,2,2);}}
const groundTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#b8bbb6';g.fillRect(0,0,w,h);speckle(g,w,h,1800,.07);g.strokeStyle='rgba(70,70,70,.35)';g.lineWidth=3;g.strokeRect(0,0,w,h);},[50,50]);
function roadTex(rep){return ctex(128,256,(g,w,h)=>{g.fillStyle='#3a3e44';g.fillRect(0,0,w,h);speckle(g,w,h,900,.25);g.fillStyle='#f2c12e';g.fillRect(w/2-3,30,6,110);g.fillStyle='#e9e9e4';g.fillRect(5,0,5,h);g.fillRect(w-10,0,5,h);},[1,rep]);}
const asphaltTex=ctex(128,128,(g,w,h)=>{g.fillStyle='#45494f';g.fillRect(0,0,w,h);speckle(g,w,h,1400,.25);},[12,12]);
const laneTex=ctex(128,128,(g,w,h)=>{g.fillStyle='#d9b27a';g.fillRect(0,0,w,h);g.fillStyle='rgba(120,70,20,.25)';for(let x=0;x<w;x+=16)g.fillRect(x,0,2,h);},[4,30]);
const hazardTex=ctex(256,64,(g,w,h)=>{g.fillStyle='#ffcc1f';g.fillRect(0,0,w,h);g.fillStyle='#151515';for(let x=-h;x<w+h;x+=64){g.beginPath();g.moveTo(x,h);g.lineTo(x+32,h);g.lineTo(x+32+h,0);g.lineTo(x+h,0);g.fill();}},[4,1]);
const targetTex=ctex(128,128,(g)=>{g.fillStyle='#111';g.beginPath();g.arc(64,64,60,0,7);g.fill();g.fillStyle='#ffcc1f';[0,Math.PI].forEach(s=>{g.beginPath();g.moveTo(64,64);g.arc(64,64,60,s,s+Math.PI/2);g.fill();});});
const crackTex=ctex(128,128,(g,w,h)=>{g.fillStyle='#2b3744';g.fillRect(0,0,w,h);g.strokeStyle='rgba(235,245,255,.9)';g.lineWidth=1.4;
  for(let k=0;k<3;k++){const cx=20+Math.random()*88,cy=20+Math.random()*88;for(let i=0;i<10;i++){let x=cx,y=cy,a=i*.63+Math.random()*.3;g.beginPath();g.moveTo(x,y);for(let s=0;s<5;s++){a+=(Math.random()-.5)*.6;x+=Math.cos(a)*12;y+=Math.sin(a)*12;g.lineTo(x,y);}g.stroke();}g.beginPath();g.arc(cx,cy,8,0,7);g.stroke();}});
const smokeTex=ctex(64,64,(g)=>{const r=g.createRadialGradient(32,32,2,32,32,30);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);});
function textSprite(text,color,h){const t=ctex(256,96,(g,w,hh)=>{g.font='64px "Black Han Sans", sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineWidth=10;g.strokeStyle='#111';g.strokeText(text,w/2,hh/2+4);g.fillStyle=color;g.fillText(text,w/2,hh/2+4);});
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthWrite:false}));s.scale.set(h*256/96,h,1);return s;}

// ================= permanent world =================
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({map:groundTex}));ground.receiveShadow=true;scene.add(ground);
for(let i=0;i<18;i++){const a=i/18*Math.PI*2,r=170+Math.random()*30,h=8+Math.random()*30;
  const m=new THREE.Mesh(new THREE.BoxGeometry(14+Math.random()*16,h,14+Math.random()*16),new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(.58+Math.random()*.06,.15,.55+Math.random()*.15)}));
  m.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);scene.add(m);}

// ================= map building =================
let mapGroup=new THREE.Group();scene.add(mapGroup);
let statics=[],ramps=[];
const concrete=new THREE.MeshLambertMaterial({color:0x9ea3a8});
const hazardMat=new THREE.MeshLambertMaterial({map:hazardTex});
function clearMap(){scene.remove(mapGroup);mapGroup.traverse(o=>{if(o.geometry&&o.geometry!==coinGeo)o.geometry.dispose();});mapGroup=new THREE.Group();scene.add(mapGroup);statics=[];ramps=[];boosts=[];oils=[];movers=[];pickups=[];}
function addStatic(cx,cz,w,d,h,a,mat,noCollide){

function obbHit(px,pz,r,o){

let PATH=[];
function pathAI(b,dt){
  const c=b.car,P=c.pts||PATH;if(c.health<=0||!P.length){c.input.t=0;return;}
  let p=P[c.path%P.length];if(Math.hypot(p[0]-b.x,p[1]-b.z)<(c.pts?4:7)){c.path++;p=P[c.path%P.length];}
  const d=wrapA(Math.atan2(p[0]-b.x,p[1]-b.z)-b.a);
  if(c.rev>0){c.rev-=dt;c.input.t=-1;c.input.s=c.revS;return;}
  c.input.s=clamp(-d*2.5,-1,1);
  c.input.t=b.stun>0?0:(c.vF<(c.cruise||(Math.abs(d)>.5?7:13))?1:0);
  if(Math.abs(c.vF)<1&&c.input.t>0){c.stuck+=dt;if(c.stuck>2){c.rev=1.2;c.revS=-c.input.s;c.stuck=0;}}else c.stuck=0;
}
function derbyAI(b,dt){
  const c=b.car;if(c.health<=0||!player||!active()){c.input.t=0;c.input.s=0;return;}
  if(c.rev>0){c.rev-=dt;c.input.t=-1;c.input.s=c.revS;return;}
  const tx=player.x+player.vx*.45,tz=player.z+player.vz*.45;
  const d=wrapA(Math.atan2(tx-b.x,tz-b.z)-b.a);
  c.input.s=clamp(-d*2.4,-1,1);c.input.t=b.stun>0?0:1;
  if(Math.abs(c.vF)<1.2){c.stuck+=dt;if(c.stuck>1.4){c.rev=1;c.revS=-c.input.s;c.stuck=0;}}else c.stuck=0;
}
function step(dt){
  readInput();features(dt);
  for(const b of bodies){
    if(b.kind==='car'){const r=b.car.role;if(r==='ai')pathAI(b,dt);else if(r==='derby')derbyAI(b,dt);driveCar(b,dt);}else propMove(b,dt);
    b.x+=b.vx*dt;b.z+=b.vz*dt;b.a+=b.w*dt;if(b.stun>0)b.stun-=dt;

}

  online=r.ok&&(r.headers.get('content-type')||'').includes('json');}catch(e){online=false;}})();
function localBoard(mid){return (LS.get('cd-board',{})[mid]||[]).slice().sort((a,b)=>b.score-a.score);}
function saveLocalBoard(rec){const all=LS.get('cd-board',{}),list=all[rec.mission]||[];const i=list.findIndex(r=>r.name===rec.name);
  if(i>=0){if(list[i].score>=rec.score)return;list[i]=rec;}else list.push(rec);all[rec.mission]=list;LS.set('cd-board',all);}
async function getBoard(mid){
  if(online){try{const r=await fetch(API+'?mission='+mid);if(r.ok){const j=await r.json();return {list:j.scores||[],src:'모두의 기록'};}}catch(e){}}
  return {list:localBoard(mid),src:'이 기기에 저장된 기록'};
}
async function submitScore(rec){
  saveLocalBoard(rec);
  if(!online)return false;
  try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(rec)});return r.ok;}catch(e){return false;}
}

$('optSlow').checked=LS.get('cd-slow',true);optSlow=$('optSlow').checked;
$('optSlow').onchange=e=>{optSlow=e.target.checked;LS.set('cd-slow',optSlow);};
$('bRank').onclick=()=>openRank(MISSIONS[0].id);
$('bRankClose').onclick=()=>openMenu();
async function openRank(mid){
  show('sRank');const tabs=$('rankTabs');tabs.innerHTML='';
  MISSIONS.forEach(m=>{const b=document.createElement('button');b.className='chip';b.textContent=m.name;b.setAttribute('aria-pressed',m.id===mid);b.onclick=()=>openRank(m.id);tabs.appendChild(b);});
  $('rankBoard').innerHTML='<p class="src">불러오는 중…</p>';
  const {list,src}=await getBoard(mid);renderBoard($('rankBoard'),list,20);
  $('rankSrc').textContent=src+(online?'':' · 다른 기기 기록은 함께 보이지 않아요.');
}
function renderBoard(el,list,n){
  if(!list.length){el.innerHTML='<p class="src">아직 기록이 없어요. 첫 번째 주인공이 되어 보세요!</p>';return;}
  el.innerHTML=list.slice(0,n).map((r,i)=>`<div class="brow${r.name===me?' me':''}"><span class="rk">${i<3?['🥇','🥈','🥉'][i]:i+1}</span>
    <span class="nm">${esc(r.name)}<small>${esc(r.car||'')}</small></span><span class="stars">${starStr(r.stars||0)}</span><span class="sc">${r.score}</span></div>`).join('');
}

// ================= game flow =================
function spawnPlayer(st){
  if(player)removeBody(player);
  player=makeCarBody(selKey,PLAYER_COLOR,st.x,st.z,st.a,'player');$('toast').hidden=true;
}
let curMission=null;
function startMission(m){
  initAudio();curMission=m;M=m;clearBodies();clearMap();guide=null;ring.visible=false;
  ms={ready:1.6,over:false};
  (m||FREE).build();
  spawnPlayer((m||FREE).start);
  timeLeft=m?m.time:0;freeScore=0;mode='play';show(null);
  camPos.set(player.x-Math.sin(player.a)*14,8,player.z-Math.cos(player.a)*14);
  $('mName').textContent=m?m.name:'자유 주행';$('mTimer').hidden=!m;$('bRetry').textContent=m?'다시':'새 차';
  popText('준비…');
}
function retry(){if(!curMission){spawnPlayer(FREE.start);return;}startMission(curMission);}
$('bRetry').onclick=retry;
$('bMenu').onclick=()=>{mode='menu';openMenu();};
function nextTry(landed){ms.tries++;if(ms.tries>=3){finish(ms.best>0);return;}
  spawnPlayer(M.start);ms.state='run';ms.wait=0;ms.ready=.8;popText((ms.tries+1)+'번째!');}
function onPlayerWrecked(){
  if(!M){$('toast').textContent="폐차! '새 차'를 누르세요";$('toast').className='toast';$('toast').hidden=false;return;}
  if(M.id==='derby'){ms.over=true;setTimeout(()=>finish(false),1500);}
  else{$('toast').textContent="폐차! '다시'를 눌러 새로 도전해요";$('toast').className='toast';$('toast').hidden=false;}
}
let finishing=false;
async function finish(ok){
  if(mode!=='play'||!M||finishing)return;finishing=true;ms.over=true;
  const res=M.result(ok);mode='result';guide=null;
  $('rTitle').textContent=res.stars>0?(res.stars===3?'완벽해요!':'미션 성공!'):'아쉬워요! 다시 해볼까요?';
  $('rScore').textContent=res.score;$('rStars').innerHTML=starStr(res.stars);
  $('rLines').innerHTML=res.lines.map(l=>`<div><span>${l[0]}</span><b>${esc(l[1])}</b></div>`).join('')+`<div><span>탄 차</span><b>${SPECS[selKey].name}</b></div>`;
  const mb=bests[me]=bests[me]||{},prev=mb[M.id];
  const isBest=!prev||res.score>prev.score;
  if(isBest)mb[M.id]={score:res.score,stars:Math.max(res.stars,prev?prev.stars:0)};else if(res.stars>prev.stars)prev.stars=res.stars;
  LS.set('cd-bests',bests);
  const idx=MISSIONS.indexOf(M);$('bNext').hidden=idx>=MISSIONS.length-1;
  show('sResult');finishing=false;
  $('rSaved').textContent=isBest&&prev?'🎉 내 최고 기록 갱신!':'';
  $('rBoardTitle').textContent=M.name+' 랭킹';$('rBoard').innerHTML='<p class="src">기록 저장 중…</p>';
  let sent=false;
  if(res.score>0)sent=await submitScore({mission:M.id,name:me,score:res.score,stars:res.stars,car:SPECS[selKey].name,date:new Date().toISOString().slice(0,10)});
  const {list,src}=await getBoard(M.id);renderBoard($('rBoard'),list,5);
  $('rSaved').textContent=(isBest&&prev?'🎉 내 최고 기록 갱신! · ':'')+(res.score>0?(sent?'모두의 랭킹에 저장했어요':'이 기기에 저장했어요'):'점수가 0점이라 저장하지 않았어요');
}
$('bAgain').onclick=()=>startMission(M);
$('bNext').onclick=()=>{const i=MISSIONS.indexOf(M);startMission(MISSIONS[i+1]);};
$('bList').onclick=()=>openMenu();

// ================= UI misc =================
let camMode=0;
$('bCam').onclick=cycleCam;
function cycleCam(){camMode=(camMode+1)%3;$('bCam').textContent=['카메라','멀리서','운전석'][camMode];}
$('bSound').textContent=soundOn?'소리 켬':'소리 끔';
$('bSound').onclick=()=>{soundOn=!soundOn;LS.set('cd-sound',soundOn);$('bSound').textContent=soundOn?'소리 켬':'소리 끔';if(soundOn){unlockAudio();setTimeout(()=>crashSound(12),60);}else if(eng)eng.g.gain.value=0;};
const pop=$('pop');
function popText(t){pop.textContent=t;pop.classList.remove('show');void pop.offsetWidth;pop.classList.add('show');}

// ================= visuals / camera / hud =================
function updateVisuals(dt){
  for(const b of bodies){
    if(b.kind==='car'){
      const c=b.car,v=c.v,s=c.spec;
      if(b.grounded){const sa=Math.sin(b.a),ca=Math.cos(b.a);const gf=groundAt(b.x+sa*s.L*.4,b.z+ca*s.L*.4),gb=groundAt(b.x-sa*s.L*.4,b.z-ca*s.L*.4);b.pitch+=(Math.atan2(gf-gb,s.L*.8)-b.pitch)*Math.min(1,dt*12);}
      else b.pitch+=(-.32-b.pitch)*Math.min(1,dt*.9);
      let rl=0,pl=0;for(const w of v.wheels)if(w.lost){rl+=w.side*.07;pl+=(w.z>0?-.04:.04);}
      b.roll+=(rl-b.roll)*Math.min(1,dt*6);
      v.group.position.set(b.x,b.y-(c.wheelsLost?.12:0),b.z);v.group.rotation.set(-b.pitch+pl,b.a,b.roll);
      for(const w of v.wheels){if(w.lost)continue;w.spin.rotation.x+=c.vF*dt/s.wr;if(w.front)w.piv.rotation.y=-c.input.s*.45;}
      if(100-c.health>45){c.smokeT-=dt;if(c.smokeT<=0){c.smokeT=c.health<=0?.08:.18;tmpV.set(0,v.H*.75,s.L*.33);v.group.localToWorld(tmpV);
        smoke(tmpV.x,tmpV.y,tmpV.z,c.health<=0?1.1:.7,c.health<=0?2.4:1.6,c.health<=0?0x3a3a3a:0x9a9a9a);}}
    }else{
      if(!b.grounded)b.tilt+=b.spin*dt;else b.tilt+=(b.tiltT-b.tilt)*Math.min(1,dt*6);
      const lying=Math.min(1,Math.abs(Math.sin(b.tilt))),r=PROPS[b.type].r,hh=b.h/2;
      b.group.position.set(b.x,b.y+hh+(r*.95-hh)*(b.type==='box'?0:lying),b.z);
      b.group.rotation.set(b.tilt,b.a,0,'YXZ');
    }
  }
  if(guide&&player&&mode==='play'){arrow.visible=true;arrow.position.set(player.x,player.y+player.h+1.4,player.z);arrow.rotation.y=Math.atan2(guide.x-player.x,guide.z-player.z);
    ring.visible=true;ring.position.set(guide.x,.05,guide.z);const s=1+.15*Math.sin(performance.now()/200);ring.scale.set(s,1,s);}
  else{arrow.visible=false;ring.visible=false;}
}
const camPos=new THREE.Vector3(30,25,-70),camLook=new THREE.Vector3();
let orbit=0;
function updateCamera(dt){
  if(mode==='menu'||!player){orbit+=dt*.08;camPos.lerp(tmpV.set(Math.sin(orbit)*48,24,Math.cos(orbit)*48-6),Math.min(1,dt*1.5));camLook.lerp(tmpV.set(0,0,0),Math.min(1,dt*2));}
  else{
    const b=player,s=b.car.spec,sa=Math.sin(b.a),ca=Math.cos(b.a);
    if(camMode===2){tmpV.set(0,b.car.v.H+.15,s.truck?s.L*.32:s.L*.05);b.car.v.group.localToWorld(tmpV);camPos.copy(tmpV);
      tmpV.set(0,b.car.v.H*.8,s.L+8);b.car.v.group.localToWorld(tmpV);camLook.copy(tmpV);}
    else{const back=camMode===0?6.5+s.L*.5:17,up=camMode===0?2.6+s.L*.12:12;
      camPos.lerp(tmpV.set(b.x-sa*back,Math.max(b.y,0)+up,b.z-ca*back),Math.min(1,dt*(camMode===0?5:3)));
      camLook.lerp(tmpV.set(b.x+sa*4,b.y+1,b.z+ca*4),Math.min(1,dt*8));}
  }
  const bf=player&&player.car.boost>0&&mode==='play'?10:0,base=innerWidth<innerHeight?74:58;camera.fov+=(base+bf-camera.fov)*Math.min(1,dt*4);camera.updateProjectionMatrix();
  camera.position.copy(camPos);
  if(shake>.01){camera.position.x+=(Math.random()-.5)*shake*.7;camera.position.y+=(Math.random()-.5)*shake*.5;}
  camera.lookAt(camLook);
  const f=player&&mode!=='menu'?player:{x:0,z:0};
  sun.position.set(f.x+25,45,f.z+15);sun.target.position.set(f.x,0,f.z);
}
function fmt(t){t=Math.max(0,Math.ceil(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function updateHud(){
  if(!player)return;const c=player.car;
  const hp=$('hp');hp.style.width=c.health+'%';hp.style.background=c.health>60?'var(--ok)':c.health>25?'var(--hazard)':'var(--hot)';
  $('spd').firstChild.nodeValue=Math.round(Math.abs(c.vF)*3.6);$('spd').style.color=c.boost>0?'#38c4ff':'';
  $('mProg').textContent=M?M.prog():freeScore+'점';
  if(M){const tm=$('mTimer');tm.textContent=fmt(timeLeft);tm.classList.toggle('low',timeLeft<10);}
  if(eng&&AC&&soundOn){const t=c.health>0?Math.max(0,c.input.t):0;eng.o.frequency.setTargetAtTime(45+Math.abs(c.vF)*4.2+t*18,AC.currentTime,.05);
    if(AC.state==='suspended'&&mode==='play')AC.resume().catch(()=>{});eng.g.gain.setTargetAtTime(mode!=='play'||c.health<=0?0:.06+.04*t,AC.currentTime,.1);}
}
function gameTick(dt){
  if(mode!=='play')return;
  if(ms.ready>0){ms.ready-=dt;if(ms.ready<=0)popText('출발!');return;}
  if(ms.over||!M)return;
  timeLeft-=dt;
  M.tick(dt);
  if(timeLeft<=0&&!ms.over){timeLeft=0;popText('시간 끝!');ms.over=true;setTimeout(()=>finish(false),900);}
}

// ================= loop =================
let last=performance.now();
function frame(now){
  const rdt=Math.min(.05,(now-last)/1000);last=now;
  if(slowT>0)slowT-=rdt;ts+=((slowT>0?.25:1)-ts)*Math.min(1,rdt*10);
  const dt=rdt*ts,n=Math.max(1,Math.ceil(dt/(1/120)));
  for(let i=0;i<n;i++)step(dt/n);
  gameTick(dt);
  updateVisuals(dt);updateFx(dt);animFeatures(dt);updateCamera(rdt);updateHud();
  shake*=Math.pow(.05,rdt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
// attract scene behind the menus
FREE.build();
renderWho();
if(me&&profiles.some(p=>p.name===me))openMenu();else show('sWho');
requestAnimationFrame(frame);
})();
</script>
