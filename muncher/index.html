<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NNN 글러브 먹보</title>
<meta name="theme-color" content="#0d0b1e">
<link rel="icon" href="../shared/img/samsaek.png">
</head>
<body>
<script src="../shared/retro.js"></script>
<script>
/* 글러브 먹보: 미로의 점을 다 먹으면 클리어. 도깨비 넷이 쫓아와요. 물병을 먹으면 반대로 도깨비를 잡을 수 있어요 */
const MAP=[
"#####################",
"#o.......###.......o#",
"#.##.###.###.###.##.#",
"#...................#",
"#.##.#.#######.#.##.#",
"#....#...###...#....#",
"####.###.###.###.####",
"xxx#.#.........#.#xxx",
"####.#.###-###.#.####",
"    ...#     #...    ",
"####.#.#######.#.####",
"xxx#.#.........#.#xxx",
"####.#.#######.#.####",
"#.........#.........#",
"#.##.####.#.####.##.#",
"#o.#......P......#.o#",
"##.#.#.#######.#.#.##",
"#....#.........#....#",
"#.######.###.######.#",
"#...................#",
"#####################"];
const MAPS=[MAP,
["#####################",
"#o....##.....##....o#",
"#.###.##.###.##.###.#",
"#.#.......#.......#.#",
"#.#.##.##.#.##.##.#.#",
"#....#....#....#....#",
"####.###.###.###.####",
"xxx#.#.........#.#xxx",
"####.#.###-###.#.####",
"    ...#     #...    ",
"####.#.#######.#.####",
"xxx#.#.........#.#xxx",
"####.#.#######.#.####",
"#.........#.........#",
"#.##.#.##.#.##.#.##.#",
"#o.#.#..#.P.#..#.#.o#",
"##.#.##.#.#.#.##.#.##",
"#....#....#....#....#",
"#.##.#.##.#.##.#.##.#",
"#.........#.........#",
"#####################"],
["#####################",
"#o..##.........##..o#",
"#.#.##.#######.##.#.#",
"#.#.......#.......#.#",
"#.###.###.#.###.###.#",
"#.........#.........#",
"####.###.###.###.####",
"xxx#.#.........#.#xxx",
"####.#.###-###.#.####",
"    ...#     #...    ",
"####.#.#######.#.####",
"xxx#.#.........#.#xxx",
"####.#.#######.#.####",
"#........###........#",
"#.#.#.##.###.##.#.#.#",
"#o#.......P.......#o#",
"#.#.##.#.###.#.##.#.#",
"#......#.....#......#",
"#.####.#.#.#.#.####.#",
"#...................#",
"#####################"]];
const mazeOf=l=>Math.floor((l-1)/2)%3;const WCOL=['#4f7dff','#ff5fa2','#4fe3b2'],WFILL=['#141a5c','#4a1037','#0e3a30'];
const T=8,MW=21,MH=21,OY=12,W=168,H=OY+MH*T+12;
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]},OPP={up:'down',down:'up',left:'right',right:'left'};
const GCOL=['#ff3b3b','#c46bff','#3fd0ff','#ff9b3d'],GNAME=['빨강이','보라','파랑이','주황이'];
const SCAT=[[20,-3],[0,-3],[20,23],[0,23]];
let grid,dots,totalDots,eaten,player,ghosts,level,lives,mode,modeT,modeIdx,fright,ghostChain,deadT,clearT,fruit,fruitPop,readyT,pops;
const PHASES=[7,20,7,20,5,20,5,1e9];
const wall=(x,y)=>{if(y<0||y>=MH)return true;x=(x+MW)%MW;const c=grid[y][x];return c==='#'||c==='x'||c==='-'};
function canGo(e,d,ghost){const [dx,dy]=DIRS[d];const nx=e.bx+dx,ny=e.by+dy;if(ghost&&(e.st==='eyes'||e.st==='leave')&&grid[ny]&&grid[ny][(nx+MW)%MW]==='-')return true;return !wall(nx,ny)}
function mk(x,y,dir){return{ax:x,ay:y,bx:x,by:y,p:1,dir}}
function pos(e){let ax=e.ax,bx=e.bx;if(Math.abs(bx-ax)>1){if(bx<ax)bx+=MW;else ax+=MW}return{x:ax+(bx-ax)*e.p,y:e.ay+(e.by-e.ay)*e.p}}
function step(e,d){const [dx,dy]=DIRS[d];e.ax=e.bx;e.ay=e.by;e.bx=(e.bx+dx+MW)%MW;e.by+=dy;e.p=0;e.dir=d}
function resetActors(){player=mk(10,15,'left');player.want='left';player.moving=false;
  ghosts=[0,1,2,3].map(i=>{const g=mk([10,10,9,11][i],[7,9,9,9][i],i===0?'left':'up');g.i=i;g.st=i===0?'out':'house';g.rel=[0,1.5,5,9][i];return g});
  fright=0;readyT=1.8;modeT=0;modeIdx=0;mode='scatter'}
function newLevel(){grid=MAPS[mazeOf(level)].map(r=>r.split(''));dots=0;for(const r of grid)for(const c of r)if(c==='.'||c==='o')dots++;totalDots=dots;eaten=0;fruit=null;resetActors()}
let GD=1;function spd(base){return base*(1+Math.min(level-1,8)*.06)}
Retro.boot({id:'muncher',title:'NNN 글러브 먹보',en:'GLOVE MUNCHER',w:W,h:H,a:false,b:false,diag:false,
  stages:{label:'레벨',max:99},
  intro:'빨간 복싱 글러브가 미로의 점을 모두 먹으면 클리어! 도깨비 넷을 조심하고, 물병을 먹으면 반대로 도깨비를 잡을 수 있어요.',
  help:'<b>십자키</b> 또는 <b>화면 밀기</b>로 방향 바꾸기<br>(갈림길 전에 미리 눌러 두면 알아서 꺾어요)<br>💧 물병 = 도깨비가 파래지면 잡을 수 있어요<br>연속으로 잡으면 200·400·800·1600점!<br>양옆 터널로 반대편에 나와요 · 2레벨마다 미로가 바뀌고 도깨비가 빨라져요',
  init(G){GD=G.diff;level=G.start;lives=G.lives(3);deadT=0;clearT=0;pops=[];newLevel()},
  update(G,dt){
    for(const p of pops)p.t-=dt;pops=pops.filter(p=>p.t>0);
    if(readyT>0){readyT-=dt;return}
    if(clearT>0){clearT-=dt;if(clearT<=0){level++;G.reach(level);newLevel();G.msg(`레벨 ${level}`+(level%2?' · 새 미로!':''))}return}
    if(deadT>0){deadT-=dt;if(deadT<=0){if(lives<=0)return G.over(`레벨 ${level}`);resetActors()}return}
    const h=G.hit;for(const k in DIRS)if(h[k]||h.swipe===k)player.want=k;for(const k in DIRS)if(G.keys[k])player.want=k;
    if(fright>0){fright-=dt;if(fright<=0)ghostChain=0}else{modeT+=dt;if(modeT>PHASES[modeIdx]){modeT=0;modeIdx++;mode=modeIdx%2?'chase':'scatter';for(const g of ghosts)if(g.st==='out')g.rev=1}}
    /* 플레이어 */
    if(player.want===OPP[player.dir]&&player.p<1&&player.moving){[player.ax,player.bx]=[player.bx,player.ax];[player.ay,player.by]=[player.by,player.ay];player.p=1-player.p;player.dir=player.want}
    let move=spd(7.6)*dt*(fright>0?1.08:1);
    while(move>0){if(player.p>=1){player.p=1;eat(G);
        if(canGo(player,player.want))step(player,player.want);else if(canGo(player,player.dir))step(player,player.dir);else{player.moving=false;break}player.moving=true}
      const need=1-player.p;const m=Math.min(need,move);player.p+=m;move-=m;if(move<=1e-9)break}
    if(player.p>=1)eat(G);
    /* 도깨비 */
    const pp=pos(player);
    for(const g of ghosts){
      if(g.st==='house'){g.rel-=dt;g.bob=(g.bob||0)+dt;if(g.rel<=0&&(eaten>=[0,0,20,45][g.i]||g.rel<-6)){g.st='leave';g.ax=g.bx;g.ay=g.by;g.path=[[10,9],[10,8],[10,7]]}continue}
      if(g.st==='leave'){let mv=4*dt;while(mv>0&&g.path.length){if(g.p>=1){const [tx,ty]=g.path[0];if(g.bx===tx&&g.by===ty){g.path.shift();continue}g.ax=g.bx;g.ay=g.by;g.bx+=Math.sign(tx-g.bx);g.by+=Math.sign(ty-g.by);g.p=0}const m=Math.min(1-g.p,mv);g.p+=m;mv-=m}
        if(!g.path.length&&g.p>=1){g.st='out';g.dir='left';g.ghostFr=false}continue}
      const tunnel=g.by===9&&(g.bx<4||g.bx>16);
      let sp=g.st==='eyes'?14:tunnel?3.6:(fright>0&&g.fr)?4.2:spd(7.1)*GD+(g.i===0&&dots<30?0.6:0);
      let mv=sp*dt;
      while(mv>0){if(g.p>=1){g.p=1;
          if(g.st==='eyes'&&g.bx===10&&g.by===7){g.st='leave';g.fr=false;g.path=[[10,8],[10,9],[10,8],[10,7]];break}
          let opts=Object.keys(DIRS).filter(d=>d!==OPP[g.dir]&&canGo(g,d,true));
          if(g.rev){g.rev=0;opts=[OPP[g.dir]]}
          if(!opts.length)opts=[OPP[g.dir]];
          let d;
          if(fright>0&&g.fr&&g.st!=='eyes')d=opts[Math.floor(Math.random()*opts.length)];
          else{const t=target(g,pp);d=opts.sort((a,b)=>dist(g,a,t)-dist(g,b,t))[0]}
          step(g,d)}
        const m=Math.min(1-g.p,mv);g.p+=m;mv-=m}
      const gp=pos(g);if(Math.abs(gp.x-pp.x)<.6&&Math.abs(gp.y-pp.y)<.6){
        if(g.fr&&fright>0){g.st='eyes';g.fr=false;ghostChain=(ghostChain||0)+1;const pts=200*Math.pow(2,ghostChain-1);G.add(pts);pops.push({x:gp.x,y:gp.y,s:pts,t:1});G.sfx('power')}
        else if(g.st==='out'){deadT=2;lives--;G.sfx('die');navigator.vibrate&&navigator.vibrate(200);return}}
    }
    if(fruit){fruit.t-=dt;if(fruit.t<=0)fruit=null;else if(Math.abs(pp.x-10)<.6&&Math.abs(pp.y-11)<.6){const pts=[100,300,500,700,1000,2000][Math.min(level-1,5)];G.add(pts);pops.push({x:10,y:11,s:pts,t:1.2});G.sfx('coin');fruit=null}}
  },
  draw(G,c){c.fillStyle='#04030c';c.fillRect(0,0,W,H);if(!grid)return;
    const flash=clearT>0&&Math.floor(clearT*6)%2;
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const ch=grid[y][x],px=x*T,py=OY+y*T;
      if(ch==='#'){const mz=mazeOf(level);c.fillStyle=flash?'#fff':WFILL[mz];c.fillRect(px,py,T,T);c.fillStyle=flash?'#bbb':WCOL[mz];
        const open=(a,b)=>{const q=grid[b]&&grid[b][a];return q&&q!=='#'&&q!=='x'};
        if(open(x,y-1))c.fillRect(px,py,T,1);if(open(x,y+1))c.fillRect(px,py+T-1,T,1);if(open(x-1,y))c.fillRect(px,py,1,T);if(open(x+1,y))c.fillRect(px+T-1,py,1,T)}
      else if(ch==='-'){c.fillStyle='#ff8fc8';c.fillRect(px,py+3,T,2)}
      else if(ch==='.'){c.fillStyle='#ffd9b3';c.fillRect(px+3,py+3,2,2)}
      else if(ch==='o'&&Math.floor(G.t*4)%2){c.fillStyle='#4fe3b2';c.fillRect(px+2,py+1,4,6);c.fillRect(px+1,py+3,6,3);c.fillStyle='#fff';c.fillRect(px+3,py,2,1);c.fillRect(px+2,py+3,1,2)}}
    if(fruit){const px=10*T,py=OY+11*T;c.fillStyle='#ffd23f';c.fillRect(px+1,py+2,2,5);c.fillRect(px+2,py+5,5,2);c.fillRect(px+6,py+3,1,3);c.fillStyle='#6b4423';c.fillRect(px+1,py+1,2,1)}
    if(deadT<=0||deadT>1.4)for(const g of ghosts)drawGhost(c,g,G.t);
    drawGlove(c,player,G.t,deadT);
    for(const p of pops)G.text(String(p.s),p.x*T+4,OY+p.y*T-2,{size:6,align:'center',color:'#4fe3b2'});
    G.text('LV '+level,4,2,{size:7,color:'#ffd23f'});G.text('DOTS '+(dots||0),W-4,2,{size:7,color:'#9a93c7',align:'right'});
    for(let i=0;i<Math.max(0,lives-1);i++)drawGlove(c,{ax:0,ay:0,bx:0,by:0,p:1,dir:'right',moving:0,ox:4+i*11,oy:H-10},0,0);
    if(readyT>0&&G.state==='play')G.text('준비!',W/2,OY+11*T-1,{k:1,size:11,align:'center',color:'#ffd23f'});
  }
});
function eat(G){const x=player.bx,y=player.by;const ch=grid[y]&&grid[y][x];
  if(ch==='.'){grid[y][x]=' ';dots--;eaten++;G.add(10);if(eaten%2)G.sfx('tick')}
  else if(ch==='o'){grid[y][x]=' ';dots--;eaten++;G.add(50);fright=Math.max(1.2,(6.5-level*.5)/GD);ghostChain=0;G.sfx('power');
    for(const g of ghosts)if(g.st==='out'||g.st==='house'||g.st==='leave'){g.fr=true;if(g.st==='out')g.rev=1}}
  else return;
  if((eaten===60||eaten===140)&&!fruit)fruit={t:9};
  if(dots<=0){clearT=2.2;G.add(500);G.sfx('clear')}}
function target(g,pp){if(g.st==='eyes')return[10,7];
  if(mode==='scatter')return SCAT[g.i];
  const [dx,dy]=DIRS[player.dir];const px=player.bx,py=player.by;
  if(g.i===0)return[px,py];
  if(g.i===1)return[px+dx*4,py+dy*4];
  if(g.i===2){const r=ghosts[0];const ax=px+dx*2,ay=py+dy*2;return[ax*2-r.bx,ay*2-r.by]}
  const d=Math.hypot(g.bx-px,g.by-py);return d>7?[px,py]:SCAT[3]}
function dist(g,d,t){const [dx,dy]=DIRS[d];const nx=g.bx+dx,ny=g.by+dy;const pri={up:0,left:.01,down:.02,right:.03}[d];return (nx-t[0])**2+(ny-t[1])**2+pri}
function drawGlove(c,e,t,dead){const p=e.ox!=null?{x:0,y:0}:pos(e);let x=e.ox!=null?e.ox:p.x*T+4,y=e.oy!=null?e.oy:OY+p.y*T+4;
  c.save();c.translate(Math.round(x),Math.round(y));
  if(dead>0&&dead<2){const k=Math.min(1,(2-dead)/1.2);c.rotate(k*Math.PI*3);c.scale(1-k*.9,1-k*.9)}
  c.rotate({right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2}[e.dir]||0);
  const jab=e.moving&&Math.floor(t*14)%2?1:0;
  c.fillStyle='#fff';c.fillRect(-5,-3,2,6);
  c.fillStyle='#d92b2b';c.fillRect(-3+jab,-4,7,8);c.fillRect(-2+jab,-5,5,10);c.fillRect(4+jab,-3,1,6);
  c.fillStyle='#ff6b6b';c.fillRect(-1+jab,-4,4,2);
  c.fillStyle='#a31616';c.fillRect(-2+jab,2,4,2);c.fillRect(2+jab,-1,1,1);
  c.restore()}
function drawGhost(c,g,t){const p=pos(g);let x=Math.round(p.x*T),y=Math.round(OY+p.y*T);if(g.st==='house')y+=Math.round(Math.sin((g.bob||0)*6)*2);
  const fr=g.fr&&fright>0&&g.st!=='eyes';const flash=fr&&fright<2&&Math.floor(t*6)%2;
  if(g.st!=='eyes'){const col=fr?(flash?'#fff':'#2a3cff'):GCOL[g.i];
    c.fillStyle=fr?'#ffd23f':'#ffe680';c.fillRect(x+1,y-2,1,2);c.fillRect(x+6,y-2,1,2);
    c.fillStyle=col;c.fillRect(x+1,y,6,7);c.fillRect(x,y+2,8,5);c.fillRect(x+2,y-1,4,1);
    const w=Math.floor(t*8)%2;c.fillStyle='#04030c';if(w){c.fillRect(x+1,y+7,1,1);c.fillRect(x+4,y+7,1,1)}else{c.fillRect(x+2,y+7,1,1);c.fillRect(x+5,y+7,1,1)}
    if(fr){c.fillStyle=flash?'#ff3b3b':'#ffd9b3';c.fillRect(x+2,y+2,1,1);c.fillRect(x+5,y+2,1,1);c.fillRect(x+1,y+5,1,1);c.fillRect(x+3,y+4,2,1);c.fillRect(x+6,y+5,1,1);return}}
  const [dx,dy]=DIRS[g.dir]||[0,0];c.fillStyle='#fff';c.fillRect(x+1,y+2,3,3);c.fillRect(x+5,y+2,3,3);c.fillStyle='#1b1fff';c.fillRect(x+2+dx,y+3+dy,1,1);c.fillRect(x+6+dx,y+3+dy,1,1)}
</script>
</body>
</html>
