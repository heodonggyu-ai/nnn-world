# Codemagic 클라우드 빌드 설정 (맥 없이 iOS/Android 앱 만들기)
# 앱: 밍뉴툰 스튜디오 (apps/toon, Capacitor)
# 사용법: codemagic.io → 앱 선택 → "Start new build" → 워크플로 선택
workflows:
  toon-ios:
    name: 밍뉴툰 iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/toon
    integrations:
      app_store_connect: NNN API Key          # Codemagic에 등록한 App Store Connect API 키 이름
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nnnboxing.mingnyutoon
      vars:
        APP_STORE_APPLE_ID: 0000000000        # App Store Connect에서 앱 만든 뒤 'Apple ID'(숫자 10자리)로 바꾸기
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: 패키지 설치
        script: npm ci
      - name: 웹 파일을 iOS 프로젝트로 복사
        script: npx cap sync ios
      - name: 서명 프로필 적용
        script: xcode-project use-profiles
      - name: 빌드 번호 올리기
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          cd ios/App && agvtool new-version -all $(($LATEST + 1))
      - name: IPA 만들기
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - apps/toon/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  toon-android:
    name: 밍뉴툰 Android → AAB
    instance_type: mac_mini_m2               # 무료 빌드 시간(macOS)으로 안드로이드도 빌드
    max_build_duration: 60
    working_directory: apps/toon
    environment:
      android_signing:
        - mingnyutoon_keystore                 # Codemagic에 올린 업로드 키스토어 참조 이름
      node: 22
      java: 21
    scripts:
      - name: 패키지 설치
        script: npm ci
      - name: 웹 파일을 안드로이드 프로젝트로 복사
        script: npx cap sync android
      - name: AAB 만들기
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - apps/toon/android/app/build/outputs/**/*.aab
