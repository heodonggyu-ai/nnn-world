<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NNN 블록 쌓기</title>
<meta name="theme-color" content="#0d0b1e">
<link rel="icon" href="../shared/img/samsaek.png">
</head>
<body>
<script src="../shared/retro.js"></script>
<script>
/* 떨어지는 블록 쌓기: 10×20 판, 7종 블록, 줄을 꽉 채우면 사라져요 */
const CW=10,COLS=10,ROWS=20,BX=8,BY=14;
const SHAPES={
  I:[[0,1],[1,1],[2,1],[3,1]],O:[[1,0],[2,0],[1,1],[2,1]],T:[[1,0],[0,1],[1,1],[2,1]],
  S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]]};
const COL={I:'#3fd0ff',O:'#ffd23f',T:'#c46bff',S:'#5be37d',Z:'#ff5a6e',J:'#4f7dff',L:'#ff9b3d'};
const SIZE={I:4,O:4,T:3,S:3,Z:3,J:3,L:3};
let G0,startLv=1,board,cur,nextQ,hold,canHold,bag,lines,level,dropT,lockT,lockMoves,das,dasDir,arr,clearing,clearRows,clearT,softCount;
function rot(cells,n,size){let c=cells.map(p=>p.slice());for(let i=0;i<((n%4)+4)%4;i++)c=c.map(([x,y])=>[size-1-y,x]);return c}
function cellsOf(p){return rot(SHAPES[p.t],p.r,SIZE[p.t]).map(([x,y])=>[x+p.x,y+p.y])}
function fits(p){return cellsOf(p).every(([x,y])=>x>=0&&x<COLS&&y<ROWS&&(y<0||!board[y][x]))}
function fromBag(){if(!bag.length){bag='IOTSZJL'.split('');for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}return bag.pop()}
function spawn(t,G){cur={t,r:0,x:t==='O'?3:3,y:t==='I'?-1:0};lockT=0;lockMoves=0;canHold=canHold;
  if(!fits(cur)){cur.y--;if(!fits(cur)){G.over(`${lines}줄 · 레벨 ${level}`);}}}
function nextPiece(G){const t=nextQ.shift();nextQ.push(fromBag());spawn(t,G);canHold=true}
function gravity(){return Math.max(.012,Math.pow(.8-(level-1)*.007,level-1)/G0.diff)}
function tryMove(dx,dy){const p={...cur,x:cur.x+dx,y:cur.y+dy};if(fits(p)){cur=p;return true}return false}
function tryRot(d,G){const p={...cur,r:cur.r+d};const kicks=cur.t==='I'?[[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1]]:[[0,0],[-1,0],[1,0],[0,-1],[-1,-1],[1,-1]];
  for(const [kx,ky] of kicks){const q={...p,x:p.x+kx,y:p.y+ky};if(fits(q)){cur=q;G.sfx('turn');if(lockMoves<15){lockT=0;lockMoves++}return}}}
function grounded(){return !fits({...cur,y:cur.y+1})}
function lock(G){for(const [x,y] of cellsOf(cur)){if(y<0){G.over(`${lines}줄 · 레벨 ${level}`);return}board[y][x]=cur.t}
  G.sfx('land');
  const full=[];for(let y=0;y<ROWS;y++)if(board[y].every(Boolean))full.push(y);
  if(full.length){clearing=true;clearRows=full;clearT=0;const pts=[0,100,300,500,800][full.length]*level;G.add(pts);
    full.length===4?(G.sfx('clear'),G.msg('블록 4줄! 대박!')):G.sfx('coin');cur=null}
  else nextPiece(G)}
function hardDrop(G){let n=0;while(tryMove(0,1))n++;G.add(n*2);lock(G)}
Retro.boot({id:'blocks',title:'NNN 블록 쌓기',en:'FALLING BLOCKS',w:184,h:224,a:'돌리기',b:'보관',diag:false,
  stages:{label:'레벨',max:30},options:[{k:'ghost',label:'떨어질 자리 미리보기',ch:[['off','끄기'],['on','켜기']],def:'off',note:'켜면 쉬워져요'}],
  intro:'떨어지는 블록을 돌리고 옮겨서 가로 한 줄을 꽉 채우면 사라져요!',
  help:'<b>◀ ▶</b> 옮기기 · <b>▼</b> 빨리 내리기<br><b>▲</b> 한 번에 쾅 내리기<br><b>A</b> 돌리기 · <b>B</b> 보관(바꿔치기)<br>화면을 톡 쳐도 돌아가요. 10줄마다 레벨 업! (최대 30레벨까지 점점 빨라져요)',
  init(G){G0=G;startLv=G.start;board=Array.from({length:ROWS},()=>Array(COLS).fill(null));bag=[];nextQ=[fromBag(),fromBag(),fromBag()];hold=null;canHold=true;
    lines=0;level=startLv;dropT=0;das=0;dasDir=0;arr=0;clearing=false;softCount=0;nextPiece(G)},
  update(G,dt){
    if(clearing){clearT+=dt;if(clearT>.28){for(const y of clearRows){board.splice(y,1);board.unshift(Array(COLS).fill(null))}
        const old=level;lines+=clearRows.length;level=startLv+Math.floor(lines/10);if(level>old){G.msg('레벨 '+level+'!');G.sfx('power');G.reach(level)}
        clearing=false;nextPiece(G)}return}
    if(!cur)return;const k=G.keys,h=G.hit;
    if(h.a||h.tap)tryRot(1,G);
    if(h.b&&canHold){const t=cur.t;if(hold){spawn(hold,G)}else nextPiece(G);hold=t;canHold=false;G.sfx('blip')}
    if(h.up){hardDrop(G);return}
    if(h.swipe==='left')tryMove(-1,0);if(h.swipe==='right')tryMove(1,0);if(h.swipe==='down'){hardDrop(G);return}
    const dir=(k.right?1:0)-(k.left?1:0);
    if(dir!==dasDir){dasDir=dir;das=0;arr=0;if(dir&&tryMove(dir,0)){G.sfx('move');if(lockMoves<15&&grounded()){lockT=0;lockMoves++}}}
    else if(dir){das+=dt;if(das>.16){arr+=dt;while(arr>.045){arr-=.045;if(tryMove(dir,0)&&lockMoves<15&&grounded()){lockT=0;lockMoves++}}}}
    const g=k.down?Math.min(gravity(),.03):gravity();
    dropT+=dt;while(dropT>=g){dropT-=g;if(tryMove(0,1)){if(k.down)G.add(1)}else break}
    if(grounded()){lockT+=dt;if(lockT>.5)lock(G)}else lockT=0;
  },
  draw(G,c){
    c.fillStyle='#120f26';c.fillRect(0,0,G.W,G.H);
    c.fillStyle='#07060f';c.fillRect(BX-2,BY-2,COLS*CW+4,ROWS*CW+4);
    c.strokeStyle='#3a3270';c.lineWidth=2;c.strokeRect(BX-3,BY-3,COLS*CW+6,ROWS*CW+6);
    c.fillStyle='#16132e';for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if((x+y)%2)c.fillRect(BX+x*CW,BY+y*CW,CW,CW);
    const blk=(x,y,t,a)=>{const px=BX+x*CW,py=BY+y*CW;c.globalAlpha=a||1;c.fillStyle=COL[t];c.fillRect(px+1,py+1,CW-2,CW-2);
      c.fillStyle='rgba(255,255,255,.45)';c.fillRect(px+2,py+2,CW-5,2);c.fillRect(px+2,py+2,2,CW-5);
      c.fillStyle='rgba(0,0,0,.28)';c.fillRect(px+2,py+CW-3,CW-4,1);c.fillRect(px+CW-3,py+2,1,CW-4);c.globalAlpha=1};
    if(board)for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(board[y][x]){
      if(clearing&&clearRows.includes(y)){c.fillStyle=(Math.floor(clearT*20)%2)?'#fff':'#ffd23f';c.fillRect(BX+x*CW,BY+y*CW,CW,CW)}else blk(x,y,board[y][x])}
    if(cur&&G.state!=='over'){let g={...cur};while(fits({...g,y:g.y+1}))g.y++;
      if(G.opt('ghost')==='on')for(const [x,y] of cellsOf(g))if(y>=0){c.strokeStyle=COL[cur.t];c.globalAlpha=.5;c.lineWidth=1;c.strokeRect(BX+x*CW+1.5,BY+y*CW+1.5,CW-3,CW-3);c.globalAlpha=1}
      for(const [x,y] of cellsOf(cur))if(y>=0)blk(x,y,cur.t)}
    const SX=118;const mini=(t,x,y)=>{if(!t)return;const cs=rot(SHAPES[t],0,SIZE[t]);const s=6;const ox=t==='I'||t==='O'?-3:0;
      for(const [a,b] of cs){c.fillStyle=COL[t];c.fillRect(x+ox+a*s,y+b*s,s-1,s-1);c.fillStyle='rgba(255,255,255,.4)';c.fillRect(x+ox+a*s,y+b*s,s-1,1)}};
    G.text('NEXT',SX,BY,{color:'#9a93c7',size:7});
    if(nextQ)nextQ.forEach((t,i)=>mini(t,SX+6,BY+12+i*22));
    G.text('HOLD',SX,BY+84,{color:'#9a93c7',size:7});c.fillStyle='#07060f';c.fillRect(SX,BY+95,52,24);
    mini(hold,SX+12,BY+100);
    G.text('LEVEL',SX,BY+132,{color:'#9a93c7',size:7});G.text(String(level||1),SX,BY+143,{color:'#ffd23f',size:10});
    G.text('LINES',SX,BY+162,{color:'#9a93c7',size:7});G.text(String(lines||0),SX,BY+173,{color:'#4fe3b2',size:10});
  }
});
</script>
</body>
</html>
