<title>인생샷 남친 — 여자친구·아내 사진 가이드</title>
<style>
.ng{border-radius:20px;background:var(--bg);padding:14px;margin-bottom:14px}
.ng h4{margin:0 0 4px;font-size:16px;font-weight:800;letter-spacing:-.02em}
.ng p{margin:0 0 12px;font-size:13.5px;line-height:1.55;color:var(--sub)}
.ng .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ng figure{margin:0}
.ng canvas{width:100%;aspect-ratio:3/4;display:block;border-radius:14px;border:3px solid}
.ng .bad canvas{border-color:#FF5A6E}.ng .good canvas{border-color:#2FC77A}
.ng figcaption{font-size:12.5px;font-weight:700;margin-top:6px;line-height:1.4;display:flex;gap:4px;align-items:flex-start}
.ng .bad figcaption{color:#E0364D}.ng .good figcaption{color:#1E9E5E}
.ng figcaption .ic{width:15px;height:15px;flex:none;margin-top:1px}
.ck{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--bg);margin-bottom:8px;cursor:pointer}
.ck input{appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--card);flex:none;margin:0;display:grid;place-items:center}
.ck input:checked{background:var(--accent);border-color:var(--accent)}
.ck input:checked::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ck b{display:block;font-size:15px;margin-bottom:3px}
.ck small{color:var(--sub);font-size:13px;line-height:1.5}
.mini{position:relative;width:60px;height:80px;border-radius:10px;overflow:hidden;border:2.5px solid;display:block}
.mini canvas{width:100%;height:100%;display:block}
.mini.bad{border-color:#FF5A6E;transform:rotate(-5deg)}.mini.good{border-color:#2FC77A;transform:rotate(4deg) translateY(-4px)}
.mini i{position:absolute;right:3px;bottom:3px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;color:#fff}
.mini.bad i{background:#FF5A6E}.mini.good i{background:#2FC77A}
.ckdone{text-align:center;font-weight:800;margin:14px 0 4px}
</style>
</head>

<script>
(function(){

const street=(c,w,h)=>O.wall(c,w,h,'#ece4d8',.8,'#b3a592'),soft=(c,w,h)=>O.studio(c,w,h,'#f3dfe6'),

 {t:'위에서 내려찍기',p:'남자 키 높이에서 찍으면 머리는 크고 다리는 짧아져요. 폰을 무릎 높이로 내리세요.',

];
const CK=[['렌즈 닦기','옷에 한 번 쓱. 뿌연 사진의 대부분은 지문이에요.'],['카메라 격자 켜기','아이폰: 설정 → 카메라 → 격자 / 갤럭시: 카메라 → 설정 → 수직/수평 안내선'],['2x 줌으로 찍기','1x로 가까이 가면 얼굴이 넓어져요. 한두 걸음 물러나서 2x로 찍으세요.'],

 ['말 걸면서 찍기','"하나 둘 셋" 대신 대화하면서. 웃긴 얘기 하나 준비하기.'],['찍고 바로 보여주기','"어떤 게 제일 맘에 들어?" 하고 고르게 해주면 다음 사진도 협조적이에요.']];

  heroIds:['st_hair_flip','st_twirl_dress','st_golden_backlight','st_blossom_tunnel','st_look_back','st_follow_me'],

  filter:it=>!['basic','land','sport','pet'].includes(it.cat),
  galleryTitle:'인생샷 구도',searchPH:'카페, 노을, 전신, 커플…',

  scenarioTitle:'어디서 찍어요?',scenarioSub:'장소를 고르면 어울리는 구도와 포즈 멘트를 준비해요',
  scenarios:[
   {id:'cafe',cover:'st_window_outside',icon:'cafe',name:'카페',sub:'창가 자리 일상',g:['off','close','half','st_laugh_cover','st_coffee_walk','st_window_outside','st_detail_hands'],auto:1,

    m:['나 쪽으로 천천히 걸어와봐','한 발 앞으로 내밀어줘','한쪽 다리에 체중 실어봐','가방 끈 잡고 아래 봐줘'],t:['폰을 무릎 높이로! 쪼그려 앉아서 찍으면 다리가 길어 보여요','발끝을 화면 맨 아래에, 머리 위는 조금만','걷는 장면은 연사로 — 다리가 벌어진 순간이 예뻐요']},
   {id:'travel',cover:'st_follow_me',icon:'plane',name:'여행 명소',sub:'배경도 그녀도',g:['travel','st_landmark_split','st_back_view_vista','st_back_walk','st_look_back','st_follow_me','st_alley_life'],

   {id:'sunset',cover:'st_golden_backlight',icon:'sun',name:'바다·노을',sub:'역광에도 얼굴 살리기',g:['profile','st_golden_backlight','st_couple_sunset_sil','st_window_sil','st_hair_flip'],

   {id:'flower',cover:'st_blossom_tunnel',icon:'flower',name:'꽃·벚꽃',sub:'꽃이 감싸게',g:['close','st_bouquet_hold','st_twirl_dress','st_blossom_tunnel','st_tulip_low','st_sunflower_field'],

   {icon:'book',title:'남친 사진학원',sub:'남자들이 꼭 하는 실수 7가지, 고친 사진과 나란히 비교해요',cta:'7개 수업 보기',tint:1,

    art(el){let st=[];try{st=JSON.parse(localStorage.getItem(LSK)||'[]')}catch(e){}const n=st.filter(Boolean).length,T=CK.length,R=36,L=2*Math.PI*R;

    open(A){let st=[];try{st=JSON.parse(localStorage.getItem(LSK)||'[]')}catch(e){}
     A.openSheet('찍기 전 체크리스트',CK.map(([t,s],i)=>`<label class="ck"><input type="checkbox" data-i="${i}" ${st[i]?'checked':''}><div><b>${t}</b><small>${s}</small></div></label>`).join('')+'<div class="ckdone" id="ckD"></div>');
     const upd=()=>{const v=[...document.querySelectorAll('.ck input')].map(x=>x.checked);try{localStorage.setItem(LSK,JSON.stringify(v))}catch(e){}const n=v.filter(Boolean).length;document.getElementById('ckD').textContent=n===CK.length?'준비 완료. 이제 찍으러 가요':`${n} / ${CK.length} 완료`;A.refresh&&A.refresh()};
     document.getElementById('shB').onchange=upd;upd()}},
