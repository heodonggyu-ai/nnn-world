<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NNN 오목</title>
<meta name="theme-color" content="#F3E6CC">
<link rel="icon" href="../shared/img/samsaek.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 세로 화면: 위=두 사람 이름표(차례 표시), 가운데=정사각형 바둑판, 아래=무르기·새 판 버튼 */
:root{--paper:#F3E6CC;--wood:#E2B66E;--wood2:#D9A85A;--ink:#2B2118;--mute:#7A6A55;--line:rgba(43,33,24,.18);--red:#E5534B;--green:#3E8E5E;--gold:#FFC93C;
  --f-display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0}
.wrap{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left,0px));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px}.top .g{flex:1}
.icon{width:42px;height:42px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-size:17px;display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.top h1{font-size:26px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{display:flex;align-items:center;gap:8px;background:#fff;border:2.5px solid var(--line);border-radius:14px;padding:8px 10px;transition:all .2s}
.pl.on{border-color:var(--ink);box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.pl .st{width:26px;height:26px;border-radius:50%;flex:none}
.pl .st.b{background:radial-gradient(circle at 35% 30%,#666,#111 60%)}
.pl .st.w{background:radial-gradient(circle at 35% 30%,#fff,#d8d8d8 70%);border:1px solid #aaa}
.pl b{font-family:var(--f-display);font-weight:400;font-size:17px;display:block;line-height:1.1}
.pl small{color:var(--mute);font-size:12px}
.boardbox{position:relative;width:100%;aspect-ratio:1;border-radius:10px;box-shadow:0 6px 0 #9C7440,0 10px 24px rgba(0,0,0,.18)}
canvas{display:block;width:100%;height:100%;border-radius:10px;touch-action:manipulation}
.msg{min-height:26px;text-align:center;font-family:var(--f-display);font-size:18px}
.msg.warn{color:var(--red)}
.btns{display:flex;gap:8px}
.btn{flex:1;min-height:52px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;font-family:var(--f-display);font-size:18px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.main{background:var(--red);color:#fff}
.btn:disabled{opacity:.4;pointer-events:none}
.panel{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:16px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.lbl{font-family:var(--f-display);font-size:15px;color:var(--mute);margin:12px 0 6px}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:6px}
.seg button{border:2.5px solid var(--ink);border-radius:12px;background:#fff;padding:9px 4px;font-family:var(--f-display);font-size:16px;line-height:1.15}
.seg button small{display:block;font-family:var(--f-body);font-size:11.5px;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}.seg button.on small{color:#ddd}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:700}
.chk input{width:20px;height:20px}
.over{position:fixed;inset:0;background:rgba(43,33,24,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.over .panel{max-width:380px;width:100%;text-align:center}
.over .big{font-size:64px;line-height:1}
.rec{font-size:13px;color:var(--mute);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="icon" id="back" href="../" aria-label="NNN 월드로">←</a><div class="g"><h1>⚫ NNN 오목</h1></div><button class="icon" id="menuBtn" aria-label="설정">⚙</button></div>
  <div class="players"><div class="pl" id="pB"><span class="st b"></span><div><b id="nB">나</b><small id="sB">흑 · 먼저</small></div></div><div class="pl" id="pW"><span class="st w"></span><div><b id="nW">컴퓨터</b><small id="sW">백</small></div></div></div>
  <div class="boardbox"><canvas id="cv"></canvas></div>
  <div class="msg" id="msg">가로·세로·대각선으로 다섯 개를 먼저 놓으면 이겨요!</div>
  <div class="btns"><button class="btn" id="undo">↶ 무르기</button><button class="btn main" id="place" hidden>여기에 두기</button><button class="btn" id="newG">새 판</button></div>
  <div class="rec" id="rec"></div>
</div>

<div class="over" id="setup" hidden><div class="panel">
  <h2>오목 시작</h2>
  <div class="lbl">누구랑 할까요?</div>
  <div class="seg" style="--n:2" id="sMode"><button data-v="ai">🤖 컴퓨터<small>혼자 하기</small></button><button data-v="two">👫 둘이서<small>폰 하나로 번갈아</small></button></div>
  <div id="aiOpts"><div class="lbl">컴퓨터 실력</div><div class="seg" id="sLv"><button data-v="0">쉬움</button><button data-v="1">보통</button><button data-v="2">어려움</button></div>
    <div class="lbl">내 돌</div><div class="seg" style="--n:2" id="sCol"><button data-v="b">⚫ 흑 (먼저)</button><button data-v="w">⚪ 백 (나중)</button></div></div>
  <label class="chk"><input type="checkbox" id="r33"> 쌍삼(3·3) 금지</label>
  <label class="chk"><input type="checkbox" id="tap2"> 두 번 눌러서 두기 (실수 방지)</label>
  <div style="margin-top:14px"><button class="btn main" style="width:100%" id="go">시작!</button></div>
</div></div>

<div class="over" id="end" hidden><div class="panel"><div class="big" id="eE">🏆</div><h2 id="eT">흑 승리!</h2><p id="eS" style="color:var(--mute)"></p><div class="btns"><button class="btn" id="eView">판 보기</button><button class="btn main" id="eAgain">한 판 더</button></div></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
if(window.top!==window)$('back').hidden=true;
const N=15,EMPTY=0,BL=1,WH=2;
const store={get(k,d){try{const v=localStorage.getItem('nnnomok.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('nnnomok.'+k,JSON.stringify(v))}catch(e){}}};
const O=Object.assign({mode:'ai',lv:1,col:'b',r33:true,tap2:TOUCHY()},store.get('opt',{}));
function TOUCHY(){return matchMedia('(pointer:coarse)').matches}
let B=new Uint8Array(N*N),hist=[],turn=BL,over=false,ghost=-1,winLine=null,thinking=false;
const at=(x,y)=>x<0||y<0||x>=N||y>=N?-1:B[y*N+x];
const DIRS=[[1,0],[0,1],[1,1],[1,-1]];

/* ---------- 규칙 ---------- */
function lineLen(x,y,c,dx,dy){let n=1,i=1;while(at(x+dx*i,y+dy*i)===c){n++;i++}i=1;while(at(x-dx*i,y-dy*i)===c){n++;i++}return n}
function winAt(x,y,c){for(const [dx,dy] of DIRS){if(lineLen(x,y,c,dx,dy)>=5){let s=0;while(at(x-dx*(s+1),y-dy*(s+1))===c)s++;let e=0;while(at(x+dx*(e+1),y+dy*(e+1))===c)e++;return[[x-dx*s,y-dy*s],[x+dx*e,y+dy*e]]}}return null}
// 열린 4: 빈칸-돌4-빈칸
function openFourDir(x,y,c,dx,dy){// (x,y)에 이미 c가 놓여 있다고 보고
  for(let s=-4;s<=0;s++){let ok=true;for(let k=0;k<4;k++){if(at(x+dx*(s+k),y+dy*(s+k))!==c){ok=false;break}}if(!ok)continue;
    if(at(x+dx*(s-1),y+dy*(s-1))===EMPTY&&at(x+dx*(s+4),y+dy*(s+4))===EMPTY)return true}return false}
// 열린 3: 한 수 더 두면 열린 4가 되는 줄
function openThreeDir(x,y,c,dx,dy){for(let k=-4;k<=4;k++){if(!k)continue;const ex=x+dx*k,ey=y+dy*k;if(at(ex,ey)!==EMPTY)continue;B[ey*N+ex]=c;const f=openFourDir(ex,ey,c,dx,dy)&&lineLen(ex,ey,c,dx,dy)===4;B[ey*N+ex]=EMPTY;if(f)return true}return false}
function isDouble3(x,y,c){if(!O.r33)return false;const i=y*N+x;B[i]=c;if(winAt(x,y,c)){B[i]=EMPTY;return false}let n=0;for(const [dx,dy] of DIRS)if(openThreeDir(x,y,c,dx,dy))n++;B[i]=EMPTY;return n>=2}
function legal(x,y,c){return at(x,y)===EMPTY&&!isDouble3(x,y,c)}

/* ---------- 컴퓨터: 5칸 창 점수 + 수 읽기 ---------- */
const WT=[0,2,25,300,4000,1e6];
function cellScore(x,y,c){const o=3-c;let sc=0;
  for(const [dx,dy] of DIRS)for(let s=-4;s<=0;s++){let mine=0,bad=false;for(let k=0;k<5;k++){const v=(s+k===0)?c:at(x+dx*(s+k),y+dy*(s+k));if(v===-1||v===o){bad=true;break}if(v===c)mine++}if(!bad)sc+=WT[mine]}
  return sc}
function candidates(){const out=[];let any=false;for(let i=0;i<N*N;i++)if(B[i]){any=true;break}if(!any)return[7*N+7];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(B[y*N+x])continue;let near=false;for(let dy=-2;dy<=2&&!near;dy++)for(let dx=-2;dx<=2;dx++){const v=at(x+dx,y+dy);if(v>0){near=true;break}}if(near)out.push(y*N+x)}return out}
function evalMove(i,c,lv){const x=i%N,y=(i/N)|0;const a=cellScore(x,y,c),d=cellScore(x,y,3-c);return a*(lv===2?1.1:1)+d*(lv===0?.55:1)}
function aiMove(c){const lv=O.lv;let cand=candidates().filter(i=>legal(i%N,(i/N)|0,c));if(!cand.length)return -1;
  // 1) 바로 이기기 2) 바로 막기
  for(const i of cand){B[i]=c;const w=winAt(i%N,(i/N)|0,c);B[i]=0;if(w)return i}
  for(const i of cand){B[i]=3-c;const w=winAt(i%N,(i/N)|0,3-c);B[i]=0;if(w&&(lv>0||Math.random()<.6))return i}
  let sc=cand.map(i=>({i,s:evalMove(i,c,lv)})).sort((a,b)=>b.s-a.s);
  if(lv===2){// 위쪽 후보 몇 개를 상대 최선 응수까지 읽어 보기
    const top=sc.slice(0,8);top.forEach(o=>{B[o.i]=c;const opp=candidates().filter(j=>legal(j%N,(j/N)|0,3-c));let best=0;for(const j of opp){const v=evalMove(j,3-c,2);if(v>best)best=v}B[o.i]=0;o.s=o.s-best*.55});top.sort((a,b)=>b.s-a.s);sc=top}
  if(lv===0){const k=Math.min(sc.length,4);return sc[Math.floor(Math.random()*k)].i}
  if(lv===1&&sc.length>1&&Math.random()<.15)return sc[1].i;
  return sc[0].i}

/* ---------- 그리기 ---------- */
const cv=$('cv'),g=cv.getContext('2d');let S=0,M=0,CELL=0;
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2.5);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);S=cv.width;M=S/(N+1);CELL=M;draw()}
addEventListener('resize',resize);
function px(i){return M+i*CELL}
function stone(x,y,c,alpha=1){const cx=px(x),cy=px(y),r=CELL*.46;g.save();g.globalAlpha=alpha;
  g.beginPath();g.arc(cx+r*.08,cy+r*.12,r,0,7);g.fillStyle='rgba(0,0,0,.25)';g.fill();
  const gr=g.createRadialGradient(cx-r*.35,cy-r*.35,r*.1,cx,cy,r);if(c===BL){gr.addColorStop(0,'#6b6b6b');gr.addColorStop(.6,'#1a1a1a');gr.addColorStop(1,'#000')}else{gr.addColorStop(0,'#ffffff');gr.addColorStop(.7,'#e6e6e2');gr.addColorStop(1,'#bdbdb6')}
  g.beginPath();g.arc(cx,cy,r,0,7);g.fillStyle=gr;g.fill();g.restore()}
function draw(){if(!S)return;const wg=g.createLinearGradient(0,0,S,S);wg.addColorStop(0,'#E8BF78');wg.addColorStop(1,'#D9A85A');g.fillStyle=wg;g.fillRect(0,0,S,S);
  g.strokeStyle='rgba(120,80,30,.12)';g.lineWidth=S/300;for(let i=0;i<40;i++){g.beginPath();const y=(i/40)*S+Math.sin(i)*6;g.moveTo(0,y);g.bezierCurveTo(S*.3,y+8,S*.6,y-8,S,y+4);g.stroke()}
  g.strokeStyle='#3b2a14';g.lineWidth=Math.max(1,S/500);for(let i=0;i<N;i++){g.beginPath();g.moveTo(px(0),px(i));g.lineTo(px(N-1),px(i));g.stroke();g.beginPath();g.moveTo(px(i),px(0));g.lineTo(px(i),px(N-1));g.stroke()}
  g.lineWidth=Math.max(2,S/260);g.strokeRect(px(0),px(0),CELL*(N-1),CELL*(N-1));
  g.fillStyle='#3b2a14';[[3,3],[11,3],[7,7],[3,11],[11,11]].forEach(([x,y])=>{g.beginPath();g.arc(px(x),px(y),CELL*.12,0,7);g.fill()});
  for(let i=0;i<N*N;i++)if(B[i])stone(i%N,(i/N)|0,B[i]);
  const last=hist[hist.length-1];if(last!=null){g.beginPath();g.arc(px(last%N),px((last/N)|0),CELL*.14,0,7);g.fillStyle='#E5534B';g.fill()}
  if(ghost>=0&&!B[ghost]){stone(ghost%N,(ghost/N)|0,turn,.55);g.strokeStyle='#E5534B';g.lineWidth=S/300;g.strokeRect(px(ghost%N)-CELL/2,px((ghost/N)|0)-CELL/2,CELL,CELL)}
  if(winLine){g.strokeStyle='rgba(229,83,75,.9)';g.lineWidth=CELL*.22;g.lineCap='round';g.beginPath();g.moveTo(px(winLine[0][0]),px(winLine[0][1]));g.lineTo(px(winLine[1][0]),px(winLine[1][1]));g.stroke()}}

/* ---------- 진행 ---------- */
const human=c=>O.mode==='two'||(O.col==='b'?c===BL:c===WH);
function names(){const me=O.col==='b'?BL:WH;$('nB').textContent=O.mode==='two'?'흑':me===BL?'나':'컴퓨터';$('nW').textContent=O.mode==='two'?'백':me===WH?'나':'컴퓨터';
  $('pB').classList.toggle('on',turn===BL&&!over);$('pW').classList.toggle('on',turn===WH&&!over);
  $('place').hidden=!(O.tap2&&ghost>=0);$('undo').disabled=!hist.length||thinking||over&&false}
function say(t,warn){$('msg').textContent=t;$('msg').classList.toggle('warn',!!warn)}
let AC=null;function click(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gg=AC.createGain(),t=AC.currentTime;o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(110,t+.06);gg.gain.setValueAtTime(.25,t);gg.gain.exponentialRampToValueAtTime(.0001,t+.08);o.connect(gg).connect(AC.destination);o.start(t);o.stop(t+.1)}catch(e){}}
function play(i){const x=i%N,y=(i/N)|0;if(!legal(x,y,turn)){say('쌍삼(3·3)은 둘 수 없어요!',true);return false}
  B[i]=turn;hist.push(i);ghost=-1;click();const w=winAt(x,y,turn);
  if(w){winLine=w;over=true;draw();names();setTimeout(()=>finish(turn),500);return true}
  if(hist.length===N*N){over=true;draw();finish(0);return true}
  turn=3-turn;
  {let any=false;for(let k=0;k<N*N&&!any;k++)if(!B[k]&&legal(k%N,(k/N)|0,turn))any=true;if(!any){over=true;draw();names();finish(0);return true}}
  draw();names();say(human(turn)?(O.mode==='two'?`${turn===BL?'흑':'백'} 차례예요`:'내 차례예요'):'컴퓨터가 생각 중…');
  if(!human(turn)&&!over){thinking=true;names();setTimeout(()=>{const m=aiMove(turn);thinking=false;if(m>=0)play(m)},350)}
  return true}
cv.addEventListener('pointerdown',e=>{if(over||thinking||!human(turn))return;const r=cv.getBoundingClientRect(),d=cv.width/r.width;const x=Math.round(((e.clientX-r.left)*d-M)/CELL),y=Math.round(((e.clientY-r.top)*d-M)/CELL);if(x<0||y<0||x>=N||y>=N)return;const i=y*N+x;if(B[i])return;
  if(!legal(x,y,turn)){say('쌍삼(3·3)은 둘 수 없어요!',true);ghost=-1;draw();return}
  if(O.tap2&&ghost!==i){ghost=i;draw();names();say('한 번 더 누르거나 "여기에 두기"를 눌러요');return}play(i)});
$('place').onclick=()=>{if(ghost>=0)play(ghost)};
$('undo').onclick=()=>{if(thinking||!hist.length)return;over=false;winLine=null;$('end').hidden=true;const n=O.mode==='ai'?(human(turn)?2:1):1;for(let k=0;k<n&&hist.length;k++){B[hist.pop()]=0;turn=3-turn}
  if(O.mode==='ai'&&!human(turn)&&hist.length===0){/* 컴퓨터가 흑이면 다시 첫 수 */setTimeout(()=>play(aiMove(turn)),300)}ghost=-1;draw();names();say('한 수 물렀어요')};
function finish(w){const R=store.get('rec',{w:0,l:0});let e='🤝',t='무승부!',s='';
  if(w){if(O.mode==='ai'){const me=O.col==='b'?BL:WH;if(w===me){R.w++;e='🏆';t='내가 이겼어요!'}else{R.l++;e='🤖';t='컴퓨터가 이겼어요'};store.set('rec',R)}else{e='🏆';t=(w===BL?'흑':'백')+' 승리!'}}
  s=`${hist.length}수 만에 끝났어요`;$('eE').textContent=e;$('eT').textContent=t;$('eS').textContent=s;$('end').hidden=false;rec()}
function rec(){const R=store.get('rec',{w:0,l:0});$('rec').textContent=O.mode==='ai'?`컴퓨터와 전적 ${R.w}승 ${R.l}패 · ${['쉬움','보통','어려움'][O.lv]}`:''}
function newGame(){B=new Uint8Array(N*N);hist=[];turn=BL;over=false;ghost=-1;winLine=null;thinking=false;draw();names();rec();
  say(O.r33?'다섯 개를 먼저 놓으면 승리! (쌍삼 금지)':'다섯 개를 먼저 놓으면 승리!');
  if(!human(BL)){thinking=true;setTimeout(()=>{thinking=false;play(7*N+7)},400)}}
/* ---------- 설정 ---------- */
function seg(id,key){const el=$(id);const paint=()=>el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(O[key])===b.dataset.v));el.onclick=e=>{const b=e.target.closest('button');if(!b)return;O[key]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;paint();$('aiOpts').hidden=O.mode!=='ai'};paint()}
function openSetup(){seg('sMode','mode');seg('sLv','lv');seg('sCol','col');$('r33').checked=O.r33;$('tap2').checked=O.tap2;$('aiOpts').hidden=O.mode!=='ai';$('setup').hidden=false}
$('go').onclick=()=>{O.r33=$('r33').checked;O.tap2=$('tap2').checked;store.set('opt',O);$('setup').hidden=true;newGame()};
$('menuBtn').onclick=openSetup;$('newG').onclick=openSetup;
$('eAgain').onclick=()=>{$('end').hidden=true;newGame()};$('eView').onclick=()=>$('end').hidden=true;
resize();openSetup();names();
</script>
</body>
</html>
